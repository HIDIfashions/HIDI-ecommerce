name: Publish saved production drafts
on:
  push:
    branches: [migration/azure-sql-blob]
    paths: [.github/workflows/publish-saved-drafts.yml]
permissions:
  contents: read
  id-token: write
concurrency:
  group: hidi-draft-publication
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: azure/login@v2
        with:
          client-id: 3d62eb64-29dc-48ee-ab35-093312bd50af
          tenant-id: e756fdc0-2646-4e94-ac4d-ed7c11f87f34
          subscription-id: 91d9572d-0f0b-47fe-802d-0eef36d7c719
      - name: Capture current draft statuses and versions without writes
        run: python3 deploy/bulk-publish/publish-saved-drafts.py inspect
      - name: Preserve draft status backup before publication
        uses: actions/upload-artifact@v4
        with:
          name: saved-draft-status-backup-${{ github.run_id }}
          path: evidence/draft-publication/draft-snapshot.json
          retention-days: 30
      - name: Publish captured drafts through retained product service
        run: python3 deploy/bulk-publish/publish-saved-drafts.py publish
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: saved-draft-publication-results-${{ github.run_id }}
          path: evidence/draft-publication
          retention-days: 30
