name: Install HIDI India Cloudflare visitor tracking
on:
  push:
    branches: [migration/azure-sql-blob]
    paths: [.github/workflows/cloudflare-analytics-release.yml]
permissions:
  contents: read
  id-token: write
concurrency:
  group: hidi-hero-guarded-release
  cancel-in-progress: false
jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      HIDI_PLAYWRIGHT_MODULE: /tmp/hidi-cloudflare-analytics-browser/node_modules/playwright/index.mjs
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 24}
      - name: Verify optional tracker and original analytics syntax
        run: |
          node --check deploy/cloudflare-analytics/loader.js
          node --check deploy/cloudflare-analytics/browser.mjs
          node --check deploy/cloudflare-analytics/beacon-live.mjs
          node --test deploy/cloudflare-analytics/loader.test.mjs
          python3 -m py_compile deploy/cloudflare-analytics/release.py
      - name: Install exact-manifest registry copy tooling
        run: sudo apt-get update && sudo apt-get install -y skopeo
      - name: Install browser verification tooling
        run: |
          npm install --prefix /tmp/hidi-cloudflare-analytics-browser --no-save playwright@1.56.1
          node /tmp/hidi-cloudflare-analytics-browser/node_modules/playwright/cli.js install --with-deps chromium
      - uses: azure/login@v2
        with:
          client-id: 3d62eb64-29dc-48ee-ab35-093312bd50af
          tenant-id: e756fdc0-2646-4e94-ac4d-ed7c11f87f34
          subscription-id: 91d9572d-0f0b-47fe-802d-0eef36d7c719
      - name: Back up current image and create analytics-only candidate
        run: |
          az acr login --name acrhidiprod0927 --only-show-errors
          python3 -u deploy/cloudflare-analytics/release.py capture
          python3 -u deploy/cloudflare-analytics/release.py compose
      - name: Verify tracker and existing cart and purchase analytics on desktop and mobile
        run: node deploy/cloudflare-analytics/browser.mjs
      - name: Publish only the tested analytics asset overlay
        run: python3 -u deploy/cloudflare-analytics/release.py publish
      - uses: azure/login@v2
        with:
          client-id: 3d62eb64-29dc-48ee-ab35-093312bd50af
          tenant-id: e756fdc0-2646-4e94-ac4d-ed7c11f87f34
          subscription-id: 91d9572d-0f0b-47fe-802d-0eef36d7c719
      - name: Release and verify unchanged pages and deployed purchase tracking
        id: apply
        timeout-minutes: 15
        run: python3 -u deploy/cloudflare-analytics/release.py apply --image "$WEB_IMAGE"
      - uses: azure/login@v2
        if: always() && env.WEB_IMAGE != '' && steps.apply.outcome != 'success'
        with:
          client-id: 3d62eb64-29dc-48ee-ab35-093312bd50af
          tenant-id: e756fdc0-2646-4e94-ac4d-ed7c11f87f34
          subscription-id: 91d9572d-0f0b-47fe-802d-0eef36d7c719
      - name: Recover only an interrupted owned rollout
        if: always() && env.WEB_IMAGE != '' && steps.apply.outcome != 'success'
        run: python3 -u deploy/cloudflare-analytics/release.py recover --image "$WEB_IMAGE"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cloudflare-analytics-verification-${{ github.run_id }}-${{ github.run_attempt }}
          path: evidence/cloudflare-analytics
          retention-days: 30

# Verify confirmed purchases, reload duplicates, review and failed payments.

# Preserve OCI manifests using existing registry data-plane authentication.

# Wait for original product selection readiness without toggling repeatedly.
