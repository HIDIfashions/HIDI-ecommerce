name: Azure Firebase auth readiness
on:
  push:
    branches: [migration/azure-sql-blob]
    paths:
      - '.github/workflows/azure-firebase-auth.yml'
      - 'deploy/configure-firebase-auth.mjs'
      - 'deploy/customer-auth-db.mjs'
permissions:
  contents: read
  id-token: write
concurrency:
  group: hidi-azure-${{ github.ref }}
  cancel-in-progress: false
jobs:
  configure:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: azure/login@v2
        with:
          client-id: 3d62eb64-29dc-48ee-ab35-093312bd50af
          tenant-id: e756fdc0-2646-4e94-ac4d-ed7c11f87f34
          subscription-id: 91d9572d-0f0b-47fe-802d-0eef36d7c719
      - name: Configure Firebase runtime and server-only signing secret
        run: node deploy/configure-firebase-auth.mjs --configure-env-only
      - name: Apply auth-only SQL migration with existing migration identity
        run: node deploy/configure-firebase-auth.mjs
      - name: Restore SQL administrator if setup was interrupted
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          state="$RUNNER_TEMP/hidi-auth-admin.json"
          if [[ -f "$state" ]]; then
            execution=$(jq -r '.execution // empty' "$state")
            if [[ -n "$execution" ]]; then
              az containerapp job stop -g rg-hidi-prod -n job-hidi-validation \
                --job-execution-name "$execution" --only-show-errors -o none || true
            fi
            current=$(az sql server ad-admin show -g rg-hidi-prod -s sql-hidi-prod-0927 --query sid -o tsv)
            original=$(jq -r .sid "$state")
            migration=$(jq -r .migrationSid "$state")
            if [[ "$current" == "$migration" ]]; then
              az sql server ad-admin update -g rg-hidi-prod -s sql-hidi-prod-0927 \
                --display-name "$(jq -r .login "$state")" --object-id "$original" --only-show-errors -o none
            else
              [[ "$current" == "$original" ]] || { echo 'SQL administrator changed independently; refusing overwrite.'; exit 1; }
            fi
            rm "$state"
            echo 'Original SQL administrator verified.'
          fi
