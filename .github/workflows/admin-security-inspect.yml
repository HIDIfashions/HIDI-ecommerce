name: Admin security and sales read-only inspection
on:
  push:
    branches: [migration/azure-sql-blob]
    paths: [.github/workflows/admin-security-inspect.yml]
permissions:
  contents: read
  id-token: write
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: azure/login@v2
        with:
          client-id: 3d62eb64-29dc-48ee-ab35-093312bd50af
          tenant-id: e756fdc0-2646-4e94-ac4d-ed7c11f87f34
          subscription-id: 91d9572d-0f0b-47fe-802d-0eef36d7c719
      - run: python3 deploy/admin-security/live.py inspect
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: admin-security-inspection
          path: evidence/admin-security
