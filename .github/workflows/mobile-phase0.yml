name: Mobile Phase 5

# Phase 5 re-check after account screen type fixes.
on:
  push:
    branches:
      - hidi-mobile-build-from-scratch
    paths:
      - "apps/mobile/**"
      - "phase.md"
      - "agent.md"
      - "build.md"
      - ".github/workflows/mobile-phase0.yml"
  workflow_dispatch:

jobs:
  android-phase5:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22.13.1"
          cache: npm
          cache-dependency-path: apps/mobile/package.json

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm test -- --runInBand

      - name: Android debug build
        run: ./android/gradlew -p android assembleDebug

  ios-phase5:
    runs-on: macos-15
    timeout-minutes: 45
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22.13.1"
          cache: npm
          cache-dependency-path: apps/mobile/package.json

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Install Ruby dependencies
        run: bundle install

      - name: Install iOS pods
        run: cd ios && bundle exec pod install

      - name: iOS simulator build
        run: xcodebuild -workspace ios/HIDI.xcworkspace -scheme HIDI -configuration Debug -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' CODE_SIGNING_ALLOWED=NO build
