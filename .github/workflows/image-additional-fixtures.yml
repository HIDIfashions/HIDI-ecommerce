name: Image additional isolated regression fixtures
on:
  push:
    branches: [work/image-optimization-20261015]
    paths: ['.github/workflows/image-additional-fixtures.yml']
permissions:
  contents: read
jobs:
  additional:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DATABASE_URL: 'sqlserver://localhost:1433;database=hidi;user=build;password=build;encrypt=true'
      API_URL: http://127.0.0.1:4100/v1
      NEXT_TELEMETRY_DISABLED: '1'
      PLAYWRIGHT_BROWSERS_PATH: ${{ github.workspace }}/.cache/image-additional-browsers
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: pnpm/action-setup@v4
        with:
          version: 10.15.1
      - uses: actions/setup-node@v4
        with:
          node-version: '22.16.0'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Install isolated browser engines
        run: |
          npm install --prefix "$RUNNER_TEMP/image-additional" --no-audit --no-fund playwright@1.56.1
          echo "HIDI_PLAYWRIGHT_MODULE=$RUNNER_TEMP/image-additional/node_modules/playwright/index.mjs" >> "$GITHUB_ENV"
          node "$RUNNER_TEMP/image-additional/node_modules/playwright/cli.js" install --with-deps chromium firefox webkit
      - name: Test every remaining standalone fixture independently
        run: |
          python - <<'PY'
          import pathlib,json,subprocess,time,os,signal,re
          root=pathlib.Path.cwd();out=root/'reports/image-additional';out.mkdir(parents=True,exist_ok=True)
          report={'testedCommit':subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip(),'runId':os.environ['GITHUB_RUN_ID'],'applicationSourceMatches':'af57341892610b41765ea12ad9fded2444a93eee','productionChanged':False,'suites':[],'cases':[]}
          auth=json.loads((root/'deploy/public-auth.json').read_text())
          for key in ['SUPABASE_URL','SUPABASE_PUBLISHABLE_KEY','CUSTOMER_AUTH_PROVIDER','CUSTOMER_OTP_CHANNEL','FIREBASE_API_KEY','FIREBASE_AUTH_DOMAIN','FIREBASE_PROJECT_ID','FIREBASE_APP_ID','FIREBASE_MESSAGING_SENDER_ID','FIREBASE_STORAGE_BUCKET']:
            os.environ['NEXT_PUBLIC_'+key]=str(auth.get(key,auth.get('NEXT_PUBLIC_'+key,'')))
          def run(name,command,timeout=240):
            start=time.monotonic();proc=subprocess.Popen(['bash','-o','pipefail','-c',command],stdout=subprocess.PIPE,stderr=subprocess.STDOUT,text=True,start_new_session=True)
            try:text,_=proc.communicate(timeout=timeout);code=proc.returncode
            except subprocess.TimeoutExpired:
              os.killpg(proc.pid,signal.SIGKILL);text,_=proc.communicate();code=124
            (out/(name+'.log')).write_text(text)
            cases=[]
            for line in text.splitlines():
              m=re.match(r'^(test_\w+)\s+\((.*?)\)\s*\.\.\.\s*(ok|FAIL|ERROR|skipped.*)',line)
              if m:cases.append({'suite':name,'case':m[1]+' ('+m[2]+')','status':'PASS' if m[3]=='ok' else 'FAIL','details':''})
              if line.startswith('PASS '):cases.append({'suite':name,'case':line[5:],'status':'PASS','details':''})
            report['cases']+=cases
            item={'name':name,'command':command,'status':'PASS' if code==0 else 'FAIL','exitCode':code,'seconds':round(time.monotonic()-start,2),'passed':len([c for c in cases if c['status']=='PASS']),'failed':len([c for c in cases if c['status']=='FAIL'])}
            if code:item['failureTail']=text[-7000:]
            report['suites'].append(item);(out/'results.json').write_text(json.dumps(report,indent=2));print(json.dumps({k:v for k,v in item.items() if k!='failureTail'}),flush=True);return code==0
          for file in sorted((root/'deploy').rglob('*.test.py')):run('python-'+file.parent.name+'-patch','python '+str(file.relative_to(root))+' -v',90)
          for engine in ['chromium','firefox','webkit']:
            run('navigation-browser-'+engine,'HIDI_BROWSER_ENGINES='+engine+' node tests/admin-navigation.browser.mjs')
            run('privacy-browser-'+engine,'HIDI_BROWSER_ENGINES='+engine+' node tests/privacy-policy.browser.mjs')
          run('additional-prisma-generate','pnpm db:generate')
          built=run('additional-web-build','pnpm --filter @hidi/web build',600)
          for engine in ['chromium','firefox','webkit']:
            if built:run('otp-browser-'+engine,'HIDI_BROWSER_ENGINES='+engine+' node tests/auth-otp-resend.browser.mjs',180)
            else:report['suites'].append({'name':'otp-browser-'+engine,'status':'BLOCKED','reason':'Complete Web build failed'})
          report['unexecuted']=['Product Upload and performance retained-container browser suites require the matching deployed wrapper/container, not a fresh source build.','No actual Azure authenticated transfer, production database migration, real OTP delivery or live transaction was performed.']
          (out/'results.json').write_text(json.dumps(report,indent=2))
          PY
      - name: Preserve all additional evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: image-additional-regression-evidence
          path: |
            reports/image-additional/
            test-results/
          retention-days: 14
      - name: Preserve failure status
        if: always()
        run: |
          python - <<'PY'
          import json
          r=json.load(open('reports/image-additional/results.json'))
          assert all(s['status']=='PASS' for s in r['suites']), 'Additional fixture gates did not all pass; inspect the evidence.'
          PY
