name: MSG91 ordering production preflight
on:
  push:
    branches: [migration/azure-sql-blob]
    paths: [.github/workflows/whatsapp-msg91-preflight.yml, deploy/whatsapp-msg91/preflight.py, deploy/whatsapp-msg91/readiness.mjs]
permissions:
  contents: read
  id-token: write
concurrency:
  group: hidi-hero-guarded-release
  cancel-in-progress: false
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: azure/login@v2
        with:
          client-id: 3d62eb64-29dc-48ee-ab35-093312bd50af
          tenant-id: e756fdc0-2646-4e94-ac4d-ed7c11f87f34
          subscription-id: 91d9572d-0f0b-47fe-802d-0eef36d7c719
      - run: az extension add --name containerapp --upgrade --only-show-errors
      - name: Inspect live queue, configuration, and exact runtime proxy
        run: python3 deploy/whatsapp-msg91/preflight.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: whatsapp-msg91-preflight-${{ github.run_id }}
          path: evidence/whatsapp-msg91
          retention-days: 14
