name: Private SQL owner migration for admin security
# Uses fresh backup metadata observed by the existing SQL owner in Azure Portal.
on:
  push:
    branches: [migration/azure-sql-blob]
    paths: [.github/workflows/admin-security-owner-migration.yml]
  workflow_dispatch:
permissions:
  contents: read
  id-token: write
concurrency:
  group: hidi-admin-security-owner-migration
  cancel-in-progress: false
jobs:
  start:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    outputs:
      execution: ${{ steps.start.outputs.execution }}
      container: ${{ steps.start.outputs.container }}
    steps:
      - uses: actions/checkout@v4
      - uses: azure/login@v2
        with:
          client-id: 3d62eb64-29dc-48ee-ab35-093312bd50af
          tenant-id: e756fdc0-2646-4e94-ac4d-ed7c11f87f34
          subscription-id: 91d9572d-0f0b-47fe-802d-0eef36d7c719
      - id: start
        run: node deploy/admin-security/owner-migration.mjs start
  verify:
    needs: start
    runs-on: ubuntu-latest
    timeout-minutes: 16
    steps:
      - uses: actions/checkout@v4
      - uses: azure/login@v2
        with:
          client-id: 3d62eb64-29dc-48ee-ab35-093312bd50af
          tenant-id: e756fdc0-2646-4e94-ac4d-ed7c11f87f34
          subscription-id: 91d9572d-0f0b-47fe-802d-0eef36d7c719
      - run: node deploy/admin-security/owner-migration.mjs wait
        env:
          HIDI_OWNER_EXECUTION: ${{ needs.start.outputs.execution }}
          HIDI_OWNER_CONTAINER: ${{ needs.start.outputs.container }}
      - run: python3 deploy/admin-security/live.py schema
