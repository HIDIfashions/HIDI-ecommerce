name: Approved dress editor and portrait framing guarded release
on:
  push:
    branches: [migration/azure-sql-blob]
    paths: [deploy/product-preview/**, .github/workflows/product-preview-release.yml]
permissions:
  contents: read
  id-token: write
concurrency:
  group: hidi-hero-guarded-release
  cancel-in-progress: false
jobs:
  verify-and-release:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      HIDI_PLAYWRIGHT_MODULE: /tmp/hidi-preview-browser/node_modules/playwright/index.mjs
      PLAYWRIGHT_BROWSERS_PATH: /tmp/hidi-preview-browsers
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-node@v4
        with: {node-version: 24}
      - name: Check copy formatting, preserved imports and release syntax
        run: |
          node --test tests/product-copy.test.mjs tests/admin-quick-tools.test.mjs tests/admin-product-bulk.test.mjs tests/bulk-publication.test.mjs tests/product-upload-model.test.mjs tests/product-upload-engine.test.mjs
          python3 -m py_compile deploy/product-preview/release.py deploy/product-preview/patch-runtime.py
          for file in deploy/admin-tools/product-copy*.mjs deploy/admin-tools/product-preview.mjs deploy/product-preview/*.mjs; do node --check "$file"; done
      - name: Install exact-manifest backup tools and three browsers
        run: |
          sudo apt-get update -qq && sudo apt-get install -y skopeo
          npm install --prefix /tmp/hidi-preview-browser --no-save playwright@1.62.1
          node /tmp/hidi-preview-browser/node_modules/playwright/cli.js install --with-deps chromium firefox webkit
      - uses: azure/login@v2
        with:
          client-id: 3d62eb64-29dc-48ee-ab35-093312bd50af
          tenant-id: e756fdc0-2646-4e94-ac4d-ed7c11f87f34
          subscription-id: 91d9572d-0f0b-47fe-802d-0eef36d7c719
      - name: Back up the current image and compose the bounded web overlay
        run: |
          az acr login --name acrhidiprod0927 --only-show-errors
          python3 deploy/product-preview/release.py capture
          python3 deploy/product-preview/release.py compose
          echo "HIDI_CANDIDATE_RUNTIME=$RUNNER_TEMP/hidi-product-preview-private/web/candidate-app" >> "$GITHUB_ENV"
      - name: Test actual candidate in Chromium, Firefox and Safari engines
        run: |
          node deploy/product-preview/candidate.mjs
          python3 deploy/product-preview/release.py seal
      - name: Publish the tested immutable image
        run: python3 deploy/product-preview/release.py publish
      - uses: azure/login@v2
        with:
          client-id: 3d62eb64-29dc-48ee-ab35-093312bd50af
          tenant-id: e756fdc0-2646-4e94-ac4d-ed7c11f87f34
          subscription-id: 91d9572d-0f0b-47fe-802d-0eef36d7c719
      - name: Deploy and run live regressions with owned rollback
        id: apply
        timeout-minutes: 25
        run: timeout --signal=TERM --kill-after=10m 20m python3 deploy/product-preview/release.py apply
      - name: Recover an interrupted owned rollout
        if: always() && env.WEB_IMAGE != '' && steps.apply.outcome != 'success'
        timeout-minutes: 15
        run: python3 deploy/product-preview/release.py recover
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: product-preview-release-${{ github.run_id }}-${{ github.run_attempt }}
          path: evidence/product-preview-release
          retention-days: 30
