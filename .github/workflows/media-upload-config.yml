name: Azure product photo upload configuration repair
on:
  push:
    branches: [migration/azure-sql-blob]
    paths: [.github/workflows/media-upload-config.yml]
  workflow_dispatch:
permissions:
  contents: read
  id-token: write
concurrency:
  group: hidi-hero-guarded-release
  cancel-in-progress: false
jobs:
  inspect-and-repair:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 24}
      - name: Check the bounded media configuration helpers
        run: |
          python3 -m py_compile deploy/media-upload-config/repair.py
          node --check deploy/media-upload-config/probe.mjs
          python3 tests/media-upload-config.test.py
          node --test tests/media-upload-config.test.mjs
      - uses: azure/login@v2
        with:
          client-id: 3d62eb64-29dc-48ee-ab35-093312bd50af
          tenant-id: e756fdc0-2646-4e94-ac4d-ed7c11f87f34
          subscription-id: 91d9572d-0f0b-47fe-802d-0eef36d7c719
      - name: Back up and repair the single photo-upload environment setting
        # Use valid Azure metadata names for the disposable ownership-checked image probe.
        run: |
          az acr login --name acrhidiprod0927 --only-show-errors
          python3 deploy/media-upload-config/repair.py repair
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: media-upload-config-${{ github.run_id }}
          path: evidence/media-upload-config
          retention-days: 30
