name: Release HIDI SEO route metadata and approved public images
on:
  push:
    branches: [migration/azure-sql-blob]
    paths: [.github/workflows/seo-discovery-release.yml]
  workflow_dispatch:
permissions:
  contents: read
  id-token: write
concurrency:
  group: hidi-hero-guarded-release
  cancel-in-progress: false
jobs:
  release:
    if: github.ref == 'refs/heads/migration/azure-sql-blob'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      HIDI_PLAYWRIGHT_MODULE: /tmp/hidi-seo-discovery-browser/node_modules/playwright/index.mjs
      PLAYWRIGHT_BROWSERS_PATH: /tmp/hidi-seo-discovery-browsers
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-node@v4
        with: {node-version: 24}
      - name: Check SEO-only patch and release syntax
        run: |
          node --check deploy/seo-discovery/probes.mjs
          node --check deploy/seo-discovery/candidate.mjs
          node --test deploy/seo-discovery/seo.test.mjs
          python3 -m py_compile deploy/seo-discovery/patch-runtime.py deploy/seo-discovery/release.py
      - name: Install desktop and mobile browser test engines
        run: |
          npm install --prefix /tmp/hidi-seo-discovery-browser --no-save playwright@1.56.1
          node /tmp/hidi-seo-discovery-browser/node_modules/playwright/cli.js install --with-deps chromium firefox webkit
      - uses: azure/login@v2
        with:
          client-id: 3d62eb64-29dc-48ee-ab35-093312bd50af
          tenant-id: e756fdc0-2646-4e94-ac4d-ed7c11f87f34
          subscription-id: 91d9572d-0f0b-47fe-802d-0eef36d7c719
      - name: Capture live image and verify exact rollback backup
        run: |
          az acr login --name acrhidiprod0927 --only-show-errors
          python3 deploy/seo-discovery/release.py capture
          echo "HIDI_CANDIDATE_RUNTIME=$RUNNER_TEMP/hidi-seo-discovery-private/web/candidate-app" >> "$GITHUB_ENV"
      - name: Add only the reviewed SEO layer
        run: python3 deploy/seo-discovery/release.py compose
      - name: Verify SEO metadata and unchanged layouts in twelve browser and viewport combinations
        run: |
          node deploy/seo-discovery/candidate.mjs
          python3 deploy/seo-discovery/release.py seal
      - name: Publish the exact tested web image
        run: python3 deploy/seo-discovery/release.py publish
      - name: Release SEO layer and verify live metadata, sitemap and retained shopping routes
        id: apply
        timeout-minutes: 20
        run: timeout --signal=TERM --kill-after=10m 15m python3 deploy/seo-discovery/release.py apply --image "$WEB_IMAGE"
      - name: Recover an interrupted owned rollout
        if: always() && env.WEB_IMAGE != '' && steps.apply.outcome != 'success'
        timeout-minutes: 15
        run: python3 deploy/seo-discovery/release.py recover --image "$WEB_IMAGE"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: seo-discovery-regression-${{ github.run_id }}-${{ github.run_attempt }}
          path: evidence/seo-discovery
          retention-days: 30

