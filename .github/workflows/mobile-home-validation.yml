name: Mobile Home Validation

on:
  push:
    branches:
      - fix/mobile-home-hero-offers

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.15.1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Type-check web
        run: pnpm --filter @hidi/web exec tsc --noEmit
      - name: Build web
        run: pnpm --filter @hidi/web build
