name: HIDI Android APK

on:
  push:
    branches:
      - feature/android-app-v1
    paths:
      - "apps/android/**"
      - ".github/workflows/android-apk.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Lint and build installable release APK
        shell: bash
        run: |
          gradle -p apps/android --no-daemon clean :app:lintRelease :app:assembleRelease

      - name: Verify APK
        shell: bash
        run: |
          set -euo pipefail
          APK="apps/android/app/build/outputs/apk/release/app-release.apk"
          test -f "$APK"
          mkdir -p dist
          cp "$APK" "dist/HIDI-Android-v1.0.0-test.apk"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose "dist/HIDI-Android-v1.0.0-test.apk"
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "dist/HIDI-Android-v1.0.0-test.apk" | tee "dist/apk-info.txt"
          sha256sum "dist/HIDI-Android-v1.0.0-test.apk" | tee "dist/SHA256SUMS.txt"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: hidi-android-apk
          path: |
            dist/HIDI-Android-v1.0.0-test.apk
            dist/apk-info.txt
            dist/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 30
