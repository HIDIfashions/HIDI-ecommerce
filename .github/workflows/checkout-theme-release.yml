name: Checkout shipping and theme guarded release
# Serve the product-review fixture before the general product-route fixture.
# Respect component-owned phone validation in the preserved Azure wrapper.
on:
  push:
    branches: [migration/azure-sql-blob]
    paths: [.github/workflows/checkout-theme-release.yml]
permissions:
  contents: read
  actions: read
  id-token: write
concurrency:
  group: hidi-hero-guarded-release
  cancel-in-progress: false
jobs:
  regression-and-release:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    env:
      DATABASE_URL: sqlserver://localhost:1433;database=hidi;user=fixture;password=fixture;encrypt=true
      API_URL: http://127.0.0.1:4107/v1
      INTERNAL_API_URL: http://127.0.0.1:4107/v1
      PLAYWRIGHT_BROWSERS_PATH: /tmp/hidi-checkout-browsers
      HIDI_PLAYWRIGHT_MODULE: /tmp/hidi-checkout-browser/node_modules/playwright/index.mjs
      NEXT_PUBLIC_WALLET_ENABLED: 'true'
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: pnpm/action-setup@v4
        with: {version: 10.15.1}
      - uses: actions/setup-node@v4
        with: {node-version: 24, cache: pnpm}
      - name: Install unchanged dependencies and generate existing SQL client
        run: pnpm install --frozen-lockfile && pnpm db:generate
      - name: Run complete service and frontend regression
        run: |
          set -euo pipefail
          pnpm --filter @hidi/api test:customer-experience
          node --test tests/*.test.cjs apps/web/lib/product-sharing.test.mjs
          node --test tests/privacy-policy.test.mjs tests/privacy-policy-storage.test.mjs
          pnpm --filter @hidi/api build
      - name: Build the storefront with retained public auth configuration
        run: |
          set -euo pipefail
          export NEXT_PUBLIC_SUPABASE_URL="$(jq -r .SUPABASE_URL deploy/public-auth.json)"
          export NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY="$(jq -r .SUPABASE_PUBLISHABLE_KEY deploy/public-auth.json)"
          export NEXT_PUBLIC_CUSTOMER_AUTH_PROVIDER="$(jq -r .CUSTOMER_AUTH_PROVIDER deploy/public-auth.json)"
          export NEXT_PUBLIC_CUSTOMER_OTP_CHANNEL=sms
          for key in API_KEY AUTH_DOMAIN PROJECT_ID APP_ID MESSAGING_SENDER_ID STORAGE_BUCKET; do
            value="$(jq -r --arg key "FIREBASE_$key" '.[$key] // ""' deploy/public-auth.json)"
            export "NEXT_PUBLIC_FIREBASE_$key=$value"
          done
          export NEXT_PUBLIC_API_URL=https://thidigk.thehidi.com/api/store
          pnpm --filter @hidi/web build
      - name: Verify completed browser evidence against identical tested inputs
        id: browser_gate
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 deploy/checkout-theme/browser-gate.py
      - name: Verify desktop, mobile, cart, checkout and admin in three engines
        if: steps.browser_gate.outputs.reuse != 'true'
        # Font readiness and relevant navigation requests are checked in the page context.
        run: |
          set -euo pipefail
          npm install --prefix /tmp/hidi-checkout-browser --no-save playwright@1.56.1
          node /tmp/hidi-checkout-browser/node_modules/playwright/cli.js install --with-deps chromium firefox webkit
          HIDI_BROWSER_ENGINES=chromium,firefox,webkit timeout 1200s node tests/editorial-storefront.browser.mjs
          for engine in chromium firefox webkit; do HIDI_BROWSER_ENGINE="$engine" timeout 240s node tests/admin-workspace.browser.mjs; done
          HIDI_BROWSER_ENGINES=chromium,firefox,webkit timeout 600s node tests/auth-otp-resend.browser.mjs
      - uses: azure/login@v2
        with:
          client-id: 3d62eb64-29dc-48ee-ab35-093312bd50af
          tenant-id: e756fdc0-2646-4e94-ac4d-ed7c11f87f34
          subscription-id: 91d9572d-0f0b-47fe-802d-0eef36d7c719
      - name: Back up actual live API and storefront before any image change
        run: |
          set -euo pipefail
          python3 deploy/checkout-theme-release.py capture
          export EXPECTED_API="$(python3 -c 'import json; print(json.load(open("evidence/checkout-theme/before.json"))["hidi-api"]["image"])')"
          export EXPECTED_WEB="$(python3 -c 'import json; print(json.load(open("evidence/checkout-theme/before.json"))["hidi-web"]["image"])')"
          az acr login --name acrhidiprod0927 --only-show-errors
          for app in api web; do
            key="EXPECTED_${app^^}"
            docker pull "${!key}"
            backup="acrhidiprod0927.azurecr.io/hidi-$app:backup-checkout-${GITHUB_RUN_ID}"
            docker tag "${!key}" "$backup"
            docker push "$backup"
            echo "$backup" > "evidence/checkout-theme/$app-backup-tag.txt"
            candidate="acrhidiprod0927.azurecr.io/hidi-$app:checkout-${GITHUB_RUN_ID}"
            python3 deploy/checkout-theme-release.py compose --app "$app" --image "$candidate"
            echo "CANDIDATE_${app^^}=$candidate" >> "$GITHUB_ENV"
          done
      - name: Verify actual candidate overlay with protected homepage and admin routes
        # Verify loaded content and relevant navigation without waiting on ambient media.
        run: |
          set -euo pipefail
          if [ ! -f "$HIDI_PLAYWRIGHT_MODULE" ]; then
            npm install --prefix /tmp/hidi-checkout-browser --no-save playwright@1.56.1
            node /tmp/hidi-checkout-browser/node_modules/playwright/cli.js install --with-deps chromium firefox webkit
          fi
          node deploy/checkout-theme-candidate.mjs
      - name: Publish verified immutable images and apply guarded rollout
        run: |
          set -euo pipefail
          for app in api web; do
            key="CANDIDATE_${app^^}"
            docker push "${!key}"
            image="$(docker image inspect --format '{{index .RepoDigests 0}}' "${!key}")"
            echo "IMAGE_${app^^}=$image" >> "$GITHUB_ENV"
          done
      - name: Deploy and run live regression within automatic rollback boundary
        run: python3 deploy/checkout-theme-release.py apply --api "$IMAGE_API" --web "$IMAGE_WEB"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: checkout-theme-regression-release-${{ github.run_id }}
          path: |
            evidence/checkout-theme
            test-results
          retention-days: 30
