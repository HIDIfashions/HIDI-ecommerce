name: Hero video and image upload guarded release
on:
  push:
    branches: [migration/azure-sql-blob]
    paths: [deploy/hero-image-loop/**, .github/workflows/hero-image-loop-release.yml]
  workflow_dispatch:
permissions:
  contents: read
  id-token: write
concurrency:
  group: hidi-checkout-offers-release
  cancel-in-progress: false
jobs:
  release:
    if: github.ref == 'refs/heads/migration/azure-sql-blob'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      HIDI_PLAYWRIGHT_MODULE: /tmp/hidi-hero-browser/node_modules/playwright/index.mjs
      HIDI_BROWSER_ENGINES: chromium,firefox,webkit
      PLAYWRIGHT_BROWSERS_PATH: /tmp/hidi-hero-browsers
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 1}
      - uses: actions/setup-node@v4
        with: {node-version: 24}
      - name: Validate release syntax and retained offer security
        run: |
          python3 -m py_compile deploy/hero-image-loop/release.py deploy/hero-image-loop/patch-runtime.py
          python3 -m unittest discover -s deploy/coupon-copy -p 'test_*.py'
          node --test deploy/offers/model.test.mjs deploy/offers/handler.test.mjs deploy/offers/campaigns.test.mjs deploy/offers/campaign-handler.test.mjs
      - name: Install registry tooling and browser engines
        run: |
          sudo apt-get update -qq && sudo apt-get install -y skopeo umoci ffmpeg
          npm install --prefix /tmp/hidi-hero-browser --no-save playwright@1.56.1
          node /tmp/hidi-hero-browser/node_modules/playwright/cli.js install --with-deps chromium firefox webkit
          node /tmp/hidi-hero-browser/node_modules/playwright/cli.js install --with-deps chrome
      - uses: azure/login@v2
        with:
          client-id: 3d62eb64-29dc-48ee-ab35-093312bd50af
          tenant-id: e756fdc0-2646-4e94-ac4d-ed7c11f87f34
          subscription-id: 91d9572d-0f0b-47fe-802d-0eef36d7c719
      - name: Capture live state and immutable rollback images
        run: |
          az acr login --name acrhidiprod0927 --only-show-errors
          python3 deploy/hero-image-loop/release.py capture
      - name: Compose bounded hero media change on the exact live web image
        run: python3 deploy/hero-image-loop/release.py compose
      - name: Test hero uploads, playback and retained commerce
        run: |
          node deploy/hero-image-loop/regression.mjs "$HIDI_HERO_FIXTURE"
          node deploy/hero-image-loop/live-check.mjs --before
          node deploy/checkout-offers/api-test.mjs
          node deploy/welcome250/api-check.mjs
          node deploy/get1/browser-check.mjs
          python3 deploy/hero-image-loop/release.py seal
      - name: Publish only the tested immutable candidate
        run: python3 deploy/hero-image-loop/release.py publish
      - uses: azure/login@v2
        with:
          client-id: 3d62eb64-29dc-48ee-ab35-093312bd50af
          tenant-id: e756fdc0-2646-4e94-ac4d-ed7c11f87f34
          subscription-id: 91d9572d-0f0b-47fe-802d-0eef36d7c719
      - name: Deploy web only and verify preserved live configuration
        id: apply
        timeout-minutes: 20
        run: timeout --signal=TERM --kill-after=10m 15m python3 deploy/hero-image-loop/release.py apply
      - name: Recover an interrupted owned rollout
        if: always() && env.WEB_IMAGE != '' && steps.apply.outcome != 'success'
        timeout-minutes: 15
        run: python3 deploy/hero-image-loop/release.py recover
      - name: Collect isolated hero test evidence
        if: always()
        run: |
          mkdir -p evidence/hero-image-loop
          if [ -d "$RUNNER_TEMP/hidi-checkout-offers-private/hero-fixture/results" ]; then
            cp -r "$RUNNER_TEMP/hidi-checkout-offers-private/hero-fixture/results" evidence/hero-image-loop/
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: hero-image-loop-release-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            evidence/checkout-offers
            evidence/welcome250
            evidence/hero-image-loop
            evidence/get1
          retention-days: 30
