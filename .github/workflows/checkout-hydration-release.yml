name: Checkout hydration fix - complete regression and guarded deployment
on:
  push:
    branches: [migration/azure-sql-blob]
    paths: [deploy/checkout-hydration/**, deploy/pricing/storefront.mjs, .github/workflows/checkout-hydration-release.yml]
permissions:
  contents: read
  actions: read
  id-token: write
concurrency:
  group: hidi-hero-guarded-release
  cancel-in-progress: false
  queue: max
jobs:
  verify-and-release:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      HIDI_PLAYWRIGHT_MODULE: /tmp/hidi-hydration-browser/node_modules/playwright/index.mjs
      PLAYWRIGHT_BROWSERS_PATH: /tmp/hidi-hydration-browsers
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-node@v4
        with: {node-version: 24}
      - name: Check pricing, offers, formatting and release syntax
        run: |
          node --test deploy/pricing/model.test.mjs deploy/pricing/handler.test.mjs tests/button-request-policy.test.mjs tests/product-copy.test.mjs tests/admin-quick-tools.test.mjs tests/admin-product-bulk.test.mjs tests/bulk-publication.test.mjs tests/product-upload-model.test.mjs tests/product-upload-engine.test.mjs
          python3 deploy/checkout-hydration/test_patch.py
          python3 -m py_compile deploy/checkout-hydration/release.py deploy/checkout-hydration/patch-runtime.py
          for file in deploy/admin-tools/product-copy*.mjs deploy/admin-tools/product-preview.mjs deploy/checkout-hydration/*.mjs deploy/pricing/storefront.mjs; do node --check "$file"; done
      - name: Install exact-manifest backup tools and three browsers
        run: |
          sudo apt-get update -qq && sudo apt-get install -y skopeo
          npm install --prefix /tmp/hidi-hydration-browser --no-save playwright@1.62.1
          node /tmp/hidi-hydration-browser/node_modules/playwright/cli.js install --with-deps chromium firefox webkit
      - name: Require complete regression on this exact source before deployment
        timeout-minutes: 35
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 deploy/checkout-hydration/wait-source-ci.py
      - uses: azure/login@v2
        with:
          client-id: 3d62eb64-29dc-48ee-ab35-093312bd50af
          tenant-id: e756fdc0-2646-4e94-ac4d-ed7c11f87f34
          subscription-id: 91d9572d-0f0b-47fe-802d-0eef36d7c719
      - name: Back up the current image and compose the bounded web overlay
        run: |
          az acr login --name acrhidiprod0927 --only-show-errors
          python3 deploy/checkout-hydration/release.py capture
          python3 deploy/checkout-hydration/release.py compose
          echo "HIDI_CANDIDATE_RUNTIME=$RUNNER_TEMP/hidi-checkout-hydration-private/web/candidate-app" >> "$GITHUB_ENV"
      - name: Test actual candidate in Chromium, Firefox and Safari engines
        run: |
          node deploy/checkout-hydration/candidate.mjs
          python3 deploy/checkout-hydration/release.py seal
      - name: Publish the tested immutable image
        run: python3 deploy/checkout-hydration/release.py publish
      - uses: azure/login@v2
        with:
          client-id: 3d62eb64-29dc-48ee-ab35-093312bd50af
          tenant-id: e756fdc0-2646-4e94-ac4d-ed7c11f87f34
          subscription-id: 91d9572d-0f0b-47fe-802d-0eef36d7c719
      - name: Deploy and run live regressions with owned rollback
        id: apply
        timeout-minutes: 35
        run: timeout --signal=TERM --kill-after=10m 30m python3 deploy/checkout-hydration/release.py apply
      - name: Recover an interrupted owned rollout
        if: always() && env.WEB_IMAGE != '' && steps.apply.outcome != 'success'
        timeout-minutes: 15
        run: python3 deploy/checkout-hydration/release.py recover
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: checkout-hydration-release-${{ github.run_id }}-${{ github.run_attempt }}
          path: evidence/checkout-hydration-release
          retention-days: 30
