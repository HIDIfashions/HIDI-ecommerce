# Match seven reviewed auxiliary scripts exactly; compare mobile-only identical inline poster bytes.
# Compare reviewed auxiliary scheduling and desktop poster-first handoff, without deployment.
# Serialize fresh-baseline comparisons with other guarded production releases.
# Compare mobile poster connection reuse with the same freshly quality-validated AV1 recipe.
# Compare the poster/image credential-mode preconnect with the accepted control.
# Rewritten diagnostic responses remove hop-by-hop framing and retain real compressed bytes.
# Compare exact external logo bytes as well as poster connection and application request ordering.
name: Read-only candidate paint experiments
on:
  push:
    branches: [migration/azure-sql-blob]
    paths: [.github/workflows/paint-performance-experiments.yml]
concurrency:
  group: hidi-hero-guarded-release
  queue: max
  cancel-in-progress: false
permissions:
  contents: read
  actions: read
  id-token: write
env:
  HIDI_PLAYWRIGHT_MODULE: /tmp/media-tools/node_modules/playwright/index.mjs
  HIDI_LIGHTHOUSE_MODULE: /tmp/media-tools/node_modules/lighthouse/cli/index.js
  PLAYWRIGHT_BROWSERS_PATH: /tmp/media-browsers
jobs:
  diagnostic:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 24}
      - uses: azure/login@v2
        with:
          client-id: 3d62eb64-29dc-48ee-ab35-093312bd50af
          tenant-id: e756fdc0-2646-4e94-ac4d-ed7c11f87f34
          subscription-id: 91d9572d-0f0b-47fe-802d-0eef36d7c719
      # IAM is provisioned by the Azure owner; the deployment identity cannot grant itself roles.
      - name: Verify isolated asset-site access before build or publication
        run: python3 deploy/paint-performance/asset-mirror.py preflight
      - name: Verify protocol safety and install media/browser tooling
        run: |
          google-chrome --version
          python3 deploy/paint-performance/test_icons.py
          python3 deploy/paint-performance/test_hook.py
          python3 deploy/paint-performance/test_asset_mirror.py
          node --test deploy/paint-performance/asset-mirror.test.mjs
          node --test deploy/paint-performance/critical-poster.test.mjs deploy/paint-performance/reuse-video.test.mjs deploy/paint-performance/head-assets.test.mjs deploy/paint-performance/audit-parity.test.mjs deploy/paint-performance/network-fixture.test.mjs deploy/paint-performance/summary.test.mjs deploy/paint-performance/head.test.mjs deploy/paint-performance/early-hero.test.mjs deploy/paint-performance/delivery.test.mjs deploy/paint-performance/stream-home.test.mjs deploy/paint-performance/poster-delivery.test.mjs deploy/paint-performance/announcement.test.mjs deploy/paint-performance/hero.test.mjs deploy/paint-performance/hero-initial.test.mjs deploy/paint-performance/video-client.test.mjs deploy/paint-performance/static-encoding.test.mjs
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg openssl iproute2
          npm install --prefix /tmp/media-tools --no-save playwright@1.56.1 lighthouse@13.5.0 @azure/static-web-apps-cli@2.0.10
          node /tmp/media-tools/node_modules/playwright/cli.js install --with-deps chromium firefox webkit
      - name: Capture stable production and fresh rollback copies
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          az acr login --name acrhidiprod0927 --only-show-errors
          python3 deploy/paint-performance/release.py capture
          echo "CANDIDATE_WEB=acrhidiprod0927.azurecr.io/hidi-web:paint-performance-${GITHUB_RUN_ID}" >> "$GITHUB_ENV"
      - name: Measure current mobile and desktop performance
        run: node deploy/paint-performance/lighthouse.mjs before
      - name: Compose candidate and publish verified immutable asset mirror
        run: python3 deploy/paint-performance/release.py compose
      - name: Compare candidate delivery variants without publishing an image or deploying
        run: node deploy/paint-performance/experiment-runner.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: compact-paint-experiments
          path: |
            evidence/paint-performance/experiments
            evidence/paint-performance/lighthouse/before.json
            evidence/paint-performance/before.json
            evidence/paint-performance/preservation.json
            evidence/paint-performance/video-quality.json
            evidence/paint-performance/poster-quality.json
            evidence/paint-performance/media-cache.json
          retention-days: 14
