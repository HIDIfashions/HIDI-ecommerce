name: Apply tested MSG91 ordering images
on:
  push:
    branches: [migration/azure-sql-blob]
    paths: [.github/workflows/whatsapp-msg91-retry.yml, deploy/whatsapp-msg91/retry.py]
permissions:
  contents: read
  actions: read
  id-token: write
concurrency:
  group: hidi-hero-guarded-release
  cancel-in-progress: false
jobs:
  apply:
    if: contains(github.event.head_commit.message, '[apply-tested-wa]')
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: whatsapp-ordering-release-40260169477
          path: previous-whatsapp-release
          run-id: 40260169477
          github-token: ${{ github.token }}
      - uses: azure/login@v2
        with:
          client-id: 3d62eb64-29dc-48ee-ab35-093312bd50af
          tenant-id: e756fdc0-2646-4e94-ac4d-ed7c11f87f34
          subscription-id: 91d9572d-0f0b-47fe-802d-0eef36d7c719
      - run: az extension add --name containerapp --upgrade --only-show-errors
      - run: az acr login --name acrhidiprod0927 --only-show-errors
      - name: Verify unchanged image identities and apply with consistent ARM reads
        run: python3 deploy/whatsapp-msg91/retry.py
      - name: Stage callback credential only after verified disabled deployment
        run: python3 deploy/whatsapp-msg91/stage.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: whatsapp-tested-release-${{ github.run_id }}
          path: |
            evidence/whatsapp-release
            evidence/whatsapp-stage
          retention-days: 3
