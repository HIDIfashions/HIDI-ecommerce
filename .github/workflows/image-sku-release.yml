name: Guarded Image SKU photo mapping Azure release
on:
  push:
    branches: [migration/azure-sql-blob]
    paths: [.github/workflows/image-sku-release.yml]
  workflow_dispatch:
permissions:
  contents: read
  id-token: write
concurrency:
  group: hidi-hero-guarded-release
  cancel-in-progress: false
jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      NEXT_TELEMETRY_DISABLED: 1
      PLAYWRIGHT_BROWSERS_PATH: /tmp/hidi-image-sku-browsers
      HIDI_PLAYWRIGHT_MODULE: /tmp/hidi-image-sku-browser/node_modules/playwright/index.mjs
      HIDI_BROWSER_ENGINES: chromium,firefox,webkit
      HIDI_BUTTON_OUTPUT: evidence/image-sku/retained-commerce
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: pnpm/action-setup@v4
        with: {version: 10.15.1}
      - uses: actions/setup-node@v4
        with: {node-version: 24, cache: pnpm}
      - name: Verify types and mapping, permission, concurrency and retry safeguards
        run: |
          pnpm install --frozen-lockfile
          node apps/web/node_modules/typescript/bin/tsc --noEmit -p apps/web/tsconfig.json
          node --test tests/image-sku.test.mjs tests/bulk-publication.test.mjs tests/button-request-policy.test.mjs
          TSX_TSCONFIG_PATH=apps/web/tsconfig.json node --import ./apps/api/node_modules/tsx/dist/loader.mjs --test tests/bulk-import-details.test.ts
          python3 -m py_compile deploy/image-sku/release.py deploy/image-sku/patch-web.py
      - name: Install desktop and mobile browser engines
        run: |
          npm install --prefix /tmp/hidi-image-sku-browser --no-save playwright@1.56.1
          node /tmp/hidi-image-sku-browser/node_modules/playwright/cli.js install --with-deps chromium firefox webkit
      - uses: azure/login@v2
        with:
          client-id: 3d62eb64-29dc-48ee-ab35-093312bd50af
          tenant-id: e756fdc0-2646-4e94-ac4d-ed7c11f87f34
          subscription-id: 91d9572d-0f0b-47fe-802d-0eef36d7c719
      - name: Back up fresh ready images and capture live settings
        run: |
          az acr login --name acrhidiprod0927 --only-show-errors
          python3 deploy/image-sku/release.py capture
          echo "HIDI_CANDIDATE_RUNTIME=$RUNNER_TEMP/hidi-image-sku-private/web/candidate-app" >> "$GITHUB_ENV"
          echo "HIDI_CANDIDATE_API=$RUNNER_TEMP/hidi-image-sku-private/api/base-app" >> "$GITHUB_ENV"
          echo "HIDI_CATEGORY_PRIVATE=$RUNNER_TEMP/hidi-image-sku-private" >> "$GITHUB_ENV"
      - name: Add only Image SKU admin changes over the current production image
        run: |
          tag="acrhidiprod0927.azurecr.io/hidi-web:image-sku-${GITHUB_RUN_ID}"
          python3 deploy/image-sku/release.py compose --tag "$tag"
          echo "CANDIDATE_WEB=$tag" >> "$GITHUB_ENV"
      - name: Test actual retained import, photos, publishing and commerce without production writes
        run: |
          node deploy/image-sku/candidate.mjs
          node deploy/bulk-publish/candidate.mjs
          node tests/admin-quick-tools.runtime.mjs
          node deploy/four-categories/candidate.mjs
          node deploy/button-states/revert-candidate.mjs
      - name: Push the tested immutable web image
        run: |
          docker push "$CANDIDATE_WEB"
          digest="$(az acr repository show --name acrhidiprod0927 --image "hidi-web:image-sku-${GITHUB_RUN_ID}" --query digest -o tsv --only-show-errors)"
          echo "WEB_IMAGE=acrhidiprod0927.azurecr.io/hidi-web@$digest" >> "$GITHUB_ENV"
      - name: Deploy and verify with ownership checked rollback
        run: python3 deploy/image-sku/release.py apply
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: image-sku-release-${{ github.run_id }}
          path: |
            evidence/image-sku
            evidence/bulk-publish
            evidence/four-categories
          retention-days: 30
