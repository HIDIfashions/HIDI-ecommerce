name: Backup and inspect live storefront before approved refinements
on:
  push:
    branches: [migration/azure-sql-blob]
    paths: [.github/workflows/storefront-refinements-inspect.yml]
permissions:
  contents: read
  id-token: write
concurrency:
  group: hidi-hero-guarded-release
  cancel-in-progress: false
jobs:
  backup-inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: azure/login@v2
        with:
          client-id: 3d62eb64-29dc-48ee-ab35-093312bd50af
          tenant-id: e756fdc0-2646-4e94-ac4d-ed7c11f87f34
          subscription-id: 91d9572d-0f0b-47fe-802d-0eef36d7c719
      - name: Capture ready production images, retain backups, inspect public runtime
        run: |
          set -euo pipefail
          az acr login --name acrhidiprod0927 --only-show-errors
          python3 - <<'PY'
          import importlib.util,json,pathlib,os,re,subprocess,hashlib
          def module(name,path):
              s=importlib.util.spec_from_file_location(name,path);m=importlib.util.module_from_spec(s);s.loader.exec_module(m);return m
          cloud=module('cloud','deploy/privacy-policy/rollout.py');cloud.API_VERSION='2025-07-01'
          helpers=module('helpers','deploy/compose-msg91-images.py')
          out=pathlib.Path('evidence/refinements-inspect');out.mkdir(parents=True)
          states={}
          for name in ['hidi-api','hidi-web']:
              data=cloud.app(name);state=cloud.snapshot(data);cloud.ready(state);helpers.validate_image(state['image'],name.removeprefix('hidi-'))
              subprocess.run(['docker','pull',state['image']],check=True)
              tag='acrhidiprod0927.azurecr.io/'+name+':backup-refinements-'+os.environ['GITHUB_RUN_ID']
              subprocess.run(['docker','tag',state['image'],tag],check=True);subprocess.run(['docker','push',tag],check=True)
              state['backupTag']=tag;state['environmentNames']=sorted(x['name'] for x in data['properties']['template']['containers'][0].get('env',[]));states[name]=state
              if name=='hidi-web':
                  root=pathlib.Path(os.environ['RUNNER_TEMP'])/'refinements-base';helpers.extract(state['image'],root)
                  for path in ['server.mjs','dist/index.html','apps/web/.next/BUILD_ID']:
                      dest=out/path;dest.parent.mkdir(parents=True,exist_ok=True);dest.write_bytes((root/path).read_bytes())
                  html=(root/'dist/index.html').read_text()
                  for path in re.findall(r'(?:src|href)="\.?/([^"?]+\.js)"',html):
                      file=root/'dist'/path
                      if file.is_file():
                          dest=out/'homepage-assets'/path;dest.parent.mkdir(parents=True,exist_ok=True);dest.write_bytes(file.read_bytes())
          (out/'before.json').write_text(json.dumps(states,indent=2))
          print('Ready API/web backups retained. No application, credential, database or traffic changes.')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: storefront-refinements-backup-inspection-${{ github.run_id }}
          path: evidence/refinements-inspect
          retention-days: 30
