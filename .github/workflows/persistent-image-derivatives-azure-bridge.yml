name: Persistent image derivatives Azure bridge validation
on:
  push:
    branches: [migration/azure-sql-blob]
    paths: [.github/workflows/persistent-image-derivatives-azure-bridge.yml]

permissions:
  contents: read
  id-token: write

concurrency:
  group: hidi-persistent-image-azure-bridge
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    env:
      CANDIDATE_SHA: 221f6741365110b44d5167752aaba79970a3dabd
      DATABASE_URL: 'sqlserver://localhost:1433;database=fixture;user=build;password=build;encrypt=true'
      API_URL: http://127.0.0.1:4100/v1
      NEXT_TELEMETRY_DISABLED: '1'
      PLAYWRIGHT_BROWSERS_PATH: ${{ github.workspace }}/.cache/persistent-image-bridge-browsers
    steps:
      - name: Checkout authorized validation branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Checkout exact reviewed image candidate
        uses: actions/checkout@v4
        with:
          ref: ${{ env.CANDIDATE_SHA }}
          path: candidate-source
          fetch-depth: 0

      - uses: pnpm/action-setup@v4
        with:
          version: 10.15.1

      - uses: actions/setup-node@v4
        with:
          node-version: '22.16.0'
          cache: pnpm
          cache-dependency-path: candidate-source/pnpm-lock.yaml

      - name: Install candidate and isolated release tooling
        working-directory: candidate-source
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$CANDIDATE_SHA"
          pnpm install --frozen-lockfile
          pnpm db:generate
          npm install --prefix "$RUNNER_TEMP/persistent-image-bridge-tools" --no-audit --no-fund esbuild@0.25.5 playwright@1.56.1 sharp@0.34.1
          echo "HIDI_ESBUILD_MODULE=$RUNNER_TEMP/persistent-image-bridge-tools/node_modules/esbuild" >> "$GITHUB_ENV"
          echo "HIDI_PLAYWRIGHT_MODULE=$RUNNER_TEMP/persistent-image-bridge-tools/node_modules/playwright/index.mjs" >> "$GITHUB_ENV"
          echo "HIDI_TEST_SHARP=$RUNNER_TEMP/persistent-image-bridge-tools/node_modules/sharp" >> "$GITHUB_ENV"
          echo "HIDI_SHARP_MODULE=$RUNNER_TEMP/persistent-image-bridge-tools/node_modules/sharp" >> "$GITHUB_ENV"
          node "$RUNNER_TEMP/persistent-image-bridge-tools/node_modules/playwright/cli.js" install --with-deps chromium firefox webkit
          sudo apt-get update -qq
          sudo apt-get install -y skopeo
          python -m py_compile deploy/photo-live/azure-check.py deploy/photo-live/arm-state.py deploy/photo-live/patch.py deploy/photo-live/release.py deploy/photo-live/retained-test.py deploy/photo-live/test.py
          node --check deploy/image-derivatives/azure-storage-probe.mjs

      - name: Authenticate using the existing authorized branch federation
        uses: azure/login@v2
        with:
          client-id: 3d62eb64-29dc-48ee-ab35-093312bd50af
          tenant-id: e756fdc0-2646-4e94-ac4d-ed7c11f87f34
          subscription-id: 91d9572d-0f0b-47fe-802d-0eef36d7c719

      - name: Capture exact live baseline without changing traffic
        working-directory: candidate-source
        run: |
          set -euo pipefail
          BASELINE_SHA="$(git ls-remote origin refs/heads/migration/azure-sql-blob | cut -f1)"
          test -n "$BASELINE_SHA"
          echo "HIDI_PRODUCTION_BASELINE_SHA=$BASELINE_SHA" >> "$GITHUB_ENV"
          az acr login --name acrhidiprod0927 --only-show-errors
          env GITHUB_SHA="$BASELINE_SHA" python deploy/photo-live/release.py capture
          env GITHUB_SHA="$BASELINE_SHA" python deploy/photo-live/azure-check.py identity-preflight

      - name: Record exact live photo-runtime contract before composition
        working-directory: candidate-source
        run: |
          env GITHUB_SHA="$HIDI_PRODUCTION_BASELINE_SHA" python - <<'PY'
          import hashlib,importlib.util,json
          from pathlib import Path
          p=Path('deploy/photo-live/release.py').resolve()
          spec=importlib.util.spec_from_file_location('photo_contract',p)
          m=importlib.util.module_from_spec(spec);spec.loader.exec_module(m)
          states=m.r.photo.states()
          root=Path(m.P)/'contract-diagnostic'
          result={'states':{},'api':{},'web':{}}
          for app in ['api','web']:
              target=root/app
              m.r.images.extract(states['hidi-'+app]['image'],target)
              result['states'][app]={'image':states['hidi-'+app]['image']}
          api=root/'api'/'apps/api/dist/admin/admin-inventory.service.js'
          text=api.read_text()
          result['api']={
              'sha256':hashlib.sha256(api.read_bytes()).hexdigest(),
              'ticketNumberAnchor':text.count('const sizeBytes = Number(input.sizeBytes);'),
              'twelveMiBAnchor':text.count('!Number.isSafeInteger(sizeBytes) || sizeBytes < 1 || sizeBytes > 12 * 1024 * 1024'),
              'twelveMiBMessage':text.count('Image must be no larger than 12 MB'),
              'bigIntAnchor':text.count('maxBytes: BigInt(sizeBytes)'),
          }
          web=root/'web'
          def sha(path): return hashlib.sha256(path.read_bytes()).hexdigest()
          def blob(path):
              data=path.read_bytes()
              return hashlib.sha1(b'blob '+str(len(data)).encode()+b'\\0'+data).hexdigest()
          server=(web/'server.mjs').read_text()
          result['web']={
              'serverSha256':sha(web/'server.mjs'),
              'imagesSha256':sha(web/'product-images/images.mjs'),
              'deleteStorageGitBlob':blob(web/'admin-tools/product-delete-storage.mjs'),
              'imageHandlerImportAnchor':server.count('import { createProductImageHandler } from "./product-images/images.mjs";'),
              'imageHandlerCallAnchor':server.count('if (await productImageHandler.handle(request, response, pathname)) return;'),
          }
          out=Path('evidence/photo-live/live-contract.json')
          out.parent.mkdir(parents=True,exist_ok=True)
          out.write_text(json.dumps(result,indent=2))
          print(json.dumps(result,indent=2))
          PY

      - name: Compare current live image runtime with candidate semantics
        working-directory: candidate-source
        run: |
          env GITHUB_SHA="$HIDI_PRODUCTION_BASELINE_SHA" python - <<'PY'
          import difflib,importlib.util,json
          from pathlib import Path
          p=Path('deploy/photo-live/release.py').resolve()
          spec=importlib.util.spec_from_file_location('photo_compare',p)
          m=importlib.util.module_from_spec(spec);spec.loader.exec_module(m)
          root=Path(m.P)/'contract-diagnostic'
          api=(root/'api'/'apps/api/dist/admin/admin-inventory.service.js').read_text()
          api_lines=[line.strip()[:900] for line in api.splitlines() if any(x in line for x in ['sizeBytes','maxBytes','12 MB','12582912','2147483647','BigInt'])]
          live_images=(root/'web'/'product-images/images.mjs').read_text().splitlines()
          candidate_images=Path('deploy/collection-speed/images.mjs').read_text().splitlines()
          image_diff=list(difflib.unified_diff(live_images,candidate_images,fromfile='live/product-images/images.mjs',tofile='candidate/deploy/collection-speed/images.mjs',n=2))
          live_delete=(root/'web'/'admin-tools/product-delete-storage.mjs').read_text().splitlines()
          candidate_delete=Path('deploy/admin-tools/product-delete-storage.mjs').read_text().splitlines()
          delete_diff=list(difflib.unified_diff(live_delete,candidate_delete,fromfile='live/admin-tools/product-delete-storage.mjs',tofile='candidate/deploy/admin-tools/product-delete-storage.mjs',n=2))
          report={
            'apiRelevantLines':api_lines[:80],
            'liveImageMarkers':{
              key:sum(key in line for line in live_images)
              for key in ['IMAGE_VERSION','SOURCE_LIMIT','PERSISTENT_DERIVATIVE_VERSION','persistentDerivativeBlobKey','createImageStore','resizedImage','maxPending','X-Hidi-Image-Version']
            },
            'imageDiffLines':len(image_diff),
            'imageDiffPreview':image_diff[:220],
            'deleteDiffLines':len(delete_diff),
            'deleteDiffPreview':delete_diff[:180],
          }
          out=Path('evidence/photo-live/live-semantic-diff.json')
          out.write_text(json.dumps(report,indent=2))
          print(json.dumps(report,indent=2))
          PY

      - name: Compose candidate over captured production runtime
        working-directory: candidate-source
        run: env GITHUB_SHA="$HIDI_PRODUCTION_BASELINE_SHA" python deploy/photo-live/release.py compose

      - name: Run complete retained commerce and browser regression
        working-directory: candidate-source
        run: env GITHUB_SHA="$HIDI_PRODUCTION_BASELINE_SHA" python deploy/photo-live/test.py

      - name: Publish only the exact tested immutable candidate
        working-directory: candidate-source
        run: env GITHUB_SHA="$HIDI_PRODUCTION_BASELINE_SHA" python deploy/photo-live/release.py publish

      - name: Validate real Azure original plus seven derivatives with production managed identity
        working-directory: candidate-source
        run: env GITHUB_SHA="$HIDI_PRODUCTION_BASELINE_SHA" python deploy/photo-live/azure-check.py

      - name: Prove no production traffic or catalogue mutation occurred
        if: always()
        working-directory: candidate-source
        run: |
          python - <<'PY'
          import json,pathlib
          evidence=pathlib.Path('evidence/photo-live')
          report=evidence/'azure-storage-test.json'
          assert report.exists(),'Real Azure derivative evidence is missing'
          data=json.loads(report.read_text())
          assert data.get('passed') is True,data
          assert data.get('persistentDerivativeCount')==7,data
          assert data.get('validationJobRemoved') is True,data
          assert data.get('productionTrafficChanged') is False,data
          assert data.get('databaseWrites')==0,data
          assert not (evidence/'after.json').exists(),'Production apply evidence must not exist in validation'
          print(json.dumps({
            'passed': True,
            'persistentDerivativeCount': data.get('persistentDerivativeCount'),
            'persistentDerivativeBytes': data.get('persistentDerivativeBytes'),
            'temporaryBlobFamilyDeleted': data.get('temporaryBlobFamilyDeleted'),
            'validationJobRemoved': data.get('validationJobRemoved'),
            'productionTrafficChanged': data.get('productionTrafficChanged'),
            'databaseWrites': data.get('databaseWrites'),
          },indent=2))
          PY

      - name: Preserve validation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: persistent-image-azure-bridge-evidence
          path: |
            candidate-source/evidence/photo-live/
            candidate-source/evidence/checkout-offers/candidate/
            candidate-source/evidence/checkout-offers/purchase-regression/
            candidate-source/test-results/photo-web-upload/
          retention-days: 30
