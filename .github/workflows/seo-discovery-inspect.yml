name: Inspect current HIDI SEO baseline and collection rendering without changes
on:
  push:
    branches: [migration/azure-sql-blob]
    paths: [deploy/seo-discovery/cloud_inspect.py, .github/workflows/seo-discovery-inspect.yml]
permissions:
  contents: read
  id-token: write
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: azure/login@v2
        with:
          client-id: 3d62eb64-29dc-48ee-ab35-093312bd50af
          tenant-id: e756fdc0-2646-4e94-ac4d-ed7c11f87f34
          subscription-id: 91d9572d-0f0b-47fe-802d-0eef36d7c719
      - run: az acr login --name acrhidiprod0927 --only-show-errors
      - run: python3 deploy/seo-discovery/cloud_inspect.py
      - name: Record exact policy and current SEO helper fingerprints
        run: |
          python3 - <<'PY'
          import hashlib, json, os
          from pathlib import Path
          root=Path(os.environ['RUNNER_TEMP'])/'hidi-seo-inspection'
          files=['server.mjs','privacy-policy/handler.mjs','seo-discovery/metadata.mjs','seo-discovery/sitemap.mjs','seo-discovery/published-product-images.json','dist/hidi-analytics.js']
          for name in files:
              path=root/name
              print('SEO_CURRENT_FILE',json.dumps({'path':name,'sha256':hashlib.sha256(path.read_bytes()).hexdigest()}))
          PY


      - name: Inspect public-rendering code for India SEO candidate
        run: |
          python3 - <<'PY'
          import json, os, re
          from pathlib import Path
          root=Path(os.environ['RUNNER_TEMP'])/'hidi-seo-inspection'
          print('SEO_METADATA_SOURCE',json.dumps((root/'seo-discovery/metadata.mjs').read_text()))
          source=(root/'server.mjs').read_text()
          for name in ['streamHtml','injectSeo','serveLanding','serveFile','proxy']:
              match=re.search(r'^(?:async )?function '+name+r'\([^\n]*\) \{',source,re.M)
              if match:
                  end=source.find('\n}\n',match.end())
                  assert end>=0
                  print('SEO_RENDER_FUNCTION',json.dumps({'name':name,'source':source[match.start():end+3]}))
          html=(root/'dist/index.html').read_text()
          refs=re.findall(r'<script type="module" crossorigin src="([^"]+)"',html)
          assert len(refs)==1
          bundle=(root/'dist'/refs[0].removeprefix('./').removeprefix('/')).read_text()
          for pattern in ['HidiRangeCardCopy','HidiSeoLinkProps','range-everyday','aria-label']:
              index=bundle.find(pattern)
              print('SEO_LANDING_ANCHOR',json.dumps({'pattern':pattern,'snippet':bundle[max(0,index-120):index+700] if index>=0 else None}))
          PY

      - name: Inspect compiled collection page and carousel destinations
        run: |
          python3 - <<'PY'
          import hashlib, json, os, re
          from pathlib import Path
          root=Path(os.environ['RUNNER_TEMP'])/'hidi-seo-inspection'
          for path in (root/'apps/web/.next/server').rglob('*.js'):
              source=path.read_text()
              if 'collection-header' in source and ('Ananya' in source or 'work-wear' in source):
                  print('SEO_COLLECTION_CHUNK',json.dumps({'path':str(path.relative_to(root)),'sha256':hashlib.sha256(path.read_bytes()).hexdigest(),'source':source}))
          html=(root/'dist/index.html').read_text()
          ref=re.findall(r'<script type="module" crossorigin src="([^"]+)"',html)[0]
          path=root/'dist'/ref.removeprefix('./').removeprefix('/')
          source=path.read_text()
          print('SEO_LANDING_FINGERPRINT',json.dumps({'path':str(path.relative_to(root)),'sha256':hashlib.sha256(path.read_bytes()).hexdigest()}))
          for needle in ['HidiRangeCardCopy(', 'HidiSeoLinkProps("/collections/"+', 'HidiRangeCards=']:
              start=0
              while True:
                  index=source.find(needle,start)
                  if index<0:break
                  print('SEO_CAROUSEL_ANCHOR',json.dumps({'needle':needle,'source':source[max(0,index-150):index+1800]}))
                  start=index+len(needle)
          PY

      - name: Inspect cached collection rendering and runtime selection
        run: |
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          root=Path(os.environ['RUNNER_TEMP'])/'hidi-seo-inspection'
          for name in ['prerender-manifest.json','routes-manifest.json','required-server-files.json']:
              path=root/'apps/web/.next'/name
              value=json.loads(path.read_text())
              if name=='prerender-manifest.json':value={k:v for k,v in value.items() if k!='preview'}
              if name=='required-server-files.json':value={'appDir':value.get('appDir'),'relativeAppDir':value.get('relativeAppDir'),'distDir':value.get('config',{}).get('distDir')}
              if name=='routes-manifest.json':value={k:v for k,v in value.items() if k in ['dynamicRoutes','staticRoutes','dataRoutes']}
              print('SEO_RUNTIME_MANIFEST',json.dumps({'path':name,'value':value}))
          print('SEO_COLLECTION_FILES',json.dumps([str(p.relative_to(root)) for p in (root/'apps/web/.next/server/app/collections').rglob('*') if p.is_file()]))
          source=(root/'server.mjs').read_text()
          for line in source.splitlines():
              if any(s in line for s in ['STOREFRONT','storefrontServer','publicHtmlCache','snapshot','Snapshot']):print('SEO_RUNTIME_SELECTION',line)
          for path in (root/'apps/web/.next/server/chunks').glob('*.js'):
              source=path.read_text()
              index=source.find('34314:')
              if index>=0:print('SEO_API_MODULE',json.dumps({'path':str(path.relative_to(root)),'snippet':source[index:index+4500]}))
          PY

      - name: Inspect dedicated Shop All renderer
        run: |
          python3 - <<'PY'
          import hashlib,json,os
          from pathlib import Path
          root=Path(os.environ['RUNNER_TEMP'])/'hidi-seo-inspection'
          path=root/'apps/web/.next/server/app/collections/all/page.js'
          source=path.read_text()
          print('SEO_ALL_CHUNK',json.dumps({'path':str(path.relative_to(root)),'sha256':hashlib.sha256(path.read_bytes()).hexdigest(),'source':source}))
          PY
