name: Inspect product package rollout revision
on:
  push:
    branches: [migration/azure-sql-blob]
    paths: [.github/workflows/product-package-rollout-inspect.yml]
permissions:
  contents: read
  id-token: write
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: azure/login@v2
        with:
          client-id: 3d62eb64-29dc-48ee-ab35-093312bd50af
          tenant-id: e756fdc0-2646-4e94-ac4d-ed7c11f87f34
          subscription-id: 91d9572d-0f0b-47fe-802d-0eef36d7c719
      - name: Read application and revision readiness without configuration or data writes
        run: |
          set -euo pipefail
          az containerapp show -g rg-hidi-prod -n hidi-web --only-show-errors --query '{provisioningState:properties.provisioningState,image:properties.template.containers[0].image,latest:properties.latestRevisionName,ready:properties.latestReadyRevisionName,traffic:properties.configuration.ingress.traffic}' -o json
          az containerapp revision list -g rg-hidi-prod -n hidi-web --only-show-errors --query '[].{name:name,active:properties.active,health:properties.healthState,running:properties.runningState,provisioning:properties.provisioningState,replicas:properties.replicas}' -o json
