name: Immutable image candidate retained commerce validation
on:
  push:
    branches: [migration/azure-sql-blob]
    paths: [.github/workflows/immutable-image-commerce-validation.yml]
permissions:
  contents: read
  actions: read
  id-token: write
concurrency:
  group: hidi-immutable-image-commerce-validation
  cancel-in-progress: false
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    env:
      CANDIDATE_SHA: 5f756d31cdbb2203ddc1ad8107b4f6fae7b6259f
      DATABASE_URL: 'sqlserver://localhost:1433;database=fixture;user=build;password=build;encrypt=true'
      API_URL: http://127.0.0.1:4100/v1
      NEXT_TELEMETRY_DISABLED: '1'
      PLAYWRIGHT_BROWSERS_PATH: ${{ github.workspace }}/.cache/immutable-image-commerce-browsers
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.CANDIDATE_SHA }}
          path: candidate-source
          fetch-depth: 0
      - uses: actions/checkout@v4
        with:
          ref: 3096b44f716dbcd090d5d22e6cbe87c975009eb4
          path: production-tests
          fetch-depth: 0
      - name: Download and authenticate the exact green bridge evidence
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            https://api.github.com/repos/HIDIfashions/HIDI-ecommerce/actions/artifacts/12479956399/zip \
            -o "$RUNNER_TEMP/bridge.zip"
          echo "abc20dae0caa36a6022859df530c6e73acf6f15162da78ba85190140c8ce2ec3  $RUNNER_TEMP/bridge.zip" | sha256sum --check
          mkdir bridge-evidence
          unzip -q "$RUNNER_TEMP/bridge.zip" -d bridge-evidence
      - uses: pnpm/action-setup@v4
        with:
          version: 10.15.1
      - uses: actions/setup-node@v4
        with:
          node-version: '22.16.0'
          cache: pnpm
          cache-dependency-path: candidate-source/pnpm-lock.yaml
      - name: Install fixture and browser tooling without building a release image
        working-directory: candidate-source
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$CANDIDATE_SHA"
          pnpm install --frozen-lockfile
          pnpm db:generate
          pnpm --filter @hidi/api build
          npm install --prefix "$RUNNER_TEMP/commerce-tools" --no-audit --no-fund playwright@1.56.1
          echo "HIDI_PLAYWRIGHT_MODULE=$RUNNER_TEMP/commerce-tools/node_modules/playwright/index.mjs" >> "$GITHUB_ENV"
          node "$RUNNER_TEMP/commerce-tools/node_modules/playwright/cli.js" install --with-deps chromium firefox webkit
      - uses: azure/login@v2
        with:
          client-id: 3d62eb64-29dc-48ee-ab35-093312bd50af
          tenant-id: e756fdc0-2646-4e94-ac4d-ed7c11f87f34
          subscription-id: 91d9572d-0f0b-47fe-802d-0eef36d7c719
      - name: Verify provenance and extract the published immutable web container
        working-directory: candidate-source
        run: |
          set -euo pipefail
          az acr login --name acrhidiprod0927 --only-show-errors
          python - <<'PY'
          import hashlib,importlib.util,json,os,subprocess
          from pathlib import Path
          evidence=Path('../bridge-evidence/evidence/photo-live')
          read=lambda name:json.loads((evidence/name).read_text())
          sealed=read('sealed.json')
          assert sealed['passed'] and sealed['photoSourceSha']==os.environ['CANDIDATE_SHA']
          assert sealed['sourceSha']=='3096b44f716dbcd090d5d22e6cbe87c975009eb4'
          for name,digest in sealed['manifest'].items():
              assert hashlib.sha256((evidence/name).read_bytes()).hexdigest()==digest,name
          images=read('published.json')['images']
          assert images['web']=='acrhidiprod0927.azurecr.io/hidi-web@sha256:506bdba05d969fe4aeb6176c22cca53d22b0eb653da70b306397dde41e014441'
          assert images['api']=='acrhidiprod0927.azurecr.io/hidi-api@sha256:4d14ec2469e64f1b1478036d89a0305f938c06922145630f5ac5e71de3c69df3'
          assert read('tests.json')['passed']
          storage=read('azure-storage-test.json')
          assert storage['passed'] and storage['image']==images['web']
          assert storage['productionTrafficChanged'] is False and storage['databaseWrites']==0
          assert storage['validationJobRemoved'] and storage['temporaryBlobFamilyDeleted']
          p=Path('deploy/photo-live/release.py').resolve()
          spec=importlib.util.spec_from_file_location('immutable_commerce_release',p)
          r=importlib.util.module_from_spec(spec);spec.loader.exec_module(r)
          r.r.fresh_source()
          observed={app:r.r.cloud.snapshot(r.r.cloud.app(app)) for app in ['hidi-api','hidi-web']}
          assert observed==read('before.json'),'Production baseline moved; stop validation'
          target=r.P/'immutable-commerce-web'
          subprocess.run(['docker','pull',images['web']],check=True)
          assert r.r.guard.image_id(images['web'])==sealed['images']['web']
          r.r.images.extract(images['web'],target)
          baseline_target=r.P/'baseline-commerce-web'
          r.r.images.extract(observed['hidi-web']['image'],baseline_target)
          r.save('immutable-commerce-provenance.json',{'passed':True,'photoSourceSha':r.source_sha(),'image':images['web'],'imageId':sealed['images']['web'],'bridgeRun':39902561056,'baseline':observed,'productionTrafficChanged':False,'databaseWrites':0,'releaseImageRebuilt':False})
          with open(os.environ['GITHUB_ENV'],'a') as stream:
              stream.write('HIDI_CANDIDATE_RUNTIME='+str(target)+'\n')
              stream.write('HIDI_CANDIDATE_API='+str(Path.cwd())+'\n')
              stream.write('HIDI_BASELINE_RUNTIME='+str(baseline_target)+'\n')
          PY
      - name: Run unchanged production-era commerce probes on both immutable images
        working-directory: production-tests
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "3096b44f716dbcd090d5d22e6cbe87c975009eb4"
          mkdir -p evidence/immutable-commerce
          export HIDI_PUBLISHED_RUNTIME="$HIDI_CANDIDATE_RUNTIME"
          set +e
          HIDI_CANDIDATE_RUNTIME="$HIDI_BASELINE_RUNTIME" node deploy/checkout-hydration/candidate.mjs > evidence/immutable-commerce/baseline.log 2>&1
          baseline_status=$?
          if [ -d evidence/checkout-hydration-release/candidate ]; then
            mv evidence/checkout-hydration-release/candidate evidence/immutable-commerce/baseline
          fi
          HIDI_CANDIDATE_RUNTIME="$HIDI_PUBLISHED_RUNTIME" node deploy/checkout-hydration/candidate.mjs > evidence/immutable-commerce/candidate.log 2>&1
          candidate_status=$?
          if [ -d evidence/checkout-hydration-release/candidate ]; then
            mv evidence/checkout-hydration-release/candidate evidence/immutable-commerce/candidate
          fi
          cat evidence/immutable-commerce/baseline.log
          cat evidence/immutable-commerce/candidate.log
          test "$baseline_status" -eq 0 && test "$candidate_status" -eq 0
      - name: Require complete browser coverage and unchanged production state
        if: always()
        working-directory: candidate-source
        run: |
          python - <<'PY'
          import importlib.util,json
          from pathlib import Path
          p=Path('deploy/photo-live/release.py').resolve()
          spec=importlib.util.spec_from_file_location('immutable_commerce_final',p)
          r=importlib.util.module_from_spec(spec);spec.loader.exec_module(r)
          prior=json.loads(Path('../bridge-evidence/evidence/photo-live/before.json').read_text())
          observed={app:r.r.cloud.snapshot(r.r.cloud.app(app)) for app in prior}
          assert observed==prior,'Production baseline changed during validation'
          r.save('immutable-commerce-state.json',{'passed':True,'productionTrafficChanged':False,'databaseWrites':0,'baseline':observed})
          reports={}
          for target in ['baseline','candidate']:
              root=Path('../production-tests/evidence/immutable-commerce')/target
              reports[target]={}
              for name,relative,key,count in [('checkout','report.json','cases',24),('product','product/report.json','cases',6),('pricing','pricing/report.json','results',6)]:
                  report=json.loads((root/relative).read_text())
                  assert report['passed'] and report['productionWrites']==0,(target,name)
                  cases=report[key]
                  assert len(cases)==count,(target,name,len(cases))
                  assert {case['engine'] for case in cases}=={'chromium','firefox','webkit'},(target,name)
                  reports[target][name]=report
          r.save('immutable-commerce-result.json',{'passed':True,'productionTrafficChanged':False,'databaseWrites':0,'photoSourceSha':r.source_sha(),'testSourceSha':'3096b44f716dbcd090d5d22e6cbe87c975009eb4','releaseImageRebuilt':False,'reports':reports})
          print('PASS: baseline and immutable candidate; all cart/checkout/product/pricing browsers; production unchanged')
          PY
      - name: Preserve supplemental evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: immutable-image-commerce-evidence
          path: |
            candidate-source/evidence/photo-live/
            production-tests/evidence/immutable-commerce/
          retention-days: 30
