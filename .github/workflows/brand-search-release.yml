name: Release HIDI official brand search metadata
on:
  push:
    branches: [migration/azure-sql-blob]
    paths: [.github/workflows/brand-search-release.yml, deploy/brand-search/**]
  workflow_dispatch:
permissions:
  contents: read
  id-token: write
concurrency:
  group: hidi-hero-guarded-release
  cancel-in-progress: ${{ github.event.head_commit.message == 'Cover verified Cloudflare analytics in read-only brand checks' }}
jobs:
  release:
    if: github.ref == 'refs/heads/migration/azure-sql-blob'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      HIDI_PLAYWRIGHT_MODULE: /tmp/hidi-brand-browser/node_modules/playwright/index.mjs
      PLAYWRIGHT_BROWSERS_PATH: /tmp/hidi-brand-browsers
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '24'}
      - name: Validate brand metadata and release scripts
        run: |
          node --test deploy/seo-discovery/seo.test.mjs deploy/seo-discovery/policy-metadata.test.mjs
          node --check deploy/brand-search/probes.mjs
          node --check deploy/brand-search/candidate.mjs
          python3 -m py_compile deploy/brand-search/patch-runtime.py deploy/brand-search/release.py
      - name: Install exact backup and browser tooling
        timeout-minutes: 8
        run: |
          printf 'Acquire::Retries "1";\nAcquire::http::Timeout "20";\nAcquire::https::Timeout "20";\n' | sudo tee /etc/apt/apt.conf.d/99hidi-download-timeouts >/dev/null
          command -v skopeo || (sudo apt-get update -qq && sudo apt-get install -y skopeo)
          npm install --prefix /tmp/hidi-brand-browser --no-save --registry=https://registry.npmjs.org --fetch-timeout=30000 --fetch-retries=1 playwright@1.56.1
          node /tmp/hidi-brand-browser/node_modules/playwright/cli.js install --with-deps chromium firefox webkit
      - uses: azure/login@v2
        with:
          client-id: 3d62eb64-29dc-48ee-ab35-093312bd50af
          tenant-id: e756fdc0-2646-4e94-ac4d-ed7c11f87f34
          subscription-id: 91d9572d-0f0b-47fe-802d-0eef36d7c719
      - name: Capture current production and verify rollback backup
        run: |
          az acr login --name acrhidiprod0927 --only-show-errors
          python3 deploy/brand-search/release.py capture
      - name: Change only the reviewed metadata module
        run: python3 deploy/brand-search/release.py compose
      - name: Verify isolated candidate across desktop and mobile browsers
        run: |
          node deploy/brand-search/candidate.mjs
          python3 deploy/brand-search/release.py seal
      - name: Publish tested image
        run: python3 deploy/brand-search/release.py publish
      - uses: azure/login@v2
        with:
          client-id: 3d62eb64-29dc-48ee-ab35-093312bd50af
          tenant-id: e756fdc0-2646-4e94-ac4d-ed7c11f87f34
          subscription-id: 91d9572d-0f0b-47fe-802d-0eef36d7c719
      - name: Deploy and verify live brand metadata
        id: apply
        timeout-minutes: 15
        run: timeout --signal=TERM --kill-after=5m 12m python3 deploy/brand-search/release.py apply --image "$WEB_IMAGE"
      - uses: azure/login@v2
        if: always() && env.WEB_IMAGE != '' && steps.apply.outcome != 'success'
        with:
          client-id: 3d62eb64-29dc-48ee-ab35-093312bd50af
          tenant-id: e756fdc0-2646-4e94-ac4d-ed7c11f87f34
          subscription-id: 91d9572d-0f0b-47fe-802d-0eef36d7c719
      - name: Recover interrupted owned rollout
        if: always() && env.WEB_IMAGE != '' && steps.apply.outcome != 'success'
        timeout-minutes: 10
        run: python3 deploy/brand-search/release.py recover --image "$WEB_IMAGE"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: brand-search-${{ github.run_id }}-${{ github.run_attempt }}
          path: evidence/brand-search
          retention-days: 30
