name: Deploy one-rupee COD tolerance
on:
  push:
    branches: [migration/azure-sql-blob]
    paths: [.github/workflows/cod-tolerance-release.yml, 'deploy/cod-tolerance/**']
permissions:
  contents: read
  id-token: write
concurrency:
  group: hidi-hero-guarded-release
  cancel-in-progress: false
jobs:
  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    services:
      sqlserver:
        image: mcr.microsoft.com/mssql/server:2022-latest
        env:
          ACCEPT_EULA: Y
          MSSQL_SA_PASSWORD: Disposable-CI-Only_2026!
        ports: ['1433:1433']
    env:
      DATABASE_URL: sqlserver://localhost:1433;database=fixture;user=fixture;password=fixture;encrypt=true
      TRACKING_TEST_SQL_PASSWORD: Disposable-CI-Only_2026!
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: pnpm/action-setup@v4
        with: { version: 10.15.1 }
      - uses: actions/setup-node@v4
        with: { node-version: 24, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @hidi/api build
      - run: pnpm --filter @hidi/api test:customer-experience
      - uses: azure/login@v2
        with:
          client-id: 3d62eb64-29dc-48ee-ab35-093312bd50af
          tenant-id: e756fdc0-2646-4e94-ac4d-ed7c11f87f34
          subscription-id: 91d9572d-0f0b-47fe-802d-0eef36d7c719
      - run: az acr login --name acrhidiprod0927 --only-show-errors
      - name: Build minimal API image and verify SQL tolerance boundaries
        run: python3 deploy/cod-tolerance/release.py prepare
      - name: Deploy tolerance and confirm requested order
        run: python3 deploy/cod-tolerance/release.py apply
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cod-tolerance-verification
          path: evidence/cod-tolerance
          retention-days: 14
