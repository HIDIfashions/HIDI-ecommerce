name: Validate SEO-only candidate without deployment
on:
  push:
    branches: [migration/azure-sql-blob]
    paths: [deploy/seo-discovery/**, deploy/seo-foundation/**, .github/workflows/seo-discovery-validation.yml]
permissions:
  contents: read
  id-token: write
concurrency:
  group: hidi-seo-candidate-validation
  cancel-in-progress: false
jobs:
  validation:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      HIDI_PLAYWRIGHT_MODULE: /tmp/hidi-seo-browser/node_modules/playwright/index.mjs
      PLAYWRIGHT_BROWSERS_PATH: /tmp/hidi-seo-browsers
      HIDI_SEO_LOOKBOOK_RETIRED: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 24}
      - name: Install isolated browser regression tools
        run: |
          npm install --prefix /tmp/hidi-seo-browser --no-save playwright@1.56.1
          node /tmp/hidi-seo-browser/node_modules/playwright/cli.js install --with-deps chromium firefox webkit
      - uses: azure/login@v2
        with:
          client-id: 3d62eb64-29dc-48ee-ab35-093312bd50af
          tenant-id: e756fdc0-2646-4e94-ac4d-ed7c11f87f34
          subscription-id: 91d9572d-0f0b-47fe-802d-0eef36d7c719
      - run: az acr login --name acrhidiprod0927 --only-show-errors
      - name: Validate exact live baseline and SEO-only candidate
        run: python3 deploy/seo-discovery/validate.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: seo-candidate-evidence-${{ github.run_id }}
          path: evidence/seo-discovery
          retention-days: 30
