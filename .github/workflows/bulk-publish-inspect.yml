name: Inspect retained bulk product import
on:
  push:
    branches: [migration/azure-sql-blob]
    paths: [.github/workflows/bulk-publish-inspect.yml]
  workflow_dispatch:
permissions:
  contents: read
  id-token: write
concurrency:
  group: hidi-hero-guarded-release
  cancel-in-progress: false
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: azure/login@v2
        with:
          client-id: 3d62eb64-29dc-48ee-ab35-093312bd50af
          tenant-id: e756fdc0-2646-4e94-ac4d-ed7c11f87f34
          subscription-id: 91d9572d-0f0b-47fe-802d-0eef36d7c719
      - name: Capture fresh backups and bulk import modules
        run: |
          set -euo pipefail
          az acr login --name acrhidiprod0927 --only-show-errors
          python3 deploy/bulk-publish/release.py inspect
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bulk-publish-inspection-${{ github.run_id }}
          path: evidence/bulk-publish
          retention-days: 30
