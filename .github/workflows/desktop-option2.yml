name: Desktop Option 2 - mobile-preserving checked release
on:
  push:
    branches: [migration/azure-sql-blob, work/desktop-option2-20261015]
    paths:
      - apps/web/app/collections/layout.tsx
      - apps/web/app/collections/desktop-option2.css
      - deploy/desktop-option2/**
      - .github/workflows/desktop-option2.yml
  workflow_dispatch:
    inputs:
      deploy:
        description: Release only the tested CSS overlay over the freshly captured live image
        type: boolean
        required: true
        default: false
permissions:
  contents: read
  id-token: write
concurrency:
  group: ${{ ((github.event_name == 'workflow_dispatch' && inputs.deploy) || (github.event_name == 'push' && github.ref == 'refs/heads/migration/azure-sql-blob' && contains(github.event.head_commit.message, '[deploy-desktop-option2]'))) && 'hidi-hero-guarded-release' || format('hidi-desktop-check-{0}', github.ref) }}
  cancel-in-progress: false
jobs:
  verify-and-release:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      HIDI_PLAYWRIGHT_MODULE: /tmp/hidi-desktop-browser/node_modules/playwright/index.mjs
      PLAYWRIGHT_BROWSERS_PATH: /tmp/hidi-desktop-browsers
      HIDI_BROWSER_ENGINES: chromium,firefox,webkit
      HIDI_MEDIA_SOURCE_SHA: ${{ github.sha }}
      HIDI_BUTTON_OUTPUT: evidence/desktop-option2/retained-commerce
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 24}
      - name: Verify exact desktop-only CSS and retained release safeguards
        run: |
          python3 deploy/desktop-option2/prepare.py
          python3 deploy/desktop-option2/test_patch.py
          python3 deploy/desktop-option2/release.py self-test
          node --check deploy/desktop-option2/verify.mjs
          node --check deploy/desktop-option2/live.mjs
          node --check deploy/desktop-option2/candidate.mjs
      - name: Install all three browser engines
        run: |
          npm install --prefix /tmp/hidi-desktop-browser --no-package-lock playwright@1.56.1
          node /tmp/hidi-desktop-browser/node_modules/playwright/cli.js install --with-deps chromium firefox webkit
      - name: Verify 72 viewport comparisons, mobile pixels, sparse grids and unchanged routes
        run: node deploy/desktop-option2/verify.mjs
      - name: Require explicit release request on the production source branch
        if: ((github.event_name == 'workflow_dispatch' && inputs.deploy) || (github.event_name == 'push' && github.ref == 'refs/heads/migration/azure-sql-blob' && contains(github.event.head_commit.message, '[deploy-desktop-option2]')))
        run: test "$GITHUB_REF" = 'refs/heads/migration/azure-sql-blob'
      - uses: azure/login@v2
        if: ((github.event_name == 'workflow_dispatch' && inputs.deploy) || (github.event_name == 'push' && github.ref == 'refs/heads/migration/azure-sql-blob' && contains(github.event.head_commit.message, '[deploy-desktop-option2]')))
        with:
          client-id: 3d62eb64-29dc-48ee-ab35-093312bd50af
          tenant-id: e756fdc0-2646-4e94-ac4d-ed7c11f87f34
          subscription-id: 91d9572d-0f0b-47fe-802d-0eef36d7c719
      - name: Capture fresh live state and verify exact rollback images
        if: ((github.event_name == 'workflow_dispatch' && inputs.deploy) || (github.event_name == 'push' && github.ref == 'refs/heads/migration/azure-sql-blob' && contains(github.event.head_commit.message, '[deploy-desktop-option2]')))
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y skopeo
          az acr login --name acrhidiprod0927 --only-show-errors
          python3 deploy/desktop-option2/release.py capture
          echo "HIDI_CANDIDATE_RUNTIME=$RUNNER_TEMP/hidi-desktop-option2-private/web/candidate-app" >> "$GITHUB_ENV"
      - name: Build a single-file CSS overlay preserving the entire existing application
        if: ((github.event_name == 'workflow_dispatch' && inputs.deploy) || (github.event_name == 'push' && github.ref == 'refs/heads/migration/azure-sql-blob' && contains(github.event.head_commit.message, '[deploy-desktop-option2]')))
        run: |
          tag="acrhidiprod0927.azurecr.io/hidi-web:desktop-option2-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          python3 deploy/desktop-option2/release.py compose --tag "$tag"
          echo "CANDIDATE_WEB=$tag" >> "$GITHUB_ENV"
      - name: Test exact candidate commerce against disposable fixtures and seal evidence
        if: ((github.event_name == 'workflow_dispatch' && inputs.deploy) || (github.event_name == 'push' && github.ref == 'refs/heads/migration/azure-sql-blob' && contains(github.event.head_commit.message, '[deploy-desktop-option2]')))
        run: |
          node deploy/desktop-option2/candidate.mjs
          python3 deploy/desktop-option2/release.py mark-tested --tag "$CANDIDATE_WEB"
      - name: Publish only the exact tested immutable image
        if: ((github.event_name == 'workflow_dispatch' && inputs.deploy) || (github.event_name == 'push' && github.ref == 'refs/heads/migration/azure-sql-blob' && contains(github.event.head_commit.message, '[deploy-desktop-option2]')))
        run: python3 deploy/desktop-option2/release.py publish --tag "$CANDIDATE_WEB"
      - name: Release web only with live mobile checks and ownership-checked rollback
        if: ((github.event_name == 'workflow_dispatch' && inputs.deploy) || (github.event_name == 'push' && github.ref == 'refs/heads/migration/azure-sql-blob' && contains(github.event.head_commit.message, '[deploy-desktop-option2]')))
        id: apply
        timeout-minutes: 125
        run: timeout --signal=TERM --kill-after=65m 50m python3 deploy/desktop-option2/release.py apply --image "$WEB_IMAGE"
      - name: Recover an interrupted owned release
        if: always() && env.WEB_IMAGE != '' && steps.apply.outcome != 'success'
        timeout-minutes: 65
        run: python3 deploy/desktop-option2/release.py recover --image "$WEB_IMAGE"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: hidi-desktop-option2-evidence-${{ github.run_id }}
          path: |
            evidence/desktop-option2/*.json
            evidence/desktop-option2/*.png
            evidence/desktop-option2/retained-commerce/*.json
            evidence/desktop-option2/retained-commerce/*.png
          retention-days: 30
