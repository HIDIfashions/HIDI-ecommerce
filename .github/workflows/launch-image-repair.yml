name: Guarded launch image performance repair
on:
  push:
    branches: [migration/azure-sql-blob]
    paths: [deploy/launch-image-repair/**, .github/workflows/launch-image-repair.yml]
permissions:
  contents: read
  id-token: write
concurrency:
  group: hidi-hero-guarded-release
  cancel-in-progress: false
jobs:
  release:
    if: github.ref == 'refs/heads/migration/azure-sql-blob'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      HIDI_PLAYWRIGHT_MODULE: /tmp/hidi-launch-browser/node_modules/playwright/index.mjs
      PLAYWRIGHT_BROWSERS_PATH: /tmp/hidi-launch-browsers
      HIDI_SHARP_MODULE: /tmp/hidi-launch-tools/node_modules/sharp
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-node@v4
        with: {node-version: 24}
      - name: Test damaged JPEG recovery and strict error boundaries
        run: |
          npm install --prefix /tmp/hidi-launch-tools --no-save sharp@0.34.5
          node --test deploy/launch-image-repair/recovery.test.mjs
          node --check deploy/collection-speed/images.mjs
          python3 -m py_compile deploy/launch-image-repair/*.py
      - name: Install desktop and mobile browser test engines
        run: |
          npm install --prefix /tmp/hidi-launch-browser --no-save playwright@1.56.1
          node /tmp/hidi-launch-browser/node_modules/playwright/cli.js install --with-deps chromium firefox webkit
      - uses: azure/login@v2
        with:
          client-id: 3d62eb64-29dc-48ee-ab35-093312bd50af
          tenant-id: e756fdc0-2646-4e94-ac4d-ed7c11f87f34
          subscription-id: 91d9572d-0f0b-47fe-802d-0eef36d7c719
      - name: Capture current live baseline and verify exact rollback backup
        run: |
          az acr login --name acrhidiprod0927 --only-show-errors
          python3 deploy/launch-image-repair/release.py capture
          echo "HIDI_CANDIDATE_RUNTIME=$RUNNER_TEMP/hidi-launch-image-repair-private/web/candidate-app" >> "$GITHUB_ENV"
      - name: Prepare published product photos and compose the retained runtime
        run: python3 deploy/launch-image-repair/release.py compose
      - name: Check actual catalogue photos and the failing JPEG in six browser combinations
        run: node deploy/launch-image-repair/candidate.mjs
      - name: Check retained checkout, COD, PIN autofill and payment behavior in six browser combinations
        run: |
          cp deploy/cod-pin/candidate.mjs deploy/launch-image-repair/commerce-candidate.mjs
          sed -i "s|'./probes.mjs'|'../cod-pin/probes.mjs'|; s|evidence/cod-pin|evidence/launch-image-repair|g" deploy/launch-image-repair/commerce-candidate.mjs
          node deploy/launch-image-repair/commerce-candidate.mjs
          python3 deploy/launch-image-repair/release.py seal
      - name: Publish the exact tested immutable web image
        run: python3 deploy/launch-image-repair/release.py publish
      - name: Release web and verify every published first photo and checkout
        id: apply
        timeout-minutes: 20
        run: timeout --signal=TERM --kill-after=10m 15m python3 deploy/launch-image-repair/release.py apply --image "$WEB_IMAGE"
      - name: Recover any interrupted owned rollout
        if: always() && env.WEB_IMAGE != '' && steps.apply.outcome != 'success'
        timeout-minutes: 15
        run: python3 deploy/launch-image-repair/release.py recover --image "$WEB_IMAGE"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: launch-image-repair-${{ github.run_id }}-${{ github.run_attempt }}
          path: evidence/launch-image-repair
          retention-days: 30
