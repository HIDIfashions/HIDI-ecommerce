name: Stage MSG91 callback credential disabled
on:
  push:
    branches: [migration/azure-sql-blob]
    paths: [.github/workflows/whatsapp-msg91-stage.yml, deploy/whatsapp-msg91/stage.py]
permissions:
  contents: read
  id-token: write
jobs:
  stage:
    if: contains(github.event.head_commit.message, '[stage-wa-ordering]')
    concurrency:
      group: hidi-hero-guarded-release
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: azure/login@v2
        with:
          client-id: 3d62eb64-29dc-48ee-ab35-093312bd50af
          tenant-id: e756fdc0-2646-4e94-ac4d-ed7c11f87f34
          subscription-id: 91d9572d-0f0b-47fe-802d-0eef36d7c719
      - run: az extension add --name containerapp --upgrade --only-show-errors
      - run: python3 -m py_compile deploy/whatsapp-msg91/stage.py
      - run: python3 deploy/whatsapp-msg91/stage.py
        env:
          HIDI_WHATSAPP_TEST_NUMBERS: ${{ secrets.HIDI_WHATSAPP_TEST_NUMBERS }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: whatsapp-callback-stage-${{ github.run_id }}
          path: evidence/whatsapp-stage
          retention-days: 3
