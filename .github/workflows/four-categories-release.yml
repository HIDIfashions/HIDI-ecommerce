name: Four customer categories guarded Azure release
on:
  push:
    branches: [migration/azure-sql-blob]
    paths: [.github/workflows/four-categories-release.yml]
  workflow_dispatch:
permissions:
  contents: read
  id-token: write
concurrency:
  group: hidi-hero-guarded-release
  cancel-in-progress: false
jobs:
  inspect-and-release:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      DATABASE_URL: sqlserver://localhost:1433;database=hidi;user=fixture;password=fixture;encrypt=true
      NEXT_TELEMETRY_DISABLED: 1
      PLAYWRIGHT_BROWSERS_PATH: /tmp/hidi-four-category-browsers
      HIDI_PLAYWRIGHT_MODULE: /tmp/hidi-four-category-browser/node_modules/playwright/index.mjs
      HIDI_BROWSER_ENGINES: chromium,firefox,webkit
      HIDI_CANDIDATE_RUNTIME: ${{ runner.temp }}/hidi-four-categories-private/web/candidate-app
      HIDI_CANDIDATE_API: ${{ runner.temp }}/hidi-four-categories-private/api/candidate-app
      HIDI_CATEGORY_PRIVATE: ${{ runner.temp }}/hidi-four-categories-private
      HIDI_BUTTON_OUTPUT: evidence/four-categories/retained-commerce
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: pnpm/action-setup@v4
        with: {version: 10.15.1}
      - uses: actions/setup-node@v4
        with: {node-version: 24, cache: pnpm}
      - name: Compile the single category API service and verify reference creation
        run: |
          set -euo pipefail
          pnpm install --frozen-lockfile
          pnpm db:generate
          node apps/api/node_modules/typescript/bin/tsc -p apps/api/tsconfig.json
          node --test tests/four-categories-taxonomy.test.mjs
          node --import ./apps/api/node_modules/tsx/dist/loader.mjs --test tests/product-skn-collections.test.ts
          python3 -m py_compile deploy/four-categories/release.py deploy/four-categories/patch-web.py deploy/four-categories/patch-landing.py
      - name: Install desktop and mobile browser engines
        run: |
          npm install --prefix /tmp/hidi-four-category-browser --no-save playwright@1.56.1
          node /tmp/hidi-four-category-browser/node_modules/playwright/cli.js install --with-deps chromium firefox webkit
      - uses: azure/login@v2
        with:
          client-id: 3d62eb64-29dc-48ee-ab35-093312bd50af
          tenant-id: e756fdc0-2646-4e94-ac4d-ed7c11f87f34
          subscription-id: 91d9572d-0f0b-47fe-802d-0eef36d7c719
      - name: Capture live images, settings and media and verify rollback backups
        run: |
          az acr login --name acrhidiprod0927 --only-show-errors
          python3 deploy/four-categories/release.py capture
      - name: Compose the four categories over the exact retained applications
        run: |
          set -euo pipefail
          for app in api web; do
            tag="acrhidiprod0927.azurecr.io/hidi-$app:four-categories-${GITHUB_RUN_ID}"
            python3 deploy/four-categories/release.py compose --app "$app" --tag "$tag"
            echo "CANDIDATE_${app^^}=$tag" >> "$GITHUB_ENV"
          done
      - name: Verify category filters and actual desktop/mobile navigation
        run: |
          set -euo pipefail
          node deploy/four-categories/candidate.mjs
          node tests/admin-quick-tools.runtime.mjs
          node deploy/button-states/revert-candidate.mjs
      - name: Publish only verified immutable candidate images
        run: |
          set -euo pipefail
          for app in api web; do
            key="CANDIDATE_${app^^}"
            docker push "${!key}"
            digest="$(az acr repository show --name acrhidiprod0927 --image "hidi-$app:four-categories-${GITHUB_RUN_ID}" --query digest -o tsv --only-show-errors)"
            echo "${app^^}_IMAGE=acrhidiprod0927.azurecr.io/hidi-$app@$digest" >> "$GITHUB_ENV"
          done
      - name: Save the current references and create only missing category records
        run: python3 deploy/four-categories/release.py taxonomy
      - name: Release and verify the live categories with ownership-checked rollback
        run: python3 deploy/four-categories/release.py apply
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: four-categories-${{ github.run_id }}
          path: evidence/four-categories
          retention-days: 30
