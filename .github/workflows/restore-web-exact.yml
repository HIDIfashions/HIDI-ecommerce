name: Restore exact HIDI web image

on:
  push:
    branches: [migration/azure-sql-blob]

permissions:
  contents: read

jobs:
  restore-web:
    if: contains(github.event.head_commit.message, '[restore-web-exact]')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: azure/login@v2
        with:
          client-id: 3d62eb64-29dc-48ee-ab35-093312bd50af
          tenant-id: e756fdc0-2646-4e94-ac4d-ed7c11f87f34
          subscription-id: 91d9572d-0f0b-47fe-802d-0eef36d7c719

      - name: Restore exact pre-scanner web image only
        shell: bash
        run: |
          set -euo pipefail
          RG="rg-hidi-prod"
          APP="hidi-web"
          IMAGE="acrhidiprod0927.azurecr.io/hidi-web@sha256:53a948e73f072d56b7aa3b23901a2898b4b39b925a115720ad4c32c3ba00a5e0"
          revision="restoreweb${GITHUB_SHA::8}${GITHUB_RUN_NUMBER}"

          echo "Restoring only $APP to exact pre-scanner image digest."
          echo "API is intentionally untouched."

          az containerapp update \
            --resource-group "$RG" \
            --name "$APP" \
            --image "$IMAGE" \
            --revision-suffix "${revision:0:63}" >/tmp/restore-web.json

          target="$(az containerapp show -g "$RG" -n "$APP" --query properties.latestRevisionName -o tsv)"
          deadline=$((SECONDS + 600))
          while [ "$SECONDS" -lt "$deadline" ]; do
            health="$(az containerapp revision show -g "$RG" -n "$APP" --revision "$target" --query properties.healthState -o tsv 2>/dev/null || true)"
            ready="$(az containerapp show -g "$RG" -n "$APP" --query properties.latestReadyRevisionName -o tsv)"
            current_image="$(az containerapp show -g "$RG" -n "$APP" --query properties.template.containers[0].image -o tsv)"
            echo "revision=$target health=${health:-pending} ready=${ready:-none} image=$current_image"
            if [ "$health" = "Healthy" ] && [ "$ready" = "$target" ] && [ "$current_image" = "$IMAGE" ]; then
              exit 0
            fi
            sleep 15
          done

          echo "Exact web restore did not become healthy in time." >&2
          exit 1

      - name: Verify public and admin boundaries
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSI --max-time 30 https://thidigk.thehidi.com/ >/dev/null
          status="$(curl -sS -o /dev/null -w '%{http_code}' --max-time 30 https://thidigk.thehidi.com/admin)"
          case "$status" in
            200|301|302|303|307|308|401|403) ;;
            *) echo "Unexpected admin boundary HTTP $status" >&2; exit 1 ;;
          esac
          echo "Exact pre-scanner web image restored and healthy."