name: WELCOME250 guarded configuration rollout
on:
  push:
    branches: [migration/azure-sql-blob]
    paths: [deploy/welcome250/**, .github/workflows/welcome250-activate.yml]
permissions:
  contents: read
  id-token: write
concurrency:
  group: hidi-checkout-offers-release
  cancel-in-progress: false
jobs:
  welcome250:
    if: github.ref == 'refs/heads/migration/azure-sql-blob'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      HIDI_PLAYWRIGHT_MODULE: /tmp/hidi-offers-browser/node_modules/playwright/index.mjs
      PLAYWRIGHT_BROWSERS_PATH: /tmp/hidi-offers-browsers
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 1}
      - uses: actions/setup-node@v4
        with: {node-version: 24}
      - name: Validate independent welcome publication and guarded rollback
        run: |
          node --test deploy/offers/model.test.mjs deploy/offers/handler.test.mjs deploy/welcome250/*.test.mjs
          node --check deploy/welcome250/rollout.mjs
          node --check deploy/welcome250/welcome-browser.mjs
      - uses: azure/login@v2
        with:
          client-id: 3d62eb64-29dc-48ee-ab35-093312bd50af
          tenant-id: e756fdc0-2646-4e94-ac4d-ed7c11f87f34
          subscription-id: 91d9572d-0f0b-47fe-802d-0eef36d7c719
      - name: Install isolated regression and backup tooling
        run: |
          sudo apt-get update -qq && sudo apt-get install -y skopeo
          npm install --prefix /tmp/hidi-offers-browser --no-save playwright@1.56.1
          node /tmp/hidi-offers-browser/node_modules/playwright/cli.js install --with-deps chromium firefox webkit
      - name: Back up live images and prepare exact runtime copies
        run: |
          az acr login --name acrhidiprod0927 --only-show-errors
          python3 deploy/checkout-offers/release.py capture
          python3 deploy/checkout-offers/release.py compose
          echo "HIDI_CANDIDATE_API=$RUNNER_TEMP/hidi-checkout-offers-private/api/candidate-app" >> "$GITHUB_ENV"
          echo "HIDI_CANDIDATE_RUNTIME=$RUNNER_TEMP/hidi-checkout-offers-private/web/candidate-app" >> "$GITHUB_ENV"
      - name: Verify retained pricing, payments, checkout, admin and purchase flows
        run: |
          node deploy/checkout-offers/api-test.mjs
          node deploy/welcome250/api-check.mjs
          node deploy/welcome250/browser-check.mjs
          python3 deploy/checkout-offers/release.py seal
      - uses: azure/login@v2
        with:
          client-id: 3d62eb64-29dc-48ee-ab35-093312bd50af
          tenant-id: e756fdc0-2646-4e94-ac4d-ed7c11f87f34
          subscription-id: 91d9572d-0f0b-47fe-802d-0eef36d7c719
      - name: Read current private configuration and prepare welcome-only plan
        run: node deploy/welcome250/rollout.mjs prepare
      - name: Activate WELCOME250 only and verify live policy
        id: activate
        run: node deploy/welcome250/rollout.mjs apply
      - name: Recover only this rollout if activation was interrupted
        if: always() && (steps.activate.outcome == 'failure' || steps.activate.outcome == 'cancelled')
        run: node deploy/welcome250/rollout.mjs recover
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: welcome250-rollout-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            evidence/welcome250
            evidence/checkout-offers
          retention-days: 30
