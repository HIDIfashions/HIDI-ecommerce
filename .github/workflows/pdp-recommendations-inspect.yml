name: Inspect PDP rollout state
on:
  push:
    branches: [migration/azure-sql-blob]
    paths: ['.github/workflows/pdp-recommendations-inspect.yml']
permissions:
  contents: read
  id-token: write
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: azure/login@v2
        with:
          client-id: 3d62eb64-29dc-48ee-ab35-093312bd50af
          tenant-id: e756fdc0-2646-4e94-ac4d-ed7c11f87f34
          subscription-id: 91d9572d-0f0b-47fe-802d-0eef36d7c719
      - name: Compare CLI and ARM preflight without writing
        run: |
          python3 - <<'PY'
          import importlib.util,json
          s=importlib.util.spec_from_file_location('release','deploy/pdp-recommendations/release.py')
          m=importlib.util.module_from_spec(s);s.loader.exec_module(m)
          cli=m.cloud.app('hidi-web')
          url='https://management.azure.com'+cli['id']+'?api-version='+m.cloud.API_VERSION
          arm,etag,*_=m.guard.arm_request('GET',url,m.guard.arm_token())
          print(json.dumps({'cli':m.cloud.snapshot(cli),'arm':m.cloud.snapshot(arm),'etagAvailable':bool(etag)},indent=2))
          def diff(a,b,p=''):
            if type(a)!=type(b): print('type differs:',p);return
            if isinstance(a,dict):
              for k in sorted(set(a)|set(b)):
                if k not in a or k not in b: print('key differs:',p+'/'+k)
                else: diff(a[k],b[k],p+'/'+k)
            elif isinstance(a,list):
              if len(a)!=len(b):print('length differs:',p)
              else:
                for i,(x,y) in enumerate(zip(a,b)):diff(x,y,p+'/'+str(i))
            elif a!=b: print('value differs:',p)
          diff(cli,arm)
          PY
