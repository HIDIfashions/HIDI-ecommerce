name: Inspect PDP rollout state
on:
  push:
    branches: [migration/azure-sql-blob]
    paths: ['.github/workflows/pdp-recommendations-inspect.yml']
permissions:
  contents: read
  id-token: write
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: azure/login@v2
        with:
          client-id: 3d62eb64-29dc-48ee-ab35-093312bd50af
          tenant-id: e756fdc0-2646-4e94-ac4d-ed7c11f87f34
          subscription-id: 91d9572d-0f0b-47fe-802d-0eef36d7c719
      - name: Read production revision state
        run: |
          az containerapp show -g rg-hidi-prod -n hidi-web --query '{image:properties.template.containers[0].image,latest:properties.latestRevisionName,ready:properties.latestReadyRevisionName,provisioning:properties.provisioningState,running:properties.runningStatus}'
          az containerapp revision list -g rg-hidi-prod -n hidi-web --query '[].{name:name,active:properties.active,health:properties.healthState,running:properties.runningState,provisioning:properties.provisioningState,replicas:properties.replicas,created:properties.createdTime}'
          az containerapp logs show -g rg-hidi-prod -n hidi-web --type system --tail 50
