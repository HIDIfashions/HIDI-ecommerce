name: Guarded compact care section placement release
on:
  push:
    branches: [migration/azure-sql-blob]
    paths:
      - .github/workflows/care-break-release.yml
      - deploy/care-break/**
  workflow_dispatch:
permissions:
  contents: read
  id-token: write
concurrency:
  group: hidi-hero-guarded-release
  cancel-in-progress: false
jobs:
  release:
    if: github.ref == 'refs/heads/migration/azure-sql-blob'
    runs-on: ubuntu-latest
    timeout-minutes: 300
    env:
      NEXT_TELEMETRY_DISABLED: 1
      PLAYWRIGHT_BROWSERS_PATH: /tmp/hidi-landing-media-browsers
      HIDI_PLAYWRIGHT_MODULE: /tmp/hidi-landing-media-browser/node_modules/playwright/index.mjs
      HIDI_RANGE_FIVE: "1"
      HIDI_BROWSER_ENGINES: chromium,firefox,webkit
      HIDI_BUTTON_OUTPUT: evidence/care-break/retained-commerce
      HIDI_CARE_BASE_SOURCE_SHA: 89d747d44cd99f98fe9e6f7eb2436fca6698a410
      HIDI_MEDIA_SOURCE_SHA: 7f2aa41e64f312440bba33b8357328824fd45c0f
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: pnpm/action-setup@v4
        with: {version: 10.15.1}
      - uses: actions/setup-node@v4
        with: {node-version: 24, cache: pnpm}
      - name: Verify scoped patch and permanent source regression
        run: |
          set -euo pipefail
          python3 -m py_compile deploy/care-break/release.py deploy/care-break/patch-runtime.py
          python3 deploy/care-break/release.py self-test
          node --check deploy/care-break/candidate.mjs
          node --check deploy/care-break/probes.mjs
          node --check deploy/care-break/live.mjs
          git fetch origin hidi-web-new
          git worktree add --detach "$RUNNER_TEMP/hidi-landing-source" "$HIDI_MEDIA_SOURCE_SHA"
          npm --prefix "$RUNNER_TEMP/hidi-landing-source/apps/web" ci
          npm --prefix "$RUNNER_TEMP/hidi-landing-source/apps/web" test
          npm --prefix "$RUNNER_TEMP/hidi-landing-source/apps/web" run build
          node --test "$RUNNER_TEMP/hidi-landing-source/deploy/hidi-web-new/runtime.test.mjs"
          node deploy/care-break/verify-source.mjs "$RUNNER_TEMP/hidi-landing-source"
          pnpm install --frozen-lockfile
      - name: Install desktop and mobile browser engines
        run: |
          set -euo pipefail
          npm install --prefix /tmp/hidi-landing-media-browser --no-save playwright@1.56.1
          node /tmp/hidi-landing-media-browser/node_modules/playwright/cli.js install --with-deps chromium firefox webkit
      - uses: azure/login@v2
        with:
          client-id: 3d62eb64-29dc-48ee-ab35-093312bd50af
          tenant-id: e756fdc0-2646-4e94-ac4d-ed7c11f87f34
          subscription-id: 91d9572d-0f0b-47fe-802d-0eef36d7c719
      - name: Capture and back up live runtime, media and settings
        run: |
          set -euo pipefail
          az acr login --name acrhidiprod0927 --only-show-errors
          python3 deploy/care-break/release.py capture
          echo "HIDI_CANDIDATE_RUNTIME=$RUNNER_TEMP/hidi-care-break-private/web/candidate-app" >> "$GITHUB_ENV"
          echo "HIDI_CANDIDATE_API=$RUNNER_TEMP/hidi-care-break-private/api/base-app" >> "$GITHUB_ENV"
          echo "HIDI_CATEGORY_PRIVATE=$RUNNER_TEMP/hidi-care-break-private" >> "$GITHUB_ENV"
      - name: Compose only approved care placement and compact styling
        run: |
          set -euo pipefail
          tag="acrhidiprod0927.azurecr.io/hidi-web:care-break-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          python3 deploy/care-break/release.py compose --tag "$tag"
          echo "CANDIDATE_WEB=$tag" >> "$GITHUB_ENV"
      - name: Test photograph, chapter links and retained shopping flows
        run: |
          set -euo pipefail
          node deploy/care-break/candidate.mjs
          node tests/admin-quick-tools.runtime.mjs | tee evidence/care-break/admin-quick-tools.json
          node deploy/four-categories/candidate.mjs
          node deploy/care-break/commerce-candidate.mjs
          python3 deploy/care-break/release.py mark-tested --tag "$CANDIDATE_WEB"
      - name: Publish the exact tested immutable image
        run: python3 deploy/care-break/release.py publish --tag "$CANDIDATE_WEB"
      - name: Release web only and verify live with ownership-checked rollback
        id: apply
        timeout-minutes: 125
        run: timeout --signal=TERM --kill-after=65m 50m python3 deploy/care-break/release.py apply --image "$WEB_IMAGE"
      - name: Reconcile an interrupted or failed release
        if: always() && env.WEB_IMAGE != '' && steps.apply.outcome != 'success'
        timeout-minutes: 65
        run: python3 deploy/care-break/release.py recover --image "$WEB_IMAGE"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: care-break-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            evidence/care-break
            evidence/four-categories
          retention-days: 30
