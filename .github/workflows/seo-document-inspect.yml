name: Inspect current HIDI SEO runtime without commerce writes
on:
  push:
    branches: [migration/azure-sql-blob]
    paths: [.github/workflows/seo-document-inspect.yml, deploy/seo-document/inspect.py]
permissions:
  contents: read
  id-token: write
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: azure/login@v2
        with:
          client-id: 3d62eb64-29dc-48ee-ab35-093312bd50af
          tenant-id: e756fdc0-2646-4e94-ac4d-ed7c11f87f34
          subscription-id: 91d9572d-0f0b-47fe-802d-0eef36d7c719
      - run: |
          az acr login --name acrhidiprod0927 --only-show-errors
          python3 deploy/seo-document/inspect.py
      - uses: actions/upload-artifact@v4
        with:
          name: seo-document-inspection
          path: evidence/seo-document-inspection
