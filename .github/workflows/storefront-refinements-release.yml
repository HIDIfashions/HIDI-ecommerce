name: Approved storefront follow-up - backed up and guarded Azure release
on:
  push:
    branches: [migration/azure-sql-blob]
    paths: [deploy/storefront-refinements/**, deploy/Dockerfile.web, .github/workflows/storefront-refinements-release.yml]
permissions:
  contents: read
  actions: read
  id-token: write
concurrency:
  group: hidi-hero-guarded-release
  cancel-in-progress: false
jobs:
  test-candidate-and-release:
    runs-on: ubuntu-latest
    timeout-minutes: 80
    env:
      DATABASE_URL: sqlserver://localhost:1433;database=hidi;user=fixture;password=fixture;encrypt=true
      API_URL: http://127.0.0.1:4107/v1
      INTERNAL_API_URL: http://127.0.0.1:4107/v1
      NEXT_PUBLIC_WALLET_ENABLED: 'true'
      HIDI_PLAYWRIGHT_MODULE: /tmp/hidi-refinements-browser/node_modules/playwright/index.mjs
      PLAYWRIGHT_BROWSERS_PATH: /tmp/hidi-refinements-browsers
      HIDI_BROWSER_ENGINES: chromium,firefox,webkit
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: pnpm/action-setup@v4
        with: {version: 10.15.1}
      - uses: actions/setup-node@v4
        with: {node-version: 24, cache: pnpm}
      - run: pnpm install --frozen-lockfile && pnpm db:generate
      - name: All API and frontend/domain regressions must pass
        run: |
          set -euo pipefail
          python3 tests/storefront-refinements-release.test.py
          pnpm test:customer-experience
          git fetch origin 04447f465df48f3a9be5b6a5e2cde693dffa7823
          node --test $(find tests -maxdepth 1 -name '*.test.mjs' ! -name 'image-sku-runtime-keys.test.mjs' -print)
          pnpm --filter @hidi/api build
      - name: Production storefront build with retained public authentication configuration
        run: |
          set -euo pipefail
          export NEXT_PUBLIC_SUPABASE_URL="$(jq -r .SUPABASE_URL deploy/public-auth.json)"
          export NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY="$(jq -r .SUPABASE_PUBLISHABLE_KEY deploy/public-auth.json)"
          export NEXT_PUBLIC_CUSTOMER_AUTH_PROVIDER="$(jq -r '.CUSTOMER_AUTH_PROVIDER // .NEXT_PUBLIC_CUSTOMER_AUTH_PROVIDER // "hidi"' deploy/public-auth.json)"
          export NEXT_PUBLIC_CUSTOMER_OTP_CHANNEL=sms
          for key in API_KEY AUTH_DOMAIN PROJECT_ID APP_ID MESSAGING_SENDER_ID STORAGE_BUCKET; do
            value="$(jq -r --arg key "FIREBASE_$key" '.[$key] // ""' deploy/public-auth.json)"
            export "NEXT_PUBLIC_FIREBASE_$key=$value"
          done
          export NEXT_PUBLIC_API_URL=https://hidiindia.com/api/store
          pnpm --filter @hidi/web build
          node --test tests/image-sku-runtime-keys.test.mjs
      - name: Install three isolated browser engines
        run: |
          npm install --prefix /tmp/hidi-refinements-browser --no-save playwright@1.62.1
          node /tmp/hidi-refinements-browser/node_modules/playwright/cli.js install --with-deps chromium firefox webkit
      - name: Desktop and mobile commerce, approved changes, accessibility and failures
        run: node tests/editorial-storefront.browser.mjs
      - name: Retained admin login and workspace boundaries in three engines
        run: |
          set -euo pipefail
          for engine in chromium firefox webkit; do HIDI_BROWSER_ENGINE="$engine" node tests/admin-workspace.browser.mjs; done
      - name: Customer OTP resend, account and lifecycle regression in three engines
        run: node tests/auth-otp-resend.browser.mjs
      - name: Require the standard same-commit source and container builds to pass
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 deploy/storefront-refinements/source-gate.py
      - uses: azure/login@v2
        with:
          client-id: 3d62eb64-29dc-48ee-ab35-093312bd50af
          tenant-id: e756fdc0-2646-4e94-ac4d-ed7c11f87f34
          subscription-id: 91d9572d-0f0b-47fe-802d-0eef36d7c719
      - name: Fresh backup and compose exact additive candidates after every source test passes
        run: |
          set -euo pipefail
          python3 deploy/storefront-refinements/release.py capture
          export EXPECTED_API="$(python3 -c 'import json; print(json.load(open("evidence/storefront-refinements/before.json"))["hidi-api"]["image"])')"
          export EXPECTED_WEB="$(python3 -c 'import json; print(json.load(open("evidence/storefront-refinements/before.json"))["hidi-web"]["image"])')"
          az acr login --name acrhidiprod0927 --only-show-errors
          for app in api web; do
            key="EXPECTED_${app^^}"
            docker pull "${!key}"
            backup="acrhidiprod0927.azurecr.io/hidi-$app:backup-refinements-${GITHUB_RUN_ID}"
            docker tag "${!key}" "$backup"
            docker push "$backup"
            echo "$backup" > "evidence/storefront-refinements/$app-backup-tag.txt"
            candidate="acrhidiprod0927.azurecr.io/hidi-$app:refinements-${GITHUB_RUN_ID}"
            python3 deploy/storefront-refinements/release.py compose --app "$app" --image "$candidate"
            echo "CANDIDATE_${app^^}=$candidate" >> "$GITHUB_ENV"
          done
      - name: Exact compiled API, retained upload route, actual wrapper and three-engine desktop/mobile candidate checks
        run: node deploy/storefront-refinements/candidate.mjs
      - name: Publish only the exact tested immutable images
        run: |
          set -euo pipefail
          for app in api web; do
            key="CANDIDATE_${app^^}"
            docker push "${!key}"
            image="$(docker image inspect --format '{{index .RepoDigests 0}}' "${!key}")"
            echo "IMAGE_${app^^}=$image" >> "$GITHUB_ENV"
          done
      - name: Image-only rollout and hidiindia.com desktop/mobile verification inside automatic rollback
        run: python3 deploy/storefront-refinements/release.py apply --api "$IMAGE_API" --web "$IMAGE_WEB"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: storefront-refinements-guarded-release-${{ github.run_id }}
          path: |
            evidence/storefront-refinements
            test-results
          retention-days: 30
