name: Button states pre-change live backup
# This workflow only retains exact live images and public runtime source evidence.
on:
  push:
    branches: [migration/azure-sql-blob]
    paths: [.github/workflows/button-states-backup.yml]
permissions:
  contents: read
  id-token: write
concurrency:
  group: hidi-hero-guarded-release
  cancel-in-progress: false
jobs:
  backup:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: azure/login@v2
        with:
          client-id: 3d62eb64-29dc-48ee-ab35-093312bd50af
          tenant-id: e756fdc0-2646-4e94-ac4d-ed7c11f87f34
          subscription-id: 91d9572d-0f0b-47fe-802d-0eef36d7c719
      - name: Capture ready live applications privately
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import importlib.util,json,os,pathlib,re
          spec=importlib.util.spec_from_file_location('guard','deploy/privacy-policy/rollout.py')
          guard=importlib.util.module_from_spec(spec);spec.loader.exec_module(guard)
          guard.API_VERSION='2025-07-01'
          private=pathlib.Path(os.environ['RUNNER_TEMP'])/'hidi-button-states-backup-private'
          private.mkdir(mode=0o700);private.chmod(0o700)
          evidence=pathlib.Path('evidence/button-states-backup');evidence.mkdir(parents=True)
          expected={
            'hidi-web':'sha256:a3a6f00f669d1768ab582d209cedc0c8e8b4fb82a656b9a380e6e46cf175d801',
            'hidi-api':'sha256:063c3aee6a6c1c6300a3e5732ea40a2f94e18d947821b0ea8a608196ebf178c1',
          }
          states={}
          for name,digest in expected.items():
            data=guard.app(name);state=guard.snapshot(data);guard.ready(state)
            assert re.fullmatch(r'acrhidiprod0927\.azurecr\.io/'+name+r'@sha256:[0-9a-f]{64}',state['image']), 'Immutable image required: '+name
            assert state['image']=='acrhidiprod0927.azurecr.io/'+name+'@'+digest, 'Live image differs from reviewed pre-change release: '+name
            target=private/(name+'.json');target.write_text(json.dumps(data));target.chmod(0o600)
            states[name]=state
          (evidence/'before.json').write_text(json.dumps(states,indent=2))
          print('Ready API and web captured; full configuration is private and excluded from artifacts')
          PY
      - name: Retain and independently verify both exact image backups
        shell: bash
        run: |
          set -euo pipefail
          az acr login --name acrhidiprod0927 --only-show-errors
          python3 - <<'PY'
          import importlib.util,json,os,pathlib,subprocess
          spec=importlib.util.spec_from_file_location('guard','deploy/privacy-policy/rollout.py')
          guard=importlib.util.module_from_spec(spec);spec.loader.exec_module(guard)
          guard.API_VERSION='2025-07-01'
          evidence=pathlib.Path('evidence/button-states-backup')
          states=json.loads((evidence/'before.json').read_text());backups={}
          for name,state in states.items():
            assert guard.snapshot(guard.app(name))==state, 'Concurrent change before backup: '+name
            tag_name='backup-button-states-'+os.environ['GITHUB_RUN_ID']
            tag='acrhidiprod0927.azurecr.io/'+name+':'+tag_name
            for args in [('pull',state['image']),('tag',state['image'],tag),('push',tag)]:
              subprocess.run(['docker',*args],check=True)
            digest=subprocess.check_output(['az','acr','repository','show','--name','acrhidiprod0927','--image',name+':'+tag_name,'--query','digest','-o','tsv','--only-show-errors'],text=True).strip()
            assert digest==state['image'].split('@',1)[1], 'Backup digest differs from captured live image: '+name
            backups[name]={'image':state['image'],'backupTag':tag,'backupDigest':digest,'verified':True,'settingsHash':state['settingsHash'],'readyRevision':state['ready']}
          after={name:guard.snapshot(guard.app(name)) for name in states}
          assert after==states, 'Applications changed while retaining backups'
          report={'sourceSha':os.environ['GITHUB_SHA'],'runId':os.environ['GITHUB_RUN_ID'],'apps':backups,'applicationStatesUnchanged':True,'applicationWrites':False,'databaseWrites':False,'blobWrites':False}
          (evidence/'verified-backups.json').write_text(json.dumps(report,indent=2))
          print(json.dumps(report,indent=2))
          PY
      - name: Export public runtime sources and file integrity manifest
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib,json,os,pathlib,shutil,subprocess
          evidence=pathlib.Path('evidence/button-states-backup')
          states=json.loads((evidence/'before.json').read_text())
          root=pathlib.Path(os.environ['RUNNER_TEMP'])/'hidi-button-states-backup-private/web-app';root.mkdir()
          cid=subprocess.check_output(['docker','create',states['hidi-web']['image']],text=True).strip()
          try: subprocess.run(['docker','cp',cid+':/app/.',str(root)],check=True)
          finally: subprocess.run(['docker','rm',cid],check=True,stdout=subprocess.DEVNULL)
          manifest={}
          for source in root.rglob('*'):
            key=str(source.relative_to(root))
            if source.is_symlink():manifest[key]=['link',os.readlink(source)]
            elif source.is_file():manifest[key]=['file',hashlib.sha256(source.read_bytes()).hexdigest()]
          (evidence/'web-file-hashes.json').write_text(json.dumps(manifest,indent=2))
          public_files=['server.mjs','hero-media.mjs','dist/index.html']
          out=evidence/'runtime-source';out.mkdir()
          for name in public_files:
            source=root/name
            assert source.is_file() and not source.is_symlink(), 'Required public runtime file missing: '+name
            target=out/name;target.parent.mkdir(parents=True,exist_ok=True);shutil.copyfile(source,target)
          build_id=root/'apps/web/.next/BUILD_ID'
          report={'webImage':states['hidi-web']['image'],'files':len(manifest),'publicSourceFiles':public_files,'buildId':build_id.read_text().strip() if build_id.is_file() else None,'privateConfigurationExported':False,'mediaExported':False}
          (evidence/'source-summary.json').write_text(json.dumps(report,indent=2))
          print(json.dumps(report))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: button-states-prechange-backup-${{ github.run_id }}
          path: |
            evidence/button-states-backup/before.json
            evidence/button-states-backup/verified-backups.json
            evidence/button-states-backup/web-file-hashes.json
            evidence/button-states-backup/source-summary.json
            evidence/button-states-backup/runtime-source/server.mjs
            evidence/button-states-backup/runtime-source/hero-media.mjs
            evidence/button-states-backup/runtime-source/dist/index.html
          retention-days: 90
