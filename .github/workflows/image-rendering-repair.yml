name: Repaired web upload and site rendering
on:
  push:
    branches: [work/image-optimization-20261015]
    paths: ['.github/workflows/image-rendering-repair.yml']
permissions:
  contents: write
concurrency:
  group: hidi-upload-rendering-repair
  cancel-in-progress: false
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      DATABASE_URL: 'sqlserver://localhost:1433;database=hidi;user=build;password=build;encrypt=true'
      API_URL: http://127.0.0.1:4100/v1
      NEXT_PUBLIC_API_URL: /api/store
      NEXT_TELEMETRY_DISABLED: '1'
      PLAYWRIGHT_BROWSERS_PATH: ${{ github.workspace }}/.cache/upload-rendering-browsers
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.sha }}
      - uses: pnpm/action-setup@v4
        with:
          version: 10.15.1
      - uses: actions/setup-node@v4
        with:
          node-version: '22.16.0'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Apply exact fixture corrections and rebuild both browser hashing modules
        run: python deploy/image-optimization/prepare-rendering-repair.py
      - name: Record only reviewed fixture and browser-module changes on the candidate branch
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = refs/heads/work/image-optimization-20261015
          test "$(git ls-remote origin "$GITHUB_REF" | cut -f1)" = "$GITHUB_SHA"
          python - <<'PY'
          import json,subprocess
          files=json.load(open('rendering-repair-files.json'))
          for name in files:
            assert name.startswith('tests/') or name in ['deploy/image-optimization/full-regression.py','deploy/admin-tools/photo-digest.mjs','deploy/product-upload/photo-digest.mjs'], name
          assert not subprocess.check_output(['git','diff','--name-only','--','.github/']).strip(), 'No workflow mutation permitted'
          subprocess.run(['git','add','--',*files],check=True)
          PY
          if ! git diff --cached --quiet; then
            git -c user.name='HIDI test repairs' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m '[image-candidate] Correct current upload and approved storefront regression contracts'
            git push origin HEAD:refs/heads/work/image-optimization-20261015
          fi
      - name: Install three isolated browser engines
        run: |
          npm install --prefix "$RUNNER_TEMP/hidi-rendering" --no-audit --no-fund playwright@1.56.1
          echo "HIDI_PLAYWRIGHT_MODULE=$RUNNER_TEMP/hidi-rendering/node_modules/playwright/index.mjs" >> "$GITHUB_ENV"
          echo "HIDI_TEST_SHARP=$PWD/apps/web/node_modules/sharp" >> "$GITHUB_ENV"
          echo "HIDI_SHARP_MODULE=$PWD/apps/web/node_modules/sharp" >> "$GITHUB_ENV"
          node "$RUNNER_TEMP/hidi-rendering/node_modules/playwright/cli.js" install --with-deps chromium firefox webkit
      - name: Run complete builds, regression matrix and web-upload rendering integration
        run: python deploy/image-optimization/full-regression.py
      - name: Preserve all case results and screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: repaired-upload-rendering-evidence
          path: |
            reports/image-complete/
            test-results/
            rendering-repair-files.json
          retention-days: 14
      - name: Save auditable results without changing production
        if: always()
        run: |
          if test -f reports/image-complete/results.json; then
            git add -f reports/image-complete
            git -c user.name='HIDI test evidence' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m '[test-evidence] Repaired web upload and site rendering results'
            git push origin "HEAD:refs/heads/evidence/upload-rendering-$GITHUB_RUN_ID"
          fi
      - name: Keep unresolved gates visible
        if: always()
        run: |
          python - <<'PY'
          import json
          data=json.load(open('reports/image-complete/results.json'))
          assert all(s['status']=='PASS' for s in data['suites']), 'Some gates still need attention; see the preserved results.'
          PY
