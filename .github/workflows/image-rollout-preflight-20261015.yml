name: Image rollback backup and live delivery preflight
on:
  push:
    branches: [migration/azure-sql-blob]
    paths: ['.github/workflows/image-rollout-preflight-20261015.yml']
permissions:
  contents: read
concurrency:
  group: hidi-image-backup-preflight
  cancel-in-progress: false
jobs:
  azure-snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: azure/login@v2
        with:
          client-id: 3d62eb64-29dc-48ee-ab35-093312bd50af
          tenant-id: e756fdc0-2646-4e94-ac4d-ed7c11f87f34
          subscription-id: 91d9572d-0f0b-47fe-802d-0eef36d7c719
      - name: Capture rollback identities without secrets or live configuration changes
        run: |
          python - <<'PY'
          import json,subprocess,pathlib,datetime,os,re
          out=pathlib.Path('reports/image-preflight');out.mkdir(parents=True,exist_ok=True)
          report={'capturedAt':datetime.datetime.now(datetime.timezone.utc).isoformat(),'runId':os.environ['GITHUB_RUN_ID'],'productionChanged':False,'databaseChanged':False,'apps':{},'errors':[],'backupScope':'Source branch references and live revision/container digests. Not a database or Blob copy.'}
          def az(*args):
            p=subprocess.run(['az',*args,'--only-show-errors','-o','json'],capture_output=True,text=True,timeout=90)
            if p.returncode:raise RuntimeError('Azure read failed: '+args[0]+' '+args[1])
            return json.loads(p.stdout)
          for app in ['hidi-web','hidi-api']:
            try:
              config=az('containerapp','show','-g','rg-hidi-prod','-n',app,'--query','{name:name,mode:properties.configuration.activeRevisionsMode,latest:properties.latestRevisionName,ready:properties.latestReadyRevisionName,traffic:properties.configuration.ingress.traffic,fqdn:properties.configuration.ingress.fqdn,containers:properties.template.containers[].{name:name,image:image,resources:resources},scale:properties.template.scale,secretReferences:properties.configuration.secrets[].name}')
              revisions=az('containerapp','revision','list','-g','rg-hidi-prod','-n',app,'--query','[].{name:name,active:properties.active,health:properties.healthState,running:properties.runningState,trafficWeight:properties.trafficWeight,created:properties.createdTime,containers:properties.template.containers[].{name:name,image:image,resources:resources}}')
              config['revisions']=revisions;report['apps'][app]=config
              images=set(c['image'] for c in config.get('containers',[]))
              for r in revisions:
                if r.get('active'):images.update(c['image'] for c in r.get('containers',[]))
              config['registryDigests']=[]
              for image in images:
                if not image.startswith('acrhidiprod0927.azurecr.io/'):continue
                ref=image.split('/',1)[1]
                try:
                  detail=az('acr','repository','show','--name','acrhidiprod0927','--image',ref,'--query','{digest:digest,tags:tags,created:createdTime,updated:lastUpdateTime,attributes:changeableAttributes}')
                  config['registryDigests'].append({'image':image,**detail})
                except Exception as e:report['errors'].append({'scope':app+' registry digest','message':str(e)})
            except Exception as e:report['errors'].append({'scope':app,'message':str(e)})
          try:
            servers=az('sql','server','list','-g','rg-hidi-prod','--query','[].name')
            report['databaseRecoveryMetadata']=[]
            for server in servers:
              rows=az('sql','db','list','-g','rg-hidi-prod','-s',server,'--query','[].{name:name,status:status,earliestRestoreDate:earliestRestoreDate,currentBackupStorageRedundancy:currentBackupStorageRedundancy}')
              report['databaseRecoveryMetadata'].append({'server':server,'databases':rows})
          except Exception as e:report['errors'].append({'scope':'SQL recovery metadata','message':str(e)})
          report['liveRevisionSnapshotComplete']=len(report['apps'])==2 and all(x.get('ready') and x.get('registryDigests') for x in report['apps'].values())
          (out/'azure-rollback-snapshot.json').write_text(json.dumps(report,indent=2))
          print(json.dumps(report,indent=2))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: image-azure-rollback-snapshot
          path: reports/image-preflight/
          retention-days: 30
  measure-public-images:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: f2f857e517b06a01cbdecf7cbbb5f41783022c1c
      - uses: actions/setup-node@v4
        with:
          node-version: '22.16.0'
      - name: Install isolated browser and image measurement tools
        run: |
          npm install --prefix "$RUNNER_TEMP/image-measure" --no-audit --no-fund playwright@1.56.1 sharp@0.34.1
          node "$RUNNER_TEMP/image-measure/node_modules/playwright/cli.js" install --with-deps chromium
          echo "IMAGE_TOOLS=$RUNNER_TEMP/image-measure/node_modules" >> "$GITHUB_ENV"
      - name: Measure actual browser-selected image responses; public reads only
        run: |
          node --input-type=module <<'NODE'
          import {createRequire} from 'node:module';
          import {mkdir,writeFile,mkdtemp,rm} from 'node:fs/promises';
          import {tmpdir} from 'node:os';
          import {join} from 'node:path';
          import {pathToFileURL} from 'node:url';
          import {createImageStore,mediaPath} from './deploy/collection-speed/images.mjs';
          const tools=process.env.IMAGE_TOOLS,require=createRequire(tools+'/playwright/package.json');
          const {chromium}=await import(pathToFileURL(tools+'/playwright/index.mjs').href),sharp=require(tools+'/sharp');
          const out='reports/image-preflight';await mkdir(out,{recursive:true});
          const report={capturedAt:new Date().toISOString(),runId:process.env.GITHUB_RUN_ID,productionChanged:false,scope:'Live browser measurements before deployment; candidate transforms separately labelled',candidate:'f2f857e517b06a01cbdecf7cbbb5f41783022c1c',pages:[],candidateSamples:[],errors:[]};
          const hosts=new Set(['hidiindia.com','www.hidiindia.com','thehidi.com','www.thehidi.com']);
          const browser=await chromium.launch({headless:true});let productPath;
          try{
            for(const device of [{name:'mobile-390-dpr3',width:390,height:844,dpr:3,mobile:true},{name:'laptop-1440-dpr1',width:1440,height:900,dpr:1,mobile:false},{name:'laptop-retina-1440-dpr2',width:1440,height:900,dpr:2,mobile:false}]){
              const context=await browser.newContext({viewport:{width:device.width,height:device.height},deviceScaleFactor:device.dpr,isMobile:device.mobile,hasTouch:device.mobile,reducedMotion:'reduce'});
              await context.route('**/*',route=>{
                const req=route.request();let u;try{u=new URL(req.url());}catch{return route.abort();}
                if(!hosts.has(u.hostname)||!['GET','HEAD'].includes(req.method())||u.pathname.startsWith('/api/admin')||['media','websocket'].includes(req.resourceType()))return route.abort();
                return route.continue();
              });
              for(const path of ['/', '/collections/all','PRODUCT']){
                if(path==='PRODUCT'&&!productPath)continue;
                const target=path==='PRODUCT'?productPath:path,page=await context.newPage();const replies=[];
                page.on('response',r=>{if(r.request().resourceType()==='image')replies.push(r);});
                const record={device:device.name,viewport:device.width,dpr:device.dpr,path:target,images:[]};report.pages.push(record);
                try{
                  const response=await page.goto('https://hidiindia.com'+target,{waitUntil:'domcontentloaded',timeout:45000});record.status=response?.status();
                  await page.waitForTimeout(2200);
                  if(!productPath){const links=await page.locator('a[href^="/products/"]').evaluateAll(xs=>xs.map(x=>x.getAttribute('href')));productPath=links.find(x=>/^\/products\/[a-z0-9-]+$/.test(x));}
                  record.images=await page.locator('img').evaluateAll(imgs=>imgs.filter(i=>i.currentSrc&&!i.currentSrc.startsWith('data:')).map(i=>{const r=i.getBoundingClientRect();return {alt:i.alt,src:i.getAttribute('src'),currentSrc:i.currentSrc,sizes:i.sizes,naturalWidth:i.naturalWidth,naturalHeight:i.naturalHeight,renderedWidth:r.width,renderedHeight:r.height,visible:r.bottom>0&&r.top<innerHeight&&r.right>0&&r.left<innerWidth,loading:i.loading,complete:i.complete};}));
                  const measured=new Map();
                  for(const r of replies){try{await r.finished();const headers=await r.allHeaders(),sizes=await r.request().sizes();measured.set(r.url(),{status:r.status(),contentType:headers['content-type'],bodyBytes:sizes.responseBodySize,headerBytes:sizes.responseHeadersSize,declaredBytes:headers['content-length']?Number(headers['content-length']):null,cacheControl:headers['cache-control'],optimizerVersion:headers['x-hidi-image-version']||null});}catch{}}
                  for(const image of record.images)image.response=measured.get(image.currentSrc)||null;
                  record.overflow=await page.evaluate(()=>document.documentElement.scrollWidth>innerWidth+1);
                  await page.screenshot({path:out+'/'+device.name+'-'+(path==='/'?'home':path==='PRODUCT'?'product':'collection')+'.png'});
                }catch(e){record.error=String(e.message);report.errors.push(device.name+' '+target+': '+String(e.message));}
                await page.close();await writeFile(out+'/image-delivery-measurements.json',JSON.stringify(report,null,2));
              }
              await context.close();
            }
          }finally{await browser.close();}
          // Compare the same public product photograph through the candidate processor
          // without modifying Blob, SQL, active containers or catalogue metadata.
          const sources=[];
          for(const p of report.pages){for(const image of p.images||[]){try{const u=new URL(image.currentSrc);const s=mediaPath(u.pathname==='/_next/image'?u.searchParams.get('url'):image.currentSrc);if(s&&!sources.includes(s))sources.push(s);}catch{}}}
          const cacheDir=await mkdtemp(join(tmpdir(),'hidi-preflight-'));
          try{
            let sourceBytes=0;const store=createImageStore({sharp,cacheDir,seedDir:join(cacheDir,'none'),fetchSource:async source=>{
              const response=await fetch('https://hidiindia.com'+source,{redirect:'error',signal:AbortSignal.timeout(60000)});
              if(!response.ok)throw Error('Original public photo returned '+response.status);
              const chunks=[];let n=0;for await(const chunk of response.body){n+=chunk.length;if(n>120*1024*1024)throw Error('Measurement source exceeds audit-only 120 MiB budget');chunks.push(chunk);}sourceBytes=n;return Buffer.concat(chunks,n);
            }});
            for(const source of sources.slice(0,2)){
              const item={source,scope:'Candidate transform of real public photograph; NOT live deployed output',outputs:[]};report.candidateSamples.push(item);
              try{for(const width of [384,640,828,1080,1200,1920,3840]){const t=Date.now(),result=await store.get({source,width,format:'webp',quality:75});const meta=await sharp(result.bytes).metadata();item.originalBytes=sourceBytes;item.outputs.push({requestedWidth:width,width:meta.width,height:meta.height,bytes:result.bytes.length,milliseconds:Date.now()-t,format:meta.format});}}catch(e){item.error=String(e.message);}
            }
          }finally{await rm(cacheDir,{recursive:true,force:true});}
          await writeFile(out+'/image-delivery-measurements.json',JSON.stringify(report,null,2));
          const lines=['# HIDI live image delivery preflight','', 'No deployment or production data changes. Live measurements and candidate transforms are separate.','', '| Device | Page | Visible product image | Bytes transferred | Chosen pixel width |','|---|---|---|---:|---:|'];
          for(const p of report.pages)for(const i of p.images||[]){if(!i.visible||!i.currentSrc.includes('products'))continue;let w='';try{w=new URL(i.currentSrc).searchParams.get('w')||i.naturalWidth;}catch{}lines.push('| '+[p.device,p.path,(i.alt||'Product photograph').replace(/\|/g,'/'),i.response?.bodyBytes??'Not captured',w].join(' | ')+' |');}
          lines.push('','## Candidate transform sizes','');
          for(const s of report.candidateSamples){lines.push('Source: '+s.source,'Original bytes: '+s.originalBytes,'','| Width | WebP bytes |','|---|---:|');for(const x of s.outputs)lines.push('| '+x.width+' | '+x.bytes+' |');if(s.error)lines.push('Error: '+s.error);}
          await writeFile(out+'/IMAGE-SIZES.md',lines.join('\n')+'\n');console.log(lines.join('\n'));
          NODE
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: image-live-delivery-measurements
          path: reports/image-preflight/
          retention-days: 30
