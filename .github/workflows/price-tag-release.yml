name: 50 mm square price tag guarded release
on:
  push:
    branches: [migration/azure-sql-blob]
    paths: [deploy/price-tag/**, .github/workflows/price-tag-release.yml]
permissions:
  contents: read
  id-token: write
concurrency:
  group: hidi-hero-guarded-release
  cancel-in-progress: false
  queue: max
jobs:
  verify-and-release:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      HIDI_PLAYWRIGHT_MODULE: /tmp/hidi-tag-browser/node_modules/playwright/index.mjs
      PLAYWRIGHT_BROWSERS_PATH: /tmp/hidi-tag-browsers
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-node@v4
        with: {node-version: 24}
      - name: Check release syntax
        run: python3 -m py_compile deploy/price-tag/patch.py deploy/price-tag/release.py
      - name: Install exact-manifest backup tools and three browsers
        run: |
          sudo apt-get update -qq && sudo apt-get install -y skopeo
          npm install --prefix /tmp/hidi-tag-browser --no-save playwright@1.62.1
          node /tmp/hidi-tag-browser/node_modules/playwright/cli.js install --with-deps chromium firefox webkit
      - uses: azure/login@v2
        with:
          client-id: 3d62eb64-29dc-48ee-ab35-093312bd50af
          tenant-id: e756fdc0-2646-4e94-ac4d-ed7c11f87f34
          subscription-id: 91d9572d-0f0b-47fe-802d-0eef36d7c719
      - name: Back up the current image and compose the bounded web overlay
        run: |
          az acr login --name acrhidiprod0927 --only-show-errors
          python3 deploy/price-tag/release.py capture
          python3 deploy/price-tag/release.py compose
          echo "HIDI_CANDIDATE_RUNTIME=$RUNNER_TEMP/hidi-price-tag-private/web/candidate-app" >> "$GITHUB_ENV"
      - name: Test actual candidate in Chromium, Firefox and Safari engines
        run: |
          node deploy/price-tag/candidate.mjs
          python3 deploy/price-tag/release.py seal
      - name: Publish the tested immutable image
        run: python3 deploy/price-tag/release.py publish
      - uses: azure/login@v2
        with:
          client-id: 3d62eb64-29dc-48ee-ab35-093312bd50af
          tenant-id: e756fdc0-2646-4e94-ac4d-ed7c11f87f34
          subscription-id: 91d9572d-0f0b-47fe-802d-0eef36d7c719
      - name: Deploy and run live regressions with owned rollback
        id: apply
        timeout-minutes: 25
        run: timeout --signal=TERM --kill-after=10m 20m python3 deploy/price-tag/release.py apply
      - name: Recover an interrupted owned rollout
        if: always() && env.WEB_IMAGE != '' && steps.apply.outcome != 'success'
        timeout-minutes: 15
        run: python3 deploy/price-tag/release.py recover
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: price-tag-release-${{ github.run_id }}-${{ github.run_attempt }}
          path: evidence/price-tag-release
          retention-days: 30
