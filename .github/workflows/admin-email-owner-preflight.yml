name: Admin email eligibility read-only preflight
on:
  push:
    branches: [migration/azure-sql-blob]
    paths:
      - .github/workflows/admin-email-owner-preflight.yml
      - deploy/admin-email-auth/owner-preflight.*
permissions:
  contents: read
  id-token: write
concurrency:
  group: hidi-hero-guarded-release
  cancel-in-progress: false
jobs:
  owner-preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: azure/login@v2
        with:
          client-id: 3d62eb64-29dc-48ee-ab35-093312bd50af
          tenant-id: e756fdc0-2646-4e94-ac4d-ed7c11f87f34
          subscription-id: 91d9572d-0f0b-47fe-802d-0eef36d7c719
      - name: Verify existing active Owner without modifying staff
        run: python3 deploy/admin-email-auth/owner-preflight.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: admin-email-owner-preflight-${{ github.run_id }}
          path: evidence/admin-email-auth/owner-preflight.json
          retention-days: 30
