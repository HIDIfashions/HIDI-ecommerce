name: Validate and release recovered admin product editor
on:
  push:
    branches: [test/admin-release-20261025, migration/azure-sql-blob]
    paths:
      - 'deploy/admin-product-editor/**'
      - 'deploy/admin-product-editor/patch-runtime.py'
      - 'deploy/admin-tools/product-page*'
      - 'tests/product-page-*'
      - '.github/workflows/admin-product-editor-release.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      DATABASE_URL: sqlserver://localhost:1433;database=fixture;user=fixture;password=fixture;encrypt=true
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: {version: 10.15.1}
      - uses: actions/setup-node@v4
        with: {node-version: 24, cache: pnpm}
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @hidi/api build
      - run: pnpm --filter @hidi/api test:customer-experience
      - name: Test editor, uploader, dashboard and release recovery
        run: |
          node --test tests/*.test.cjs apps/web/lib/product-sharing.test.mjs tests/product-page-editor.test.mjs tests/admin-product-bulk.test.mjs tests/admin-quick-tools.test.mjs
          python3 tests/product-page-overlay.test.py
          python3 deploy/admin-product-editor/test_release.py
      - name: Install isolated browsers
        run: |
          npm install --prefix "$RUNNER_TEMP/editor-browser" --no-save playwright@1.62.1
          node "$RUNNER_TEMP/editor-browser/node_modules/playwright/cli.js" install --with-deps chromium firefox webkit
          echo "NODE_PATH=$RUNNER_TEMP/editor-browser/node_modules" >> "$GITHUB_ENV"
          echo "HIDI_PLAYWRIGHT_MODULE=$RUNNER_TEMP/editor-browser/node_modules/playwright/index.mjs" >> "$GITHUB_ENV"
      - name: Exercise desktop, phone and tablet editor and staff permissions
        env:
          HIDI_EDITOR_ENGINES: chromium,firefox,webkit
        run: |
          node tests/product-page-editor.browser.mjs
          node deploy/support-staff/candidate.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: admin-editor-validation-${{ github.sha }}
          path: |
            evidence/product-page
            evidence/support-staff
  release:
    # Keep push validation; deploy editor/role changes together through the
    # migration-aware product-details-multirole workflow.
    if: github.ref == 'refs/heads/migration/azure-sql-blob' && github.event_name == 'workflow_dispatch'
    needs: validate
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
      id-token: write
      actions: read
    concurrency:
      group: hidi-hero-guarded-release
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-node@v4
        with: {node-version: 24}
      - name: Require successful delivery automation release first
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api 'repos/HIDIfashions/HIDI-ecommerce/actions/workflows/delivery-sync-release.yml/runs?per_page=1' > "$RUNNER_TEMP/delivery-run.json"
          python3 -c 'import json,os; r=json.load(open(os.environ["RUNNER_TEMP"]+"/delivery-run.json"))["workflow_runs"][0]; assert r["status"]=="completed" and r["conclusion"]=="success", "Latest delivery release must finish successfully first"; print("Delivery release prerequisite passed:",r["html_url"])'
      - name: Install isolated candidate browsers
        run: |
          npm install --prefix "$RUNNER_TEMP/editor-browser" --no-save playwright@1.62.1
          node "$RUNNER_TEMP/editor-browser/node_modules/playwright/cli.js" install --with-deps chromium firefox webkit
          echo "NODE_PATH=$RUNNER_TEMP/editor-browser/node_modules" >> "$GITHUB_ENV"
          echo "HIDI_PLAYWRIGHT_MODULE=$RUNNER_TEMP/editor-browser/node_modules/playwright/index.mjs" >> "$GITHUB_ENV"
      - uses: azure/login@v2
        with:
          client-id: 3d62eb64-29dc-48ee-ab35-093312bd50af
          tenant-id: e756fdc0-2646-4e94-ac4d-ed7c11f87f34
          subscription-id: 91d9572d-0f0b-47fe-802d-0eef36d7c719
      - name: Capture production after delivery release and back up exact web image
        run: |
          az acr login --name acrhidiprod0927 --only-show-errors
          python3 deploy/admin-product-editor/release.py capture
      - name: Compose additive editor and verify preserved runtime
        run: python3 deploy/admin-product-editor/release.py compose
      - name: Test exact candidate assets and wrapper before publication
        run: |
          python3 deploy/admin-product-editor/release.py seal
          python3 deploy/admin-product-editor/release.py publish
      - name: Deploy tested image and verify production
        id: apply
        timeout-minutes: 15
        run: timeout --signal=TERM --kill-after=3m 12m python3 deploy/admin-product-editor/release.py apply --image "$WEB_IMAGE"
      - name: Recover interrupted owned deployment
        if: always() && env.WEB_IMAGE != '' && steps.apply.outcome != 'success'
        timeout-minutes: 12
        run: python3 deploy/admin-product-editor/release.py recover --image "$WEB_IMAGE"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: admin-editor-release-${{ github.run_id }}-${{ github.run_attempt }}
          path: evidence/product-page
          retention-days: 30
