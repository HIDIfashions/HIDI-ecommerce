name: Verify known uploaded originals without changing production
on:
  push:
    branches: [migration/azure-sql-blob]
    paths: [.github/workflows/immutable-image-live-storage-discovery.yml]
permissions:
  contents: read
  actions: read
  id-token: write
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      GH_TOKEN: ${{ github.token }}
      PYTHONUNBUFFERED: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/checkout@v4
        with:
          ref: 5f756d31cdbb2203ddc1ad8107b4f6fae7b6259f
          path: candidate-source
      - name: Authenticate exact successful rollback evidence
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" https://api.github.com/repos/HIDIfashions/HIDI-ecommerce/actions/artifacts/12484688548/zip -o "$RUNNER_TEMP/live.zip"
          echo "6695dee8a03e05dc73325f8751808a56354158a86bd7b42dd3b2a5c52eac3b10  $RUNNER_TEMP/live.zip" | sha256sum --check
          mkdir -p candidate-source/evidence/photo-live
          unzip -q "$RUNNER_TEMP/live.zip" -d candidate-source/evidence/photo-live
      - name: Test resource addressing and fail-closed cleanup
        run: python deploy/image-promotion/test_immutable_promotion.py
      - uses: azure/login@v2
        with:
          client-id: 3d62eb64-29dc-48ee-ab35-093312bd50af
          tenant-id: e756fdc0-2646-4e94-ac4d-ed7c11f87f34
          subscription-id: 91d9572d-0f0b-47fe-802d-0eef36d7c719
      - name: Read only exact recent originals and verify all persistent derivatives
        working-directory: candidate-source
        run: |
          python - <<'PY'
          import json,sys
          from pathlib import Path
          sys.path.insert(0,str(Path('../deploy/image-promotion').resolve()))
          import inspect_uploaded_photos as check
          Path('evidence/photo-live/discovery-probe.mjs').write_text(check.PROBE)
          import subprocess
          subprocess.run(['node','--check','evidence/photo-live/discovery-probe.mjs'],check=True)
          photos=[
          {'key':'products/variants/cmv9owalu00s701evyyeenjza/batch-36a94546e8bc48e876c48d78b162196e1ae20a8efa46fd89566829bf7eee5ddc.jpg','bytes':10004869,'sha256':'36a94546e8bc48e876c48d78b162196e1ae20a8efa46fd89566829bf7eee5ddc'},
          {'key':'products/variants/cmv9owalu00s701evyyeenjza/batch-824a87c8402d5cad8426905948cb85eb42d0af61bdc8240624a903452868fcc9.jpg','bytes':24284792,'sha256':'824a87c8402d5cad8426905948cb85eb42d0af61bdc8240624a903452868fcc9'}
          ]
          path=check.load_release().P/'discovery-input.json';path.write_text(json.dumps(photos));path.chmod(0o600)
          sys.argv=['inspect_uploaded_photos.py',str(path)]
          release=check.load_release()
          rollback=release.read('promotion-rollback.json')
          assert rollback['passed'] and rollback['webStatus']=='restored' and rollback['apiUnchanged'] and rollback['webSettingsUnchangedFromCapture'] and rollback['publicSnapshotRestored']
          states=release.read('before.json')
          assert rollback['state']['image']==states['hidi-web']['image'] and rollback['state']['settingsHash']==states['hidi-web']['settingsHash']
          assert rollback['state']['ready']==rollback['state']['latest']=='hidi-web--rangefiverb39913626973a1'
          states['hidi-web']=rollback['state']
          check.main(storage_only_states=states)
          PY
      - name: Preserve bounded storage verification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: immutable-image-live-storage-discovery
          path: candidate-source/evidence/photo-live/uploaded-photo-storage.json
          retention-days: 30
