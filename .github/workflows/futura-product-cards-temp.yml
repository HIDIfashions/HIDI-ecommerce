name: Futura Product Cards Validation

on:
  push:
    branches:
      - feature/futura-product-cards

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/hidi_ci
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.15.1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm db:generate
      - name: Customer experience tests
        run: pnpm test:customer-experience
      - name: Web type-check
        run: pnpm --filter @hidi/web exec tsc --noEmit
      - name: Web production build
        run: pnpm --filter @hidi/web build
