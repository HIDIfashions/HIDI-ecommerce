name: Button theme only guarded revert
# Restore the exact pretheme image only after proving its four-file inverse.
# Existing compiled storefront, API, product deletion, media cleanup and tabs stay intact.
on:
  push:
    branches: [migration/azure-sql-blob]
    paths: [.github/workflows/button-states-revert.yml]
permissions:
  contents: read
  id-token: write
concurrency:
  group: hidi-hero-guarded-release
  cancel-in-progress: false
jobs:
  regression-and-revert:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      DATABASE_URL: sqlserver://localhost:1433;database=hidi;user=fixture;password=fixture;encrypt=true
      PLAYWRIGHT_BROWSERS_PATH: /tmp/hidi-button-revert-browsers
      HIDI_PLAYWRIGHT_MODULE: /tmp/hidi-button-revert-browser/node_modules/playwright/index.mjs
      HIDI_BROWSER_ENGINES: chromium,firefox,webkit
      HIDI_BUTTON_OUTPUT: evidence/button-states-revert/candidate
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: pnpm/action-setup@v4
        with: {version: 10.15.1}
      - uses: actions/setup-node@v4
        with: {node-version: 24, cache: pnpm}
      - name: Install retained regression dependencies
        run: pnpm install --frozen-lockfile && pnpm db:generate
      - name: Verify retained source, Admin deletion and guarded revert failure boundaries
        run: |
          set -euo pipefail
          python3 deploy/button-states/revert.py verify-source
          pnpm --filter @hidi/api test:customer-experience
          node --test tests/*.test.cjs apps/web/lib/product-sharing.test.mjs
          node --test tests/admin-quick-tools.test.mjs tests/admin-product-bulk.test.mjs tests/admin-product-delete-handler.test.mjs tests/button-request-policy.test.mjs
          python3 tests/button-states-revert.test.py
      - name: Build restored source for regression only
        env:
          API_URL: http://127.0.0.1:4107/v1
          INTERNAL_API_URL: http://127.0.0.1:4107/v1
          NEXT_TELEMETRY_DISABLED: 1
        run: pnpm --filter @hidi/web build
      - name: Install three browser engines
        run: |
          set -euo pipefail
          npm install --prefix /tmp/hidi-button-revert-browser --no-save playwright@1.56.1
          node /tmp/hidi-button-revert-browser/node_modules/playwright/cli.js install --with-deps chromium firefox webkit
      - uses: azure/login@v2
        with:
          client-id: 3d62eb64-29dc-48ee-ab35-093312bd50af
          tenant-id: e756fdc0-2646-4e94-ac4d-ed7c11f87f34
          subscription-id: 91d9572d-0f0b-47fe-802d-0eef36d7c719
      - name: Capture fresh ready images and verify the exact owned theme and pretheme revision
        run: python3 deploy/button-states/revert.py capture
      - name: Back up both live images and verify only the exact four theme files differ
        run: |
          set -euo pipefail
          az acr login --name acrhidiprod0927 --only-show-errors
          python3 deploy/button-states/revert.py backup
          python3 deploy/button-states/revert.py prepare
      - name: Test actual original image in all browsers and preserved Admin features
        env:
          HIDI_CANDIDATE_RUNTIME: ${{ runner.temp }}/hidi-button-states-revert-private/web/target-app
        run: |
          set -euo pipefail
          node deploy/button-states/revert-candidate.mjs
          node tests/admin-quick-tools.runtime.mjs
          node tests/admin-product-delete.browser.mjs
          node tests/admin-navigation.browser.mjs
          python3 deploy/button-states/revert.py mark-tested
      - name: Revert only web image and verify live functionality with owned-image recovery
        run: python3 deploy/button-states/revert.py apply
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: button-theme-only-revert-${{ github.run_id }}
          path: |
            evidence/button-states-revert
            test-results/admin-product-delete
            test-results/admin-navigation
          retention-days: 30
