name: Typography settings release
on:
  push:
    branches: [migration/azure-sql-blob]
    paths: [deploy/typography/**, .github/workflows/typography-release.yml]
  workflow_dispatch:
permissions:
  contents: read
  id-token: write
concurrency:
  group: hidi-hero-guarded-release
  cancel-in-progress: false
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: azure/login@v2
        with:
          client-id: 3d62eb64-29dc-48ee-ab35-093312bd50af
          tenant-id: e756fdc0-2646-4e94-ac4d-ed7c11f87f34
          subscription-id: 91d9572d-0f0b-47fe-802d-0eef36d7c719
      - name: Inspect current retained runtime without deployment
        run: |
          az acr login --name acrhidiprod0927 --only-show-errors
          image=$(az containerapp show -g rg-hidi-prod -n hidi-web --query 'properties.template.containers[0].image' -o tsv)
          docker pull "$image"
          id=$(docker create "$image")
          mkdir -p evidence/typography/runtime
          docker cp "$id:/app/server.mjs" evidence/typography/runtime/server.mjs
          docker cp "$id:/app/admin-tools/navigation.js" evidence/typography/runtime/navigation.js
          docker rm "$id"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: typography-runtime
          path: evidence/typography/runtime
          retention-days: 7
