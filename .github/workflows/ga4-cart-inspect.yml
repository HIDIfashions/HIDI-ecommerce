name: Inspect HIDI add-to-cart analytics without shopping writes
on:
  push:
    branches: [migration/azure-sql-blob]
    paths: [.github/workflows/ga4-cart-inspect.yml]
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/setup-node@v4
        with: {node-version: 24}
      - run: |
          npm install --prefix /tmp/hidi-ga4-audit --no-save playwright@1.56.1
          node /tmp/hidi-ga4-audit/node_modules/playwright/cli.js install --with-deps chromium
      - name: Inspect live source and reproduce button-state race in isolated browser
        run: |
          node --input-type=module <<'JS'
          import assert from 'node:assert/strict';
          import {createHash} from 'node:crypto';
          import {chromium} from '/tmp/hidi-ga4-audit/node_modules/playwright/index.mjs';
          const response=await fetch('https://hidiindia.com/hidi-analytics.js');
          assert(response.ok);const source=await response.text();
          console.log('LIVE_ANALYTICS_SHA256',createHash('sha256').update(source).digest('hex'));
          console.log('LIVE_HANDLER',source.slice(source.indexOf('function trackClicks'),source.indexOf('function trackPurchaseWhenReady')));
          const browser=await chromium.launch();
          try {
            const page=await browser.newPage();
            await page.route('**/*',r=>r.fulfill({status:200,contentType:'application/javascript',body:''}));
            await page.setContent('<button id="add">Add to Cart</button>');
            await page.evaluate(()=>{
              window.__events=[];
              window.gtag=(...args)=>window.__events.push(args);
              window.fetch=async()=>new Response(JSON.stringify({enabled:true,ga4MeasurementId:'G-Z45WSHLDHG'}),{status:200,headers:{'content-type':'application/json'}});
              document.querySelector('#add').addEventListener('click',e=>{e.target.disabled=true;e.target.textContent='Adding…';});
            });
            await page.addScriptTag({content:source});
            await page.waitForTimeout(200);
            await page.click('#add');
            await page.waitForTimeout(100);
            const events=await page.evaluate(()=>window.__events.filter(e=>e[0]==='event').map(e=>e[1]));
            console.log('BASELINE_REPRODUCTION',JSON.stringify({events,addToCartRecorded:events.includes('add_to_cart'),liveCartWrites:0}));
            assert(!events.includes('add_to_cart'),'The hypothesized race is not reproduced');
          } finally {await browser.close();}
          JS
