name: Photo live package and recovery verification
on:
  push:
    branches: [migration/azure-sql-blob]
    paths: [.github/workflows/photo-live-package-check.yml]
permissions:
  contents: read
  id-token: write
concurrency:
  group: hidi-photo-release
  cancel-in-progress: false
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22.16.0'}
      - name: Install existing exact-manifest recovery tooling
        run: sudo apt-get update -qq && sudo apt-get install -y skopeo
      - uses: azure/login@v2
        with:
          client-id: 3d62eb64-29dc-48ee-ab35-093312bd50af
          tenant-id: e756fdc0-2646-4e94-ac4d-ed7c11f87f34
          subscription-id: 91d9572d-0f0b-47fe-802d-0eef36d7c719
      - name: Capture live package and verify recovery with the established release guard
        run: |
          az acr login --name acrhidiprod0927 --only-show-errors
          python - <<'PY'
          import importlib.util,pathlib,json,hashlib,re,os
          p=pathlib.Path('deploy/checkout-offers/release.py')
          spec=importlib.util.spec_from_file_location('photo_recovery',p);r=importlib.util.module_from_spec(spec);spec.loader.exec_module(r)
          r.tag=lambda app,backup=False:r.images.REGISTRY+'/hidi-'+app+(':backup-photo-stream-' if backup else ':photo-stream-')+r.guard.run_key()
          r.capture()
          r.backups()
          report={'sourceSha':os.environ['GITHUB_SHA'],'productionDeployment':False,'databaseWrites':False,'blobWrites':False,'verifiedApplicationBackups':True,'apps':{},'backupFiles':{app:r.read(app+'-backup.json') for app in ['api','web']}}
          for app in ['api','web']:
            base=r.P/('inspect-'+app);r.images.extract(r.photo.states()['hidi-'+app]['image'],base)
            record={'image':r.photo.states()['hidi-'+app]['image'],'files':[],'limitOccurrences':[],'wrapperFiles':{}}
            for f in base.rglob('*'):
              if not f.is_file() or f.is_symlink():continue
              name=f.relative_to(base).as_posix()
              if 'node_modules/' in name:continue
              if f.suffix not in ['.js','.mjs','.json','.html']:continue
              if name.count('/')<3:record['files'].append(name)
              if f.stat().st_size>8000000:continue
              text=f.read_text(errors='replace')
              hits=list(re.finditer(r'12\s*\*\s*1024\s*\*\s*1024|12582912|12 MB|photo-upload|createProductImageHandler',text))
              for m in hits[:6]:record['limitOccurrences'].append({'file':name,'excerpt':text[max(0,m.start()-100):m.end()+180]})
              if name in ['server.mjs','server.js','runtime.mjs','package.json','apps/api/dist/admin/admin-inventory.service.js','product-images/images.mjs']:
                record['wrapperFiles'][name]={'sha256':hashlib.sha256(f.read_bytes()).hexdigest(),'text':text if len(text)<35000 else text[:35000]}
            report['apps'][app]=record
          r.save('photo-package-inventory.json',report)
          print(json.dumps(report,indent=2))
          PY
      - name: Preserve verification evidence only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: photo-live-package-verification
          path: evidence/checkout-offers/
          retention-days: 30
