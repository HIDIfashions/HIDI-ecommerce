name: WhatsApp order notification read-only readiness
on:
  push:
    branches: [migration/azure-sql-blob]
    paths:
      - .github/workflows/order-notification-readiness.yml
      - deploy/order-notifications/readiness.*
permissions:
  contents: read
  id-token: write
concurrency:
  group: hidi-hero-guarded-release
  cancel-in-progress: false
jobs:
  readiness:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: azure/login@v2
        with:
          client-id: 3d62eb64-29dc-48ee-ab35-093312bd50af
          tenant-id: e756fdc0-2646-4e94-ac4d-ed7c11f87f34
          subscription-id: 91d9572d-0f0b-47fe-802d-0eef36d7c719
      - name: Install official private console extension
        run: az extension add --name containerapp --upgrade --only-show-errors
      - name: Inspect notification module, queue and MSG91 configuration without sending
        run: python3 deploy/order-notifications/readiness.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: order-notification-readiness-${{ github.run_id }}
          path: evidence/order-notifications/readiness.json
          retention-days: 30
