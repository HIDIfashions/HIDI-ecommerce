name: Read-only encrypted COD review lookup
on:
  push:
    branches: [migration/azure-sql-blob]
    paths: [.github/workflows/cod-review-inspect.yml, 'deploy/cod-review-inspect/**']
permissions:
  contents: read
  id-token: write
jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
      - uses: azure/login@v2
        with:
          client-id: 3d62eb64-29dc-48ee-ab35-093312bd50af
          tenant-id: e756fdc0-2646-4e94-ac4d-ed7c11f87f34
          subscription-id: 91d9572d-0f0b-47fe-802d-0eef36d7c719
      - run: python3 deploy/cod-review-inspect/run.py
      - uses: actions/upload-artifact@v4
        with:
          name: encrypted-cod-review
          path: encrypted-cod-review.json
          retention-days: 1
