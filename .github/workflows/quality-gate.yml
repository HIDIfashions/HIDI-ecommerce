name: HIDI Quality Gate

on:
  push:
    branches:
      - feature/premium-storefront-v1
  pull_request:
    branches:
      - main
      - feature/whatsapp-chatbot

permissions:
  contents: read

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/hidi_ci
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Enable pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.15.1

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: pnpm db:generate

      - name: Run customer experience tests
        run: pnpm test:customer-experience

      - name: Run wallet database migration tests
        run: pnpm test:wallet-db

      - name: Build all apps
        run: pnpm build
