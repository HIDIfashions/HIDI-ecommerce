name: HIDI Quality Gate

on:
  push:
    branches:
      - qa/launch-readiness-2026-09-23
  pull_request:
    branches:
      - main
      - feature/whatsapp-chatbot
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: hidi_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d hidi_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/hidi_ci
      API_PORT: "4000"
      WEB_ORIGIN: http://127.0.0.1:3000
      API_URL: http://127.0.0.1:4000/v1
      NEXT_PUBLIC_API_URL: http://127.0.0.1:4000/v1
      HIDI_WALLET_ENABLED: "false"
      HIDI_WALLET_WORKER_ENABLED: "false"
      NEXT_PUBLIC_WALLET_ENABLED: "false"
      RETENTION_ENABLED: "false"
      NEXT_PUBLIC_RETENTION_ENABLED: "false"
      REVIEW_FOLLOWUP_ENABLED: "false"
      WHATSAPP_CHATBOT_ENABLED: "false"
      NEXT_PUBLIC_HIDI_WHATSAPP_NUMBER: ""

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Enable pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.15.1

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: pnpm db:generate

      - name: Run customer experience tests
        run: pnpm test:customer-experience

      - name: Run wallet database migration tests
        run: pnpm test:wallet-db

      - name: Deploy migrations to disposable PostgreSQL
        run: pnpm db:deploy

      - name: Seed launch catalogue
        run: pnpm db:seed

      - name: Build all apps
        run: pnpm build

      - name: Run compiled wallet HTTP guard smoke tests
        run: node --test tests/wallet-http.smoke.mjs

      - name: Production API + storefront launch smoke
        shell: bash
        run: |
          set -euo pipefail

          pnpm --filter @hidi/api start:prod > /tmp/hidi-api.log 2>&1 &
          API_PID=$!

          cleanup() {
            kill "$API_PID" 2>/dev/null || true
            if [[ -n "${WEB_PID:-}" ]]; then kill "$WEB_PID" 2>/dev/null || true; fi
          }
          trap cleanup EXIT

          for attempt in {1..40}; do
            if curl --silent --fail http://127.0.0.1:4000/v1/products >/tmp/hidi-products.json; then
              break
            fi
            if ! kill -0 "$API_PID" 2>/dev/null; then
              echo "::error::HIDI API exited before becoming ready"
              cat /tmp/hidi-api.log
              exit 1
            fi
            sleep 1
          done

          curl --silent --fail http://127.0.0.1:4000/v1/products >/tmp/hidi-products.json || {
            echo "::error::HIDI API did not become ready"
            cat /tmp/hidi-api.log
            exit 1
          }

          node <<'NODE'
          const checks = {
            "all": 12,
            "new-arrivals": 3,
            "work-edit": 5,
            "everyday": 4,
            "occasion": 3,
          };

          for (const [collection, expected] of Object.entries(checks)) {
            const suffix = collection === "all" ? "" : "?category=" + encodeURIComponent(collection);
            const response = await fetch("http://127.0.0.1:4000/v1/products" + suffix);
            if (!response.ok) throw new Error(`Products API ${collection} returned ${response.status}`);
            const products = await response.json();
            if (!Array.isArray(products)) throw new Error(`Products API ${collection} did not return an array`);
            if (products.length !== expected) {
              throw new Error(`Products API ${collection}: expected ${expected}, received ${products.length}`);
            }
            for (const product of products) {
              if (!product.slug || !product.name || !Array.isArray(product.variants)) {
                throw new Error(`Products API ${collection} returned an incomplete product payload`);
              }
              if (!product.variants.length) throw new Error(`Product ${product.slug} has no active variants`);
            }
            console.log(`API ${collection}: ${products.length} products OK`);
          }

          const detail = await fetch("http://127.0.0.1:4000/v1/products/aara-sage-work-kurta");
          if (!detail.ok) throw new Error(`PDP API returned ${detail.status}`);
          const product = await detail.json();
          if (product.name !== "Aara Sage Work Kurta") throw new Error("PDP API returned the wrong product");
          if (!product.images?.length) throw new Error("PDP API returned no product images");
          if (!product.variants?.some((variant) => variant.available > 0)) throw new Error("PDP API returned no buyable variant");
          console.log("API PDP: Aara Sage Work Kurta OK");

          const base = "http://127.0.0.1:4000/v1";
          const sessionId = "qa-cart-session-20260923";
          const checkoutToken = "qa-checkout-token-20260923";
          const buyable = product.variants.find((variant) => variant.available >= 2)
            ?? product.variants.find((variant) => variant.available >= 1);
          if (!buyable) throw new Error("Transactional smoke could not find a buyable Aara variant");
          const originalAvailable = buyable.available;

          async function jsonRequest(path, init = {}, expectedStatus = 200) {
            const response = await fetch(base + path, {
              ...init,
              headers: {
                "content-type": "application/json",
                ...(init.headers ?? {}),
              },
            });
            const text = await response.text();
            let body = null;
            try { body = text ? JSON.parse(text) : null; } catch { body = text; }
            if (response.status !== expectedStatus) {
              throw new Error(`${init.method ?? "GET"} ${path}: expected HTTP ${expectedStatus}, received ${response.status}: ${text}`);
            }
            return body;
          }

          const emptyCart = await jsonRequest(`/carts/${sessionId}`);
          if (emptyCart.itemCount !== 0 || emptyCart.items.length !== 0) {
            throw new Error("Fresh QA cart is not empty");
          }

          let cart = await jsonRequest(`/carts/${sessionId}/items`, {
            method: "POST",
            body: JSON.stringify({ variantId: buyable.id, quantity: 1 }),
          });
          if (cart.itemCount !== 1 || cart.items.length !== 1) throw new Error("Cart add did not create one line item");
          if (!cart.items[0].product?.image) throw new Error("Cart item did not expose a product image");
          const cartItemId = cart.items[0].id;

          if (originalAvailable >= 2) {
            cart = await jsonRequest(`/carts/${sessionId}/items/${cartItemId}`, {
              method: "PATCH",
              body: JSON.stringify({ quantity: 2 }),
            });
            if (cart.itemCount !== 2 || cart.items[0].quantity !== 2) throw new Error("Cart quantity update failed");
          }

          const invalidQuantity = await fetch(base + `/carts/${sessionId}/items/${cartItemId}`, {
            method: "PATCH",
            headers: { "content-type": "application/json" },
            body: JSON.stringify({ quantity: 11 }),
          });
          if (invalidQuantity.status !== 400) {
            throw new Error(`Cart quantity guard expected HTTP 400, received ${invalidQuantity.status}`);
          }

          const quantityBeforeCheckout = cart.items[0].quantity;
          const subtotalBeforeCheckout = cart.subtotalPaise;
          const checkoutResponse = await fetch(base + "/checkout/prepare", {
            method: "POST",
            headers: { "content-type": "application/json" },
            body: JSON.stringify({
              sessionId,
              checkoutToken,
              customerEmail: "qa-launch@invalid.example",
              customerPhone: "9000000000",
              expectedTotalPaise: subtotalBeforeCheckout,
              shippingAddress: {
                firstName: "HIDI",
                lastName: "QA",
                phone: "9000000000",
                line1: "QA Test Address",
                city: "Hyderabad",
                state: "Telangana",
                postalCode: "500001",
                countryCode: "IN",
              },
            }),
          });
          const checkoutText = await checkoutResponse.text();
          if (checkoutResponse.status !== 503 || !checkoutText.includes("Razorpay")) {
            throw new Error(`Safe payment-provider failure expected HTTP 503 Razorpay error, received ${checkoutResponse.status}: ${checkoutText}`);
          }

          const visibleOrders = await jsonRequest(`/checkout/orders?sessionId=${encodeURIComponent(sessionId)}`);
          if (!Array.isArray(visibleOrders) || visibleOrders.length !== 0) {
            throw new Error("Cancelled provider-failure checkout leaked into customer order history");
          }

          const afterFailureResponse = await fetch(base + "/products/aara-sage-work-kurta");
          if (!afterFailureResponse.ok) throw new Error("Unable to reload product after checkout rollback");
          const afterFailure = await afterFailureResponse.json();
          const variantAfterFailure = afterFailure.variants.find((variant) => variant.id === buyable.id);
          if (!variantAfterFailure) throw new Error("Buyable variant disappeared after checkout rollback");
          if (variantAfterFailure.available !== originalAvailable) {
            throw new Error(`Inventory reservation was not rolled back: expected available ${originalAvailable}, received ${variantAfterFailure.available}`);
          }

          const accountNoAuth = await fetch(base + "/account/orders");
          if (accountNoAuth.status !== 401) {
            throw new Error(`Account auth guard expected HTTP 401, received ${accountNoAuth.status}`);
          }

          const adminNoAuth = await fetch(base + "/admin/orders");
          if (![401, 403].includes(adminNoAuth.status)) {
            throw new Error(`Admin auth guard expected HTTP 401/403, received ${adminNoAuth.status}`);
          }

          cart = await jsonRequest(`/carts/${sessionId}/items/${cartItemId}`, { method: "DELETE" });
          if (cart.itemCount !== 0 || cart.items.length !== 0) throw new Error("Cart remove did not empty the QA cart");

          console.log(`TRANSACTION cart add/update/remove: OK (checkout quantity ${quantityBeforeCheckout})`);
          console.log("TRANSACTION Razorpay unavailable rollback + inventory restoration: OK");
          console.log("AUTH account/admin unauthenticated guards: OK");
          NODE

          pnpm --filter @hidi/web exec next start -H 127.0.0.1 -p 3000 > /tmp/hidi-web.log 2>&1 &
          WEB_PID=$!

          for attempt in {1..40}; do
            if curl --silent --fail http://127.0.0.1:3000/ >/tmp/hidi-home.html; then
              break
            fi
            if ! kill -0 "$WEB_PID" 2>/dev/null; then
              echo "::error::HIDI web exited before becoming ready"
              cat /tmp/hidi-web.log
              exit 1
            fi
            sleep 1
          done

          curl --silent --fail http://127.0.0.1:3000/ >/tmp/hidi-home.html || {
            echo "::error::HIDI web did not become ready"
            cat /tmp/hidi-web.log
            exit 1
          }

          node <<'NODE'
          const pages = [
            ["/", ["Aara Sage Work Kurta", "Shop new arrivals"]],
            ["/collections/all", ["Shop All", "Aara Sage Work Kurta", "Meher Gold Beige Occasion Set"]],
            ["/collections/new-arrivals", ["New Arrivals", "Aara Sage Work Kurta", "Sana Sand Kurta Set", "Mahira Indigo Kurta Set"]],
            ["/collections/work-edit", ["Work Edit", "Aara Sage Work Kurta", "Tara Dusty Rose Straight Kurta"]],
            ["/collections/everyday", ["Everyday", "Sana Sand Kurta Set", "Rhea Mint Daily Kurta"]],
            ["/collections/occasion", ["Occasion", "Anika Ivory Embroidered Set", "Meher Gold Beige Occasion Set"]],
            ["/products/aara-sage-work-kurta", ["Aara Sage Work Kurta", "Add to Bag"]],
            ["/cart", ["Bag"]],
            ["/search", ["Find your next piece.", "Start typing to search HIDI."]],
            ["/search?q=aara", ["Aara Sage Work Kurta"]],
            ["/wishlist", ["Your wishlist."]],
            ["/account", ["My HIDI.", "Sign in securely"]],
            ["/checkout", ["Almost yours."]],
            ["/shipping", ["Shipping Policy"]],
            ["/returns", ["HIDI HELP", "Returns"]],
            ["/about", ["For every role you carry.", "Discover HIDI"]],
            ["/order-confirmed", ["ORDER CONFIRMATION", "find that order"]],
          ];

          for (const [path, expectedTexts] of pages) {
            const response = await fetch("http://127.0.0.1:3000" + path, { redirect: "manual" });
            if (response.status !== 200) throw new Error(`${path} returned HTTP ${response.status}`);
            const html = await response.text();
            for (const text of expectedTexts) {
              if (!html.includes(text)) throw new Error(`${path} is missing expected text: ${text}`);
            }
            console.log(`WEB ${path}: 200 + expected content OK`);
          }
          NODE

          echo "HIDI production-mode catalogue and storefront smoke passed."

      - name: Lint storefront
        run: pnpm --filter @hidi/web lint

      - name: Verify API static compilation
        run: pnpm --filter @hidi/api build
