name: Inspect live runtime for Merchant product feed
on:
  push:
    branches: [migration/azure-sql-blob]
    paths: [.github/workflows/merchant-feed-inspect.yml]
permissions:
  contents: read
  id-token: write
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: azure/login@v2
        with:
          client-id: 3d62eb64-29dc-48ee-ab35-093312bd50af
          tenant-id: e756fdc0-2646-4e94-ac4d-ed7c11f87f34
          subscription-id: 91d9572d-0f0b-47fe-802d-0eef36d7c719
      - run: |
          az acr login --name acrhidiprod0927 --only-show-errors
          python3 - <<'PYCODE'
          import importlib.util,json,pathlib
          def load(name,path):
              s=importlib.util.spec_from_file_location(name,path);m=importlib.util.module_from_spec(s);s.loader.exec_module(m);return m
          cloud=load('cloud','deploy/privacy-policy/rollout.py');cloud.API_VERSION='2025-07-01'
          images=load('images','deploy/compose-msg91-images.py')
          out=pathlib.Path('evidence/merchant-inspect');out.mkdir(parents=True)
          states={name:cloud.snapshot(cloud.app(name)) for name in ['hidi-api','hidi-web']}
          for s in states.values():cloud.ready(s)
          root=pathlib.Path('/tmp/merchant-inspect');images.extract(states['hidi-web']['image'],root)
          (out/'before.json').write_text(json.dumps(states,indent=2))
          (out/'server.mjs').write_bytes((root/'server.mjs').read_bytes())
          (out/'images.mjs').write_bytes((root/'product-images/images.mjs').read_bytes())
          print(json.dumps(states,indent=2))
          PYCODE
      - uses: actions/upload-artifact@v4
        with:
          name: merchant-inspection
          path: evidence/merchant-inspect
