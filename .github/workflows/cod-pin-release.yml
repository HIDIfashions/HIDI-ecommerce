name: Fix automatic PIN checks for cached addresses and COD
on:
  push:
    branches: [migration/azure-sql-blob]
    paths: [deploy/cod-pin/**, .github/workflows/cod-pin-release.yml]
  workflow_dispatch:
permissions:
  contents: read
  id-token: write
concurrency:
  group: hidi-hero-guarded-release
  cancel-in-progress: false
jobs:
  release:
    if: github.ref == 'refs/heads/migration/azure-sql-blob'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      HIDI_PLAYWRIGHT_MODULE: /tmp/hidi-cod-pin-browser/node_modules/playwright/index.mjs
      PLAYWRIGHT_BROWSERS_PATH: /tmp/hidi-cod-pin-browsers
      HIDI_TYPESCRIPT_MODULE: /tmp/hidi-cod-pin-tools/node_modules/typescript
      HIDI_TERSER_MODULE: /tmp/hidi-cod-pin-tools/node_modules/terser
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-node@v4
        with: {node-version: 24}
      - name: Check PIN synchronization, retained patch and release syntax
        run: |
          npm install --prefix /tmp/hidi-cod-pin-tools --no-save typescript@5.9.3 terser@5.44.0
          node --test deploy/cod-pin/patch-module.test.mjs
          node --check deploy/cod-pin/probes.mjs
          node --check deploy/cod-pin/candidate.mjs
          python3 -m py_compile deploy/cod-pin/patch-runtime.py deploy/cod-pin/release.py
      - name: Install desktop and mobile browser test engines
        run: |
          npm install --prefix /tmp/hidi-cod-pin-browser --no-save playwright@1.56.1
          node /tmp/hidi-cod-pin-browser/node_modules/playwright/cli.js install --with-deps chromium firefox webkit
      - uses: azure/login@v2
        with:
          client-id: 3d62eb64-29dc-48ee-ab35-093312bd50af
          tenant-id: e756fdc0-2646-4e94-ac4d-ed7c11f87f34
          subscription-id: 91d9572d-0f0b-47fe-802d-0eef36d7c719
      - name: Capture live image and verify exact rollback backup
        run: |
          az acr login --name acrhidiprod0927 --only-show-errors
          python3 deploy/cod-pin/release.py capture
          echo "HIDI_CANDIDATE_RUNTIME=$RUNNER_TEMP/hidi-cod-pin-private/web/candidate-app" >> "$GITHUB_ENV"
      - name: Patch automatic PIN checking in the current checkout runtime
        run: python3 deploy/cod-pin/release.py compose
      - name: Verify PIN autofill and payment behavior against the actual candidate in six browser and viewport combinations
        run: |
          node deploy/cod-pin/candidate.mjs
          python3 deploy/cod-pin/release.py seal
      - name: Publish the exact tested web image
        run: python3 deploy/cod-pin/release.py publish
      - name: Release web and verify live checkout
        id: apply
        timeout-minutes: 20
        run: timeout --signal=TERM --kill-after=10m 15m python3 deploy/cod-pin/release.py apply --image "$WEB_IMAGE"
      - name: Recover an interrupted owned rollout
        if: always() && env.WEB_IMAGE != '' && steps.apply.outcome != 'success'
        timeout-minutes: 15
        run: python3 deploy/cod-pin/release.py recover --image "$WEB_IMAGE"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cod-pin-regression-${{ github.run_id }}-${{ github.run_attempt }}
          path: evidence/cod-pin
          retention-days: 30
