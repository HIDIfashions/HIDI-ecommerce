name: Verified photo upload and image delivery release
on:
  push:
    branches: [migration/azure-sql-blob]
    paths: [.github/workflows/photo-stream-live-release.yml]
permissions:
  contents: read
  id-token: write
concurrency:
  group: hidi-photo-release
  cancel-in-progress: false
jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      HIDI_PHOTO_RELEASE_MODE: deploy
      DATABASE_URL: 'sqlserver://localhost:1433;database=fixture;user=build;password=build;encrypt=true'
      API_URL: http://127.0.0.1:4100/v1
      NEXT_TELEMETRY_DISABLED: '1'
      PLAYWRIGHT_BROWSERS_PATH: ${{ github.workspace }}/.cache/photo-release-browsers
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          ref: e8d5f962558db11f62c4697f0f500b9b4d9e7178
          path: photo-source
      - uses: pnpm/action-setup@v4
        with: {version: 10.15.1}
      - uses: actions/setup-node@v4
        with: {node-version: '22.16.0'}
      - name: Install pinned source and isolated release tooling
        run: |
          pnpm --dir photo-source install --frozen-lockfile
          pnpm --dir photo-source db:generate
          npm install --prefix "$RUNNER_TEMP/photo-tools" --no-audit --no-fund esbuild@0.25.5 playwright@1.56.1 sharp@0.34.1
          node "$RUNNER_TEMP/photo-tools/node_modules/playwright/cli.js" install --with-deps chromium firefox webkit
          echo "HIDI_ESBUILD_MODULE=$RUNNER_TEMP/photo-tools/node_modules/esbuild" >> "$GITHUB_ENV"
          echo "HIDI_PLAYWRIGHT_MODULE=$RUNNER_TEMP/photo-tools/node_modules/playwright/index.mjs" >> "$GITHUB_ENV"
          echo "HIDI_TEST_SHARP=$RUNNER_TEMP/photo-tools/node_modules/sharp" >> "$GITHUB_ENV"
          echo "HIDI_SHARP_MODULE=$RUNNER_TEMP/photo-tools/node_modules/sharp" >> "$GITHUB_ENV"
          sudo apt-get update -qq && sudo apt-get install -y skopeo
      - uses: azure/login@v2
        with:
          client-id: 3d62eb64-29dc-48ee-ab35-093312bd50af
          tenant-id: e756fdc0-2646-4e94-ac4d-ed7c11f87f34
          subscription-id: 91d9572d-0f0b-47fe-802d-0eef36d7c719
      - name: Capture and verify exact rollback copies
        run: |
          az acr login --name acrhidiprod0927 --only-show-errors
          python photo-source/deploy/photo-live/release.py capture
      - name: Compose photo-only packages and prove preservation
        run: python photo-source/deploy/photo-live/release.py compose
      - name: Test the actual packaged handler, retained UI, images and checkout
        run: python photo-source/deploy/photo-live/test.py
      - name: Publish only the tested immutable image identities
        if: ${{ success() && env.HIDI_PHOTO_RELEASE_MODE == 'deploy' }}
        run: python photo-source/deploy/photo-live/release.py publish
      - name: Verify real Azure original upload, read-back, resize and cleanup
        if: ${{ success() && env.HIDI_PHOTO_RELEASE_MODE == 'deploy' }}
        run: python photo-source/deploy/photo-live/azure-check.py
      - name: Switch existing apps with ownership-aware rollback
        if: ${{ success() && env.HIDI_PHOTO_RELEASE_MODE == 'deploy' }}
        id: rollout
        run: timeout --signal=TERM --kill-after=300s 900s python photo-source/deploy/photo-live/release.py apply
      - name: Reconcile only revisions owned by this run after an interrupted rollout
        if: ${{ failure() && steps.rollout.outcome == 'failure' }}
        run: python photo-source/deploy/photo-live/release.py recover
      - name: Preserve release and test evidence without private configuration
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: photo-stream-release-evidence
          path: |
            evidence/photo-live/
            evidence/checkout-offers/candidate/
            evidence/checkout-offers/purchase-regression/
            photo-source/test-results/photo-web-upload/
          retention-days: 30
