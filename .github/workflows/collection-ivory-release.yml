name: HIDI approved Shop All and ivory - tested release
on:
  push:
    branches: [migration/azure-sql-blob]
    paths: [deploy/collection-ivory/**, .github/workflows/collection-ivory-release.yml]
  workflow_dispatch:
permissions:
  contents: read
  actions: read
  id-token: write
concurrency:
  group: hidi-checkout-offers-release
  cancel-in-progress: false
jobs:
  verify-and-release:
    if: github.ref == 'refs/heads/migration/azure-sql-blob'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      HIDI_PLAYWRIGHT_MODULE: /tmp/hidi-collection-ivory-browser/node_modules/playwright/index.mjs
      HIDI_TYPESCRIPT_MODULE: /tmp/hidi-collection-ivory-browser/node_modules/typescript/lib/typescript.js
      HIDI_LUCIDE_ROOT: /tmp/hidi-collection-ivory-browser/node_modules/lucide-react
      PLAYWRIGHT_BROWSERS_PATH: /tmp/hidi-collection-ivory-browsers
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 24}
      - name: Install isolated compiler, browser engines and exact backup tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y skopeo umoci
          npm install --prefix /tmp/hidi-collection-ivory-browser --no-save playwright@1.56.1 typescript@5.9.3
          node /tmp/hidi-collection-ivory-browser/node_modules/playwright/cli.js install --with-deps chromium firefox webkit
      - name: Verify reviewed patch boundaries and existing SEO contracts
        run: |
          node --test deploy/collection-ivory/patch.test.mjs tests/storefront-surfaces.test.cjs
          node --check deploy/collection-ivory/patch.mjs
          node --check deploy/collection-ivory/probes.mjs
          python3 -m py_compile deploy/collection-ivory/release.py
          node --test deploy/merchant-feed/feed.test.mjs deploy/seo-discovery/seo.test.mjs deploy/seo-discovery/policy-metadata.test.mjs deploy/seo-foundation/links.test.mjs tests/button-request-policy.test.mjs
      - name: Require full source, desktop and mobile commerce regression for this commit
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 deploy/collection-ivory/source-gate.py
      - uses: azure/login@v2
        with:
          client-id: 3d62eb64-29dc-48ee-ab35-093312bd50af
          tenant-id: e756fdc0-2646-4e94-ac4d-ed7c11f87f34
          subscription-id: 91d9572d-0f0b-47fe-802d-0eef36d7c719
      - name: Capture ready deployment and verify exact rollback image
        run: |
          az acr login --name acrhidiprod0927 --only-show-errors
          python3 deploy/collection-ivory/release.py capture
          echo "HIDI_CANDIDATE_RUNTIME=$RUNNER_TEMP/hidi-collection-ivory-private/web/candidate-app" >> "$GITHUB_ENV"
      - name: Compose approved changes and prove all unrelated runtime files identical
        run: python3 deploy/collection-ivory/release.py compose
      - name: Test exact candidate against baseline in Chromium Firefox and WebKit
        run: |
          node deploy/collection-ivory/candidate.mjs
          python3 deploy/collection-ivory/release.py seal
      - name: Publish the exact tested image
        run: python3 deploy/collection-ivory/release.py publish
      - uses: azure/login@v2
        with:
          client-id: 3d62eb64-29dc-48ee-ab35-093312bd50af
          tenant-id: e756fdc0-2646-4e94-ac4d-ed7c11f87f34
          subscription-id: 91d9572d-0f0b-47fe-802d-0eef36d7c719
      - name: Apply with concurrency guard and verify live shopping and SEO
        id: apply
        timeout-minutes: 25
        run: timeout --signal=TERM --kill-after=10m 20m python3 deploy/collection-ivory/release.py apply --image "$WEB_IMAGE"
      - uses: azure/login@v2
        if: always() && env.WEB_IMAGE != '' && steps.apply.outcome != 'success'
        with:
          client-id: 3d62eb64-29dc-48ee-ab35-093312bd50af
          tenant-id: e756fdc0-2646-4e94-ac4d-ed7c11f87f34
          subscription-id: 91d9572d-0f0b-47fe-802d-0eef36d7c719
      - name: Recover interrupted owned rollout
        if: always() && env.WEB_IMAGE != '' && steps.apply.outcome != 'success'
        timeout-minutes: 15
        run: python3 deploy/collection-ivory/release.py recover --image "$WEB_IMAGE"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: collection-ivory-regression-${{ github.run_id }}-${{ github.run_attempt }}
          path: evidence/collection-ivory
          retention-days: 30
