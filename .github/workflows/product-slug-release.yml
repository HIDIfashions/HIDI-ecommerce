name: Deploy automatic product slug fix
on:
  push:
    branches: [migration/azure-sql-blob]
    paths: [.github/workflows/product-slug-release.yml, deploy/product-slug/**]
  workflow_dispatch:
permissions:
  contents: read
  id-token: write
concurrency:
  group: hidi-hero-guarded-release
  cancel-in-progress: false
jobs:
  release:
    if: github.ref == 'refs/heads/migration/azure-sql-blob'
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-node@v4
        with: {node-version: '24'}
      - name: Test slug behavior and rollback guards
        run: |
          node --test tests/admin-product-bulk.test.mjs tests/admin-quick-tools.test.mjs
          python3 deploy/product-slug/test_release.py
          node --check deploy/product-slug/patch.mjs
          node --check deploy/product-slug/verify-model.mjs
      - name: Install isolated browser regression tools
        run: |
          npm install --prefix "$RUNNER_TEMP/slug-browser" --no-save playwright@1.56.1
          node "$RUNNER_TEMP/slug-browser/node_modules/playwright/cli.js" install --with-deps chromium
          echo "HIDI_PLAYWRIGHT_MODULE=$RUNNER_TEMP/slug-browser/node_modules/playwright/index.mjs" >> "$GITHUB_ENV"
      - uses: azure/login@v2
        with:
          client-id: 3d62eb64-29dc-48ee-ab35-093312bd50af
          tenant-id: e756fdc0-2646-4e94-ac4d-ed7c11f87f34
          subscription-id: 91d9572d-0f0b-47fe-802d-0eef36d7c719
      - name: Capture current production and verify rollback image
        run: |
          az acr login --name acrhidiprod0927 --only-show-errors
          python3 deploy/product-slug/release.py capture
      - name: Patch only live uploader slug behavior
        run: python3 deploy/product-slug/release.py compose
      - name: Test exact candidate uploader and publish immutable image
        run: |
          python3 deploy/product-slug/release.py seal
          python3 deploy/product-slug/release.py publish
      - name: Deploy and verify live assets with rollback on failure
        id: apply
        timeout-minutes: 15
        run: timeout --signal=TERM --kill-after=3m 12m python3 deploy/product-slug/release.py apply --image "$WEB_IMAGE"
      - name: Recover interrupted owned deployment
        if: always() && env.WEB_IMAGE != '' && steps.apply.outcome != 'success'
        timeout-minutes: 12
        run: python3 deploy/product-slug/release.py recover --image "$WEB_IMAGE"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: product-slug-release-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            evidence/product-slug
            test-results/admin-quick-tools
          retention-days: 30
