name: Burgundy header guarded release
on:
  push:
    branches: [migration/azure-sql-blob]
    paths: [deploy/header-theme/**, .github/workflows/header-theme-release.yml]
  workflow_dispatch:
permissions:
  contents: read
  id-token: write
concurrency:
  group: hidi-checkout-offers-release
  cancel-in-progress: false
jobs:
  release:
    if: github.ref == 'refs/heads/migration/azure-sql-blob'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      HIDI_PLAYWRIGHT_MODULE: /tmp/hidi-header-browser/node_modules/playwright/index.mjs
      PLAYWRIGHT_BROWSERS_PATH: /tmp/hidi-header-browsers
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 1}
      - uses: actions/setup-node@v4
        with: {node-version: 24}
      - name: Validate release syntax and retained offer security
        run: |
          python3 -m py_compile deploy/header-theme/release.py deploy/header-theme/patch-runtime.py
          python3 -m unittest discover -s deploy/coupon-copy -p 'test_*.py'
          node --test deploy/offers/model.test.mjs deploy/offers/handler.test.mjs
      - name: Install registry tooling and browser engines
        run: |
          sudo apt-get update -qq && sudo apt-get install -y skopeo umoci
          npm install --prefix /tmp/hidi-header-browser --no-save playwright@1.56.1
          node /tmp/hidi-header-browser/node_modules/playwright/cli.js install --with-deps chromium firefox webkit
      - uses: azure/login@v2
        with:
          client-id: 3d62eb64-29dc-48ee-ab35-093312bd50af
          tenant-id: e756fdc0-2646-4e94-ac4d-ed7c11f87f34
          subscription-id: 91d9572d-0f0b-47fe-802d-0eef36d7c719
      - name: Capture live state and immutable rollback images
        run: |
          az acr login --name acrhidiprod0927 --only-show-errors
          python3 deploy/header-theme/release.py capture
      - name: Compose bounded header change on the exact live web image
        run: python3 deploy/header-theme/release.py compose
      - name: Test header routes and retained pricing, payments, offers and purchase flows
        run: |
          node deploy/checkout-offers/api-test.mjs
          node deploy/welcome250/api-check.mjs
          node deploy/header-theme/browser-check.mjs
          python3 deploy/header-theme/release.py seal
      - name: Publish only the tested immutable candidate
        run: python3 deploy/header-theme/release.py publish
      - uses: azure/login@v2
        with:
          client-id: 3d62eb64-29dc-48ee-ab35-093312bd50af
          tenant-id: e756fdc0-2646-4e94-ac4d-ed7c11f87f34
          subscription-id: 91d9572d-0f0b-47fe-802d-0eef36d7c719
      - name: Deploy web only and verify preserved live configuration
        id: apply
        timeout-minutes: 20
        run: timeout --signal=TERM --kill-after=10m 15m python3 deploy/header-theme/release.py apply
      - name: Recover an interrupted owned rollout
        if: always() && env.WEB_IMAGE != '' && steps.apply.outcome != 'success'
        timeout-minutes: 15
        run: python3 deploy/header-theme/release.py recover
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: header-theme-release-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            evidence/checkout-offers
            evidence/welcome250
            evidence/header-theme
          retention-days: 30
