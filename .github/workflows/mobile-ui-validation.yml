name: Mobile UI Validation

on:
  push:
    branches:
      - fix/mobile-ui-hardening

permissions:
  contents: read

jobs:
  web-validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Enable pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.15.1

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Type-check web app
        run: pnpm --filter @hidi/web exec tsc --noEmit

      - name: Build web app
        run: pnpm --filter @hidi/web build
