name: Photo candidate verification - no deployment
on:
  push:
    branches: [migration/azure-sql-blob]
    paths: [.github/workflows/photo-readonly-candidate-verification.yml]
permissions:
  contents: read
concurrency:
  group: hidi-photo-readonly-verification
  cancel-in-progress: false
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
      id-token: write
    env:
      DATABASE_URL: 'sqlserver://localhost:1433;database=fixture;user=build;password=build;encrypt=true'
      API_URL: http://127.0.0.1:4100/v1
      NEXT_TELEMETRY_DISABLED: '1'
      PLAYWRIGHT_BROWSERS_PATH: ${{ github.workspace }}/.cache/photo-verification-browsers
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          ref: 828525c93499507fa8054d5ad7d4f05c64c75ac4
          path: photo-source
          persist-credentials: false
      - name: Verify fixed source and offline safeguards
        run: |
          set -euo pipefail
          test "$(git -C photo-source rev-parse HEAD)" = 828525c93499507fa8054d5ad7d4f05c64c75ac4
          mkdir -p evidence/photo-live
          python photo-source/deploy/photo-live/azure-check.test.py 2>&1 | tee evidence/photo-live/cleanup-tests.log
          python photo-source/deploy/photo-live/arm-state.test.py 2>&1 | tee evidence/photo-live/arm-state-tests.log
      - uses: pnpm/action-setup@v4
        with: {version: 10.15.1}
      - uses: actions/setup-node@v4
        with: {node-version: '22.16.0'}
      - name: Install isolated test tooling
        run: |
          set -euo pipefail
          pnpm --dir photo-source install --frozen-lockfile
          pnpm --dir photo-source db:generate
          npm install --prefix "$RUNNER_TEMP/photo-tools" --no-audit --no-fund esbuild@0.25.5 playwright@1.56.1 sharp@0.34.1
          node "$RUNNER_TEMP/photo-tools/node_modules/playwright/cli.js" install --with-deps chromium firefox webkit
          echo "HIDI_ESBUILD_MODULE=$RUNNER_TEMP/photo-tools/node_modules/esbuild" >> "$GITHUB_ENV"
          echo "HIDI_PLAYWRIGHT_MODULE=$RUNNER_TEMP/photo-tools/node_modules/playwright/index.mjs" >> "$GITHUB_ENV"
          echo "HIDI_TEST_SHARP=$RUNNER_TEMP/photo-tools/node_modules/sharp" >> "$GITHUB_ENV"
          echo "HIDI_SHARP_MODULE=$RUNNER_TEMP/photo-tools/node_modules/sharp" >> "$GITHUB_ENV"
      - name: Authenticate for existing app and image reads only
        uses: azure/login@v2
        with:
          client-id: 3d62eb64-29dc-48ee-ab35-093312bd50af
          tenant-id: e756fdc0-2646-4e94-ac4d-ed7c11f87f34
          subscription-id: 91d9572d-0f0b-47fe-802d-0eef36d7c719
      - name: Read live configuration and pull immutable image copies
        id: capture
        run: |
          set -euo pipefail
          az acr login --name acrhidiprod0927 --only-show-errors
          python - <<'PY'
          import importlib.util,json,os,subprocess
          from pathlib import Path
          p=Path('photo-source/deploy/photo-live/release.py').resolve()
          spec=importlib.util.spec_from_file_location('photo_read_only',p)
          m=importlib.util.module_from_spec(spec);spec.loader.exec_module(m)
          # Only the existing READ-ONLY capture helper is used. Do not call the
          # release capture/backup/publish/apply/recover functions in this audit.
          m.r.photo.capture()
          before=m.r.photo.states()
          m.r.guard.write_private('public-before.json',m.r.guard.public_snapshot())
          for app in ['api','web']:
              image=before['hidi-'+app]['image'];m.r.guard.immutable(image,app)
              subprocess.run(['docker','pull',image],check=True)
          m.r.photo.unchanged(before)
          m.save('verification-scope.json',{'productionDeployment':False,'azureResourceWrites':False,'registryPushes':False,'sqlWrites':False,'blobWrites':False,'sourceSha':m.source_sha(),'workflowSha':os.environ['GITHUB_SHA'],'states':before})
          PY
          az logout
          docker logout acrhidiprod0927.azurecr.io
      - name: Compose local-only candidates and check every changed runtime file
        id: compose
        run: |
          python - <<'PY'
          import importlib.util,json,os,subprocess
          from pathlib import Path
          p=Path('photo-source/deploy/photo-live/release.py').resolve()
          spec=importlib.util.spec_from_file_location('photo_local_test',p)
          m=importlib.util.module_from_spec(spec);spec.loader.exec_module(m)
          before=m.r.photo.states()
          for app in ['api','web']:
              folder=m.P/app;folder.mkdir(exist_ok=True)
              base,overlay,candidate=(folder/n for n in ['base-app','overlay','candidate-app'])
              original=before['hidi-'+app]['image']
              m.r.images.extract(original,base)
              plan=m.patcher.patch(base,overlay,app);m.save(app+'-patch.json',plan)
              for name in plan['allowedFiles']:
                  if name.endswith(('.js','.mjs','.cjs')):subprocess.run(['node','--check',str(overlay/name)],check=True)
              # Local runner tag only. This workflow never pushes images.
              tag='hidi-photo-readonly-'+app+':'+os.environ['GITHUB_RUN_ID']
              (folder/'Dockerfile').write_text('FROM '+original+'\nCOPY --chown=node:node overlay/ /app/\n')
              subprocess.run(['docker','build','--pull=false','-t',tag,str(folder)],check=True)
              m.r.images.extract(tag,candidate)
              configs=json.loads(m.r.images.docker('image','inspect',original,tag))
              report=m.r.guard.preserve.verify(base,candidate,overlay,set(plan['allowedFiles']),configs)
              report.update({'baseImage':original,'candidateImageId':configs[1]['Id'],'localOnly':True})
              m.save(app+'-preservation.json',report)
          with open(os.environ['GITHUB_ENV'],'a') as f:
              f.write('HIDI_CANDIDATE_RUNTIME='+str(m.P/'web/candidate-app')+'\nHIDI_CANDIDATE_API='+str(m.P/'api/candidate-app')+'\n')
          PY
      - name: Run all packaged upload image editor and checkout regression suites
        id: tests
        run: python photo-source/deploy/photo-live/test.py
      - name: Enforce complete browser coverage rather than a partial pass
        if: ${{ success() }}
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          results=json.loads(Path('photo-source/test-results/photo-web-upload/results.json').read_text())['results']
          assert len(results)==24 and all(x['status']=='PASS' for x in results)
          assert {x['engine'] for x in results}=={'chromium','firefox','webkit'}
          assert all(sum(x['engine']==engine for x in results)==8 for engine in ['chromium','firefox','webkit'])
          for p in ['evidence/photo-live/tests.json','evidence/photo-live/api-preservation.json','evidence/photo-live/web-preservation.json','evidence/checkout-offers/candidate/report.json','evidence/checkout-offers/purchase-regression/report.json']:
              assert json.loads(Path(p).read_text())['passed'] is True,p
          print('PASS: all 24 browser cases, packaged suites, runtime preservation and checkout regressions. Verification only; no deployment.')
          PY
      - name: Authenticate only to compare final live state
        if: ${{ always() && steps.capture.outcome == 'success' }}
        uses: azure/login@v2
        with:
          client-id: 3d62eb64-29dc-48ee-ab35-093312bd50af
          tenant-id: e756fdc0-2646-4e94-ac4d-ed7c11f87f34
          subscription-id: 91d9572d-0f0b-47fe-802d-0eef36d7c719
      - name: Confirm production state and public configuration are unchanged
        if: ${{ always() && steps.capture.outcome == 'success' }}
        run: |
          python - <<'PY'
          import importlib.util,json
          from pathlib import Path
          p=Path('photo-source/deploy/photo-live/release.py').resolve()
          spec=importlib.util.spec_from_file_location('photo_final_read',p)
          m=importlib.util.module_from_spec(spec);spec.loader.exec_module(m)
          m.r.photo.unchanged(m.r.photo.states())
          assert m.r.guard.public_snapshot()==m.r.guard.private_json('public-before.json')
          m.save('verification-production-unchanged.json',{'passed':True,'productionDeployment':False,'azureResourceWrites':False,'registryPushes':False,'sqlWrites':False,'blobWrites':False,'statesUnchanged':True,'publicConfigurationUnchanged':True,'sourceSha':m.source_sha()})
          print('PASS: production images, revisions, protected configuration and public configuration remain unchanged.')
          PY
      - name: Preserve test evidence only, never private configuration or credentials
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: photo-readonly-verification-evidence
          path: |
            evidence/photo-live/
            evidence/checkout-offers/candidate/
            evidence/checkout-offers/purchase-regression/
            photo-source/test-results/photo-web-upload/
          retention-days: 14
