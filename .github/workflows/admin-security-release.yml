name: Admin OTP, idle expiry and owner sales cleanup
on:
  push:
    branches: [migration/azure-sql-blob]
    paths: [deploy/admin-security/**, apps/api/src/admin/admin-session.ts, apps/api/src/admin/admin-sales*, apps/api/src/admin/admin-login.controller.ts, .github/workflows/admin-security-release.yml]
  workflow_dispatch:
permissions:
  contents: read
  id-token: write
jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    concurrency:
      group: hidi-hero-guarded-release
      cancel-in-progress: false
    env:
      DATABASE_URL: sqlserver://localhost:1433;database=hidi;user=fixture;password=fixture;encrypt=true
      HIDI_PLAYWRIGHT_MODULE: /tmp/hidi-security-browser/node_modules/playwright/index.mjs
      PLAYWRIGHT_BROWSERS_PATH: /tmp/hidi-security-browsers
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: pnpm/action-setup@v4
        with: {version: 10.15.1}
      - uses: actions/setup-node@v4
        with: {node-version: 24, cache: pnpm}
      - name: Build and test server policy and same-origin proxy
        run: |
          pnpm install --frozen-lockfile
          pnpm --filter @hidi/api build
          pnpm --filter @hidi/api test:customer-experience
          node --test deploy/admin-security/handler.test.mjs
          python3 -m py_compile deploy/admin-security/*.py
      - name: Prepare immutable backups and browser verification tools
        run: |
          sudo apt-get update -qq && sudo apt-get install -y skopeo
          npm install --prefix /tmp/hidi-security-browser --no-save playwright@1.62.1
          node /tmp/hidi-security-browser/node_modules/playwright/cli.js install --with-deps chromium
      - uses: azure/login@v2
        with:
          client-id: 3d62eb64-29dc-48ee-ab35-093312bd50af
          tenant-id: e756fdc0-2646-4e94-ac4d-ed7c11f87f34
          subscription-id: 91d9572d-0f0b-47fe-802d-0eef36d7c719
      - name: Back up current production and compose narrowly scoped changes
        run: |
          az acr login --name acrhidiprod0927 --only-show-errors
          python3 deploy/admin-security/live.py inspect
          python3 deploy/admin-security/release.py capture
          python3 deploy/admin-security/release.py compose
          echo "HIDI_CANDIDATE_API=$RUNNER_TEMP/hidi-admin-security-private/api/candidate-app" >> "$GITHUB_ENV"
          echo "HIDI_CANDIDATE_RUNTIME=$RUNNER_TEMP/hidi-admin-security-private/web/candidate-app" >> "$GITHUB_ENV"
      - name: Test exact compiled candidate and desktop and mobile login and deletion
        run: |
          node deploy/admin-security/api-test.mjs
          node deploy/admin-security/runtime-smoke.mjs
          node deploy/admin-security/candidate.mjs
          python3 deploy/admin-security/release.py seal
          python3 deploy/admin-security/release.py publish
      - uses: azure/login@v2
        with:
          client-id: 3d62eb64-29dc-48ee-ab35-093312bd50af
          tenant-id: e756fdc0-2646-4e94-ac4d-ed7c11f87f34
          subscription-id: 91d9572d-0f0b-47fe-802d-0eef36d7c719
      - name: Deploy and verify real database expiry and deletion with rollback-only fixtures
        id: apply
        run: python3 deploy/admin-security/release.py apply
      - name: Clean up authorised sales strictly before 10 October 2026 IST
        run: python3 deploy/admin-security/live.py cleanup
      - name: Recover only an interrupted owned deployment
        if: always() && env.WEB_IMAGE != '' && steps.apply.outcome != 'success'
        run: python3 deploy/admin-security/release.py recover
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: admin-security-release-${{ github.run_id }}-${{ github.run_attempt }}
          path: evidence/admin-security
          retention-days: 30
