name: Persistent image derivatives Azure preflight
on:
  push:
    branches: [feature/persistent-image-derivatives-v2-20261021]
    paths:
      - '.github/workflows/persistent-image-derivatives-azure-preflight.yml'
      - 'apps/web/app/api/admin/inventory/**/images/route.ts'
      - 'apps/web/lib/azure-blob.ts'
      - 'apps/web/lib/photo-azure-stream.mjs'
      - 'apps/web/lib/photo-upload-stream.mjs'
      - 'apps/web/lib/product-image-derivative-store.*'
      - 'apps/web/lib/product-image-derivatives.*'
      - 'apps/web/components/catalog-image.tsx'
      - 'deploy/collection-speed/images.*'
      - 'deploy/collection-speed/photo-disk.mjs'
      - 'deploy/image-derivatives/**'
      - 'deploy/photo-live/**'
      - 'deploy/admin-tools/product-delete-storage.mjs'
permissions:
  contents: read
  id-token: write
concurrency:
  group: persistent-image-azure-preflight-${{ github.ref }}
  cancel-in-progress: true
jobs:
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    env:
      DATABASE_URL: 'sqlserver://localhost:1433;database=fixture;user=build;password=build;encrypt=true'
      API_URL: http://127.0.0.1:4100/v1
      NEXT_TELEMETRY_DISABLED: '1'
      PLAYWRIGHT_BROWSERS_PATH: ${{ github.workspace }}/.cache/persistent-image-azure-browsers
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 10.15.1
      - uses: actions/setup-node@v4
        with:
          node-version: '22.16.0'
          cache: pnpm
      - name: Install source and isolated release tooling
        run: |
          set -euo pipefail
          pnpm install --frozen-lockfile
          pnpm db:generate
          npm install --prefix "$RUNNER_TEMP/persistent-image-azure-tools" --no-audit --no-fund esbuild@0.25.5 playwright@1.56.1 sharp@0.34.1
          echo "HIDI_ESBUILD_MODULE=$RUNNER_TEMP/persistent-image-azure-tools/node_modules/esbuild" >> "$GITHUB_ENV"
          echo "HIDI_PLAYWRIGHT_MODULE=$RUNNER_TEMP/persistent-image-azure-tools/node_modules/playwright/index.mjs" >> "$GITHUB_ENV"
          echo "HIDI_TEST_SHARP=$RUNNER_TEMP/persistent-image-azure-tools/node_modules/sharp" >> "$GITHUB_ENV"
          echo "HIDI_SHARP_MODULE=$RUNNER_TEMP/persistent-image-azure-tools/node_modules/sharp" >> "$GITHUB_ENV"
          node "$RUNNER_TEMP/persistent-image-azure-tools/node_modules/playwright/cli.js" install --with-deps chromium firefox webkit
          sudo apt-get update -qq
          sudo apt-get install -y skopeo
          node --check deploy/image-derivatives/azure-storage-probe.mjs
          python -m py_compile deploy/photo-live/azure-check.py deploy/photo-live/arm-state.py deploy/photo-live/patch.py deploy/photo-live/release.py deploy/photo-live/test.py
      - uses: azure/login@v2
        with:
          client-id: 3d62eb64-29dc-48ee-ab35-093312bd50af
          tenant-id: e756fdc0-2646-4e94-ac4d-ed7c11f87f34
          subscription-id: 91d9572d-0f0b-47fe-802d-0eef36d7c719
      - name: Capture exact live baseline without changing traffic
        run: |
          set -euo pipefail
          BASELINE_SHA="$(git ls-remote origin refs/heads/migration/azure-sql-blob | cut -f1)"
          test -n "$BASELINE_SHA"
          echo "HIDI_PRODUCTION_BASELINE_SHA=$BASELINE_SHA" >> "$GITHUB_ENV"
          az acr login --name acrhidiprod0927 --only-show-errors
          env GITHUB_SHA="$BASELINE_SHA" python deploy/photo-live/release.py capture
          env GITHUB_SHA="$BASELINE_SHA" python deploy/photo-live/azure-check.py identity-preflight
      - name: Compose candidate over captured production runtime
        run: env GITHUB_SHA="$HIDI_PRODUCTION_BASELINE_SHA" python deploy/photo-live/release.py compose
      - name: Test exact candidate with retained commerce regression
        run: env GITHUB_SHA="$HIDI_PRODUCTION_BASELINE_SHA" python deploy/photo-live/test.py
      - name: Publish tested immutable candidate only
        run: env GITHUB_SHA="$HIDI_PRODUCTION_BASELINE_SHA" python deploy/photo-live/release.py publish
      - name: Run real Azure managed-identity derivative lifecycle
        run: env GITHUB_SHA="$HIDI_PRODUCTION_BASELINE_SHA" python deploy/photo-live/azure-check.py
      - name: Prove production traffic was never switched
        if: always()
        run: |
          python - <<'PY'
          import json,pathlib
          report=pathlib.Path('evidence/photo-live/azure-storage-test.json')
          assert report.exists(),'Azure storage evidence is missing'
          data=json.loads(report.read_text())
          assert data.get('passed') is True
          assert data.get('persistentDerivativeCount')==7
          assert data.get('validationJobRemoved') is True
          assert data.get('productionTrafficChanged') is False
          assert not pathlib.Path('evidence/photo-live/after.json').exists(),'Apply evidence exists even though this workflow must never deploy'
          print(json.dumps({
            'passed':True,
            'persistentDerivativeCount':data.get('persistentDerivativeCount'),
            'persistentDerivativeBytes':data.get('persistentDerivativeBytes'),
            'validationJobRemoved':data.get('validationJobRemoved'),
            'productionTrafficChanged':data.get('productionTrafficChanged'),
          },indent=2))
          PY
      - name: Preserve preflight evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: persistent-image-azure-preflight-evidence
          path: |
            evidence/photo-live/
            evidence/checkout-offers/candidate/
            evidence/checkout-offers/purchase-regression/
            test-results/photo-web-upload/
          retention-days: 30
