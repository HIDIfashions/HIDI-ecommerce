name: Isolated product page release
on:
  push:
    branches: [migration/azure-sql-blob]
    paths: [deploy/product-page/**, .github/workflows/product-page-release.yml]
permissions:
  contents: read
  id-token: write
concurrency:
  group: hidi-hero-guarded-release
  cancel-in-progress: false
jobs:
  inspect-current-route:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: azure/login@v2
        with:
          client-id: 3d62eb64-29dc-48ee-ab35-093312bd50af
          tenant-id: e756fdc0-2646-4e94-ac4d-ed7c11f87f34
          subscription-id: 91d9572d-0f0b-47fe-802d-0eef36d7c719
      - name: Inspect current immutable product route without production writes
        run: |
          az acr login --name acrhidiprod0927 --only-show-errors
          python3 deploy/product-page/inspect.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: product-page-inspection-${{ github.run_id }}
          path: evidence/product-page-release/inspection
          retention-days: 7
