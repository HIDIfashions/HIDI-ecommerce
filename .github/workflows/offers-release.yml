name: HIDI private offers controls
on:
  push:
    branches: [migration/azure-sql-blob]
    paths: [deploy/offers/**, .github/workflows/offers-release.yml]
  workflow_dispatch:
permissions:
  contents: read
  id-token: write
concurrency:
  group: hidi-hero-guarded-release
  cancel-in-progress: false
jobs:
  release:
    if: github.ref == 'refs/heads/migration/azure-sql-blob' && !contains(github.event.head_commit.message, '[checkout-offers]')
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      HIDI_PLAYWRIGHT_MODULE: /tmp/hidi-offers-browser/node_modules/playwright/index.mjs
      PLAYWRIGHT_BROWSERS_PATH: /tmp/hidi-offers-browsers
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 1}
      - uses: actions/setup-node@v4
        with: {node-version: 24}
      - name: Check offer security and release syntax
        run: |
          python3 deploy/offers/patch.test.py
          node --test deploy/offers/model.test.mjs deploy/offers/handler.test.mjs
          node --check deploy/offers/probes.mjs
          node --check deploy/offers/candidate.mjs
          python3 -m py_compile deploy/offers/patch-runtime.py deploy/offers/release.py
      - name: Install exact-manifest backup tooling
        run: sudo apt-get update -qq && sudo apt-get install -y skopeo
      - name: Install desktop and mobile browser test engines
        run: |
          npm install --prefix /tmp/hidi-offers-browser --no-save playwright@1.56.1
          node /tmp/hidi-offers-browser/node_modules/playwright/cli.js install --with-deps chromium firefox webkit
      - uses: azure/login@v2
        with:
          client-id: 3d62eb64-29dc-48ee-ab35-093312bd50af
          tenant-id: e756fdc0-2646-4e94-ac4d-ed7c11f87f34
          subscription-id: 91d9572d-0f0b-47fe-802d-0eef36d7c719
      - name: Capture live image and verify exact rollback backup
        run: |
          az acr login --name acrhidiprod0927 --only-show-errors
          python3 deploy/offers/release.py capture
          echo "HIDI_CANDIDATE_API=$RUNNER_TEMP/hidi-offers-private/api/candidate-app" >> "$GITHUB_ENV"
          echo "HIDI_CANDIDATE_RUNTIME=$RUNNER_TEMP/hidi-offers-private/web/candidate-app" >> "$GITHUB_ENV"
      - name: Compose additive API identity and offer UI overlays
        run: python3 deploy/offers/release.py compose
      - name: Verify identity signatures, audiences, admin editor and retained shopping routes
        run: |
          node deploy/offers/api-probe.mjs
          node deploy/offers/candidate.mjs
          python3 deploy/offers/release.py seal
      - name: Publish the exact tested images
        run: python3 deploy/offers/release.py publish
      - uses: azure/login@v2
        with:
          client-id: 3d62eb64-29dc-48ee-ab35-093312bd50af
          tenant-id: e756fdc0-2646-4e94-ac4d-ed7c11f87f34
          subscription-id: 91d9572d-0f0b-47fe-802d-0eef36d7c719
      - name: Release API and web with guarded recovery
        id: apply
        timeout-minutes: 20
        run: timeout --signal=TERM --kill-after=10m 15m python3 deploy/offers/release.py apply
      - name: Recover an interrupted owned rollout
        if: always() && env.WEB_IMAGE != '' && steps.apply.outcome != 'success'
        timeout-minutes: 15
        run: python3 deploy/offers/release.py recover
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: offers-regression-${{ github.run_id }}-${{ github.run_attempt }}
          path: evidence/offers
          retention-days: 30
