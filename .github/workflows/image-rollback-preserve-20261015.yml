name: Preserve image-rollout rollback copies
on:
  push:
    branches: [migration/azure-sql-blob]
    paths: ['.github/workflows/image-rollback-preserve-20261015.yml']
permissions:
  contents: read
  id-token: write
jobs:
  preserve:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: azure/login@v2
        with:
          client-id: 3d62eb64-29dc-48ee-ab35-093312bd50af
          tenant-id: e756fdc0-2646-4e94-ac4d-ed7c11f87f34
          subscription-id: 91d9572d-0f0b-47fe-802d-0eef36d7c719
      - name: Preserve verified active container manifests without touching running apps
        run: |
          python - <<'PY'
          import subprocess,json,pathlib,os,datetime,re
          root=pathlib.Path('reports/image-backup');root.mkdir(parents=True,exist_ok=True)
          expected={'hidi-web':'sha256:26222c14193437d83d98f705796c17bcf70854dce56cf964e35a4dd5f9833c69','hidi-api':'sha256:d55d57a0834bcdcb83da6c88c9fcc41e7c61a29b841383096ef00e70afd82701'}
          registry='acrhidiprod0927.azurecr.io';report={'at':datetime.datetime.now(datetime.timezone.utc).isoformat(),'runId':os.environ['GITHUB_RUN_ID'],'productionDeployment':False,'databaseChanged':False,'blobChanged':False,'copies':[],'sourceBranches':{},'databaseBackup':'NOT VERIFIED; SQL recovery metadata read failed in preflight.'}
          def az(args):
            p=subprocess.run(['az',*args,'--only-show-errors','-o','json'],capture_output=True,text=True,timeout=180)
            if p.returncode:
              code=re.search(r'\((AuthorizationFailed|Forbidden|InvalidParameter|ResourceNotFound|ResourceGroupNotFound|Conflict|BadRequest)\)',p.stderr)
              raise RuntimeError('Azure operation failed'+(': '+code[1] if code else ' (see authorized Azure activity log)'))
            return json.loads(p.stdout) if p.stdout.strip() else None
          try:
            for app,digest in expected.items():
              current=az(['containerapp','show','-g','rg-hidi-prod','-n',app,'--query','{image:properties.template.containers[0].image,ready:properties.latestReadyRevisionName,latest:properties.latestRevisionName}'])
              assert current['image']==registry+'/'+app+'@'+digest and current['ready']==current['latest'],'Live app changed after preflight; refusing mismatched backup.'
            for app,digest in expected.items():
              tag='rollback-photo-20261015-'+os.environ['GITHUB_RUN_ID'];entry={'app':app,'originalDigest':digest,'tag':app+':'+tag,'verified':False};report['copies'].append(entry)
              try:
                az(['acr','import','--name','acrhidiprod0927','--source',registry+'/'+app+'@'+digest,'--image',app+':'+tag])
                saved=az(['acr','repository','show','--name','acrhidiprod0927','--image',app+':'+tag,'--query','digest'])
                assert saved==digest,'Rollback tag digest differs from active source'
                entry['verified']=True;entry['verifiedDigest']=saved
              except Exception as e:entry['error']=str(e)
            for branch in ['backup/image-rollout-api-web-20261015','backup/image-rollout-landing-20261015','backup/image-tested-candidate-20261015']:
              line=subprocess.check_output(['git','ls-remote','origin','refs/heads/'+branch],text=True).strip()
              report['sourceBranches'][branch]=line.split()[0] if line else None
            report['applicationRollbackPreserved']=len(report['copies'])==2 and all(c['verified'] for c in report['copies'])
          except Exception as e:report['error']=str(e);report['applicationRollbackPreserved']=False
          finally:
            (root/'BACKUP.json').write_text(json.dumps(report,indent=2))
            lines=['# HIDI image rollout backup','', 'Production deployment: NOT PERFORMED','Database/Blob data: NOT CHANGED','', '| Application | Rollback tag | Digest verified |','|---|---|---|']
            for c in report['copies']:lines.append('| '+c['app']+' | '+c['tag']+' | '+str(c['verified'])+' |')
            lines+=['','## Source recovery branches']+['- '+k+': '+str(v) for k,v in report['sourceBranches'].items()]+['','## Limits','This preserves application manifests and source references. It is not a new SQL database backup or a Blob photograph copy. SQL recovery metadata could not be verified.','The image rollout remains blocked until all required release checks pass.']
            (root/'BACKUP.md').write_text('\n'.join(lines)+'\n');print(json.dumps(report,indent=2))
          assert report['applicationRollbackPreserved'],'Application backup verification did not complete.'
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: hidi-verified-application-backup
          path: reports/image-backup/
          retention-days: 30
