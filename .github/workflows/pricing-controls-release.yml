name: Published product pricing and private dress controls
on:
  push:
    branches: [migration/azure-sql-blob]
    paths: [deploy/pricing/**, .github/workflows/pricing-controls-release.yml]
  workflow_dispatch:
permissions:
  contents: read
  id-token: write
concurrency:
  group: hidi-hero-guarded-release
  queue: max
  cancel-in-progress: false
jobs:
  verify-and-release:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      HIDI_PLAYWRIGHT_MODULE: /tmp/hidi-pricing-browser/node_modules/playwright/index.mjs
      PLAYWRIGHT_BROWSERS_PATH: /tmp/hidi-pricing-browsers
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-node@v4
        with: {node-version: 24}
      - name: Pricing, private audiences, authentication boundaries and syntax
        run: |
          node --test deploy/pricing/model.test.mjs deploy/pricing/handler.test.mjs deploy/offers/model.test.mjs deploy/offers/handler.test.mjs
          python3 -m py_compile deploy/pricing/patch-runtime.py deploy/pricing/release.py
          python3 deploy/pricing/patch.test.py
          for file in deploy/pricing/*.mjs deploy/pricing/checkout.js; do node --check "$file"; done
      - name: Install exact-manifest backup tooling and three browser engines
        run: |
          sudo apt-get update -qq && sudo apt-get install -y skopeo
          npm install --prefix /tmp/hidi-pricing-browser --no-save playwright@1.62.1
          node /tmp/hidi-pricing-browser/node_modules/playwright/cli.js install --with-deps chromium firefox webkit
          node deploy/pricing/browser-test.mjs
      - uses: azure/login@v2
        with:
          client-id: 3d62eb64-29dc-48ee-ab35-093312bd50af
          tenant-id: e756fdc0-2646-4e94-ac4d-ed7c11f87f34
          subscription-id: 91d9572d-0f0b-47fe-802d-0eef36d7c719
      - name: Back up current live images and compose bounded overlays
        run: |
          az acr login --name acrhidiprod0927 --only-show-errors
          python3 deploy/pricing/release.py capture
          python3 deploy/pricing/release.py compose
          echo "HIDI_CANDIDATE_API=$RUNNER_TEMP/hidi-pricing-private/api/candidate-app" >> "$GITHUB_ENV"
          echo "HIDI_CANDIDATE_RUNTIME=$RUNNER_TEMP/hidi-pricing-private/web/candidate-app" >> "$GITHUB_ENV"
      - name: Verify actual checkout service and exact composed admin/storefront runtime
        run: |
          node deploy/pricing/api-test.mjs
          node deploy/pricing/candidate.mjs
          python3 deploy/pricing/release.py seal
      - name: Publish only tested images
        run: python3 deploy/pricing/release.py publish
      - uses: azure/login@v2
        with:
          client-id: 3d62eb64-29dc-48ee-ab35-093312bd50af
          tenant-id: e756fdc0-2646-4e94-ac4d-ed7c11f87f34
          subscription-id: 91d9572d-0f0b-47fe-802d-0eef36d7c719
      - name: Release with unchanged catalogue prices, settings and private audience
        id: apply
        timeout-minutes: 20
        run: timeout --signal=TERM --kill-after=10m 15m python3 deploy/pricing/release.py apply
      - name: Recover an interrupted owned rollout
        if: always() && env.WEB_IMAGE != '' && steps.apply.outcome != 'success'
        timeout-minutes: 15
        run: python3 deploy/pricing/release.py recover
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pricing-controls-${{ github.run_id }}-${{ github.run_attempt }}
          path: evidence/pricing
          retention-days: 30
