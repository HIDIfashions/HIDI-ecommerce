name: Mobile Quick Add Alignment Validation

on:
  push:
    branches:
      - fix/mobile-quick-add-heart-alignment

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/hidi_ci
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.15.1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm db:generate
      - run: pnpm test:customer-experience
      - run: pnpm --filter @hidi/web exec tsc --noEmit
      - run: pnpm --filter @hidi/web build
