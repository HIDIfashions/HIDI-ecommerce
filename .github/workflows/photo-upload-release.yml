name: Photo upload 12 MB guarded Azure release
on:
  push:
    branches: [migration/azure-sql-blob]
    paths: [.github/workflows/photo-upload-release.yml]
permissions:
  contents: read
  id-token: write
concurrency:
  group: hidi-hero-guarded-release
  cancel-in-progress: false
jobs:
  regression-and-release:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      DATABASE_URL: sqlserver://localhost:1433;database=hidi;user=fixture;password=fixture;encrypt=true
      NEXT_TELEMETRY_DISABLED: 1
      PLAYWRIGHT_BROWSERS_PATH: /tmp/hidi-photo-browsers
      HIDI_PLAYWRIGHT_MODULE: /tmp/hidi-photo-browser/node_modules/playwright/index.mjs
      HIDI_BROWSER_ENGINES: chromium,firefox,webkit
      HIDI_BUTTON_OUTPUT: evidence/photo-upload/browser
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: pnpm/action-setup@v4
        with: {version: 10.15.1}
      - uses: actions/setup-node@v4
        with: {node-version: 24, cache: pnpm}
      - name: Install retained dependencies and compile the pinned API baseline
        run: |
          set -euo pipefail
          pnpm install --frozen-lockfile
          pnpm db:generate
          python3 deploy/photo-upload/release.py baseline
      - name: Run commerce, upload boundaries and retained admin regression
        run: |
          set -euo pipefail
          pnpm --filter @hidi/api test:customer-experience
          node --test tests/*.test.cjs apps/web/lib/product-sharing.test.mjs
          node --test tests/admin-quick-tools.test.mjs tests/admin-product-bulk.test.mjs tests/admin-product-delete-handler.test.mjs
          python3 tests/photo-upload-release.test.py
          pnpm --filter @hidi/api build
      - name: Install three browser engines for the actual retained storefront
        run: |
          set -euo pipefail
          npm install --prefix /tmp/hidi-photo-browser --no-save playwright@1.56.1
          node /tmp/hidi-photo-browser/node_modules/playwright/cli.js install --with-deps chromium firefox webkit
      - uses: azure/login@v2
        with:
          client-id: 3d62eb64-29dc-48ee-ab35-093312bd50af
          tenant-id: e756fdc0-2646-4e94-ac4d-ed7c11f87f34
          subscription-id: 91d9572d-0f0b-47fe-802d-0eef36d7c719
      - name: Capture fresh live state and verify both rollback backups
        run: |
          set -euo pipefail
          az acr login --name acrhidiprod0927 --only-show-errors
          python3 deploy/photo-upload/release.py capture
          python3 deploy/photo-upload/release.py backup
      - name: Compose only the reviewed photo limits over the live images
        run: |
          set -euo pipefail
          for app in api web; do
            tag="acrhidiprod0927.azurecr.io/hidi-$app:photo12-${GITHUB_RUN_ID}"
            python3 deploy/photo-upload/release.py compose --app "$app" --tag "$tag"
            echo "CANDIDATE_${app^^}=$tag" >> "$GITHUB_ENV"
          done
      - name: Test full 12 MB multipart uploads and retained runtime and browser behavior
        env:
          HIDI_CANDIDATE_RUNTIME: ${{ runner.temp }}/hidi-photo-upload-private/web/candidate-app
        run: |
          set -euo pipefail
          node tests/photo-upload-candidate.mjs
          node tests/admin-quick-tools.runtime.mjs
          node tests/admin-product-delete.browser.mjs
          node tests/admin-navigation.browser.mjs
          node deploy/button-states/revert-candidate.mjs
      - name: Publish verified candidate images by immutable digest
        run: |
          set -euo pipefail
          for app in api web; do
            key="CANDIDATE_${app^^}"
            docker push "${!key}"
            digest="$(az acr repository show --name acrhidiprod0927 --image "hidi-$app:photo12-${GITHUB_RUN_ID}" --query digest -o tsv --only-show-errors)"
            echo "${app^^}_IMAGE=acrhidiprod0927.azurecr.io/hidi-$app@$digest" >> "$GITHUB_ENV"
          done
      - name: Expand API then web limits and verify live state with guarded rollback
        run: python3 deploy/photo-upload/release.py apply
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: photo-upload-12mb-${{ github.run_id }}
          path: |
            evidence/photo-upload
            test-results/admin-product-delete
            test-results/admin-navigation
          retention-days: 30

