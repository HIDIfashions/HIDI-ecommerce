name: Stop cancelled admin security owner sign-in
on:
  push:
    branches: [migration/azure-sql-blob]
    paths: [.github/workflows/admin-security-stop-owner.yml]
permissions:
  contents: read
  id-token: write
jobs:
  stop:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: azure/login@v2
        with:
          client-id: 3d62eb64-29dc-48ee-ab35-093312bd50af
          tenant-id: e756fdc0-2646-4e94-ac4d-ed7c11f87f34
          subscription-id: 91d9572d-0f0b-47fe-802d-0eef36d7c719
      - name: Stop only this chat's pending one-time owner job
        run: |
          az containerapp job stop -g rg-hidi-prod -n job-hidi-validation --job-execution-name job-hidi-validation-ehz91f4 --only-show-errors -o none
          az containerapp job execution list -g rg-hidi-prod -n job-hidi-validation --query "[?name=='job-hidi-validation-ehz91f4'].{name:name,status:properties.status}" --only-show-errors -o json
