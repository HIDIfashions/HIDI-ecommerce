name: Image complete application regression
on:
  push:
    branches: [work/image-optimization-20261015]
    paths:
      - '.github/workflows/image-complete-regression.yml'
      - 'deploy/image-optimization/streaming-candidate.py'
permissions:
  contents: write
concurrency:
  group: hidi-full-image-regression
  cancel-in-progress: false
jobs:
  complete:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      DATABASE_URL: 'sqlserver://localhost:1433;database=hidi;user=build;password=build;encrypt=true'
      API_URL: http://127.0.0.1:4100/v1
      NEXT_TELEMETRY_DISABLED: '1'
      PLAYWRIGHT_BROWSERS_PATH: ${{ github.workspace }}/.cache/image-full-browsers
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.sha }}
      - uses: pnpm/action-setup@v4
        with:
          version: 10.15.1
      - uses: actions/setup-node@v4
        with:
          node-version: '22.16.0'
          cache: pnpm
      - name: Install pinned application dependencies
        run: pnpm install --frozen-lockfile
      - name: Integrate streamed photo source on isolated branch
        run: |
          set -euo pipefail
          if ! grep -q 'readStreamedPhotoForm' 'apps/web/app/api/admin/inventory/[variantId]/images/route.ts'; then
            python deploy/image-optimization/streaming-candidate.py
          fi
          pnpm --filter @hidi/web add --save-exact busboy@1.6.0 sharp@0.34.1 @noble/hashes@1.8.0
          python - <<'PY'
          from pathlib import Path
          p=Path('tests/photo-upload-client.test.cjs')
          s=p.read_text().replace('const variants=[{sku:"HIDI-CREAM-M",variantId:"fixture_variant"}];','const variants=[]; // Exercise Image-SKU lookup, independently of stock SKU matching.')
          p.write_text(s)
          p=Path('deploy/image-optimization/streaming-photo.test.mjs')
          p.write_text(p.read_text().replace("()=>readStreamedPhotoForm(request(await fixture('png')", "async()=>readStreamedPhotoForm(request(await fixture('png')"))
          PY
          git add -u
          git add apps/web/lib/photo-upload-stream.d.mts apps/web/lib/photo-azure-stream.d.mts apps/web/lib/photo-digest.d.mts apps/api/prisma/migrations/20261015020000_photo_ticket_bigint/migration.sql
          if ! git diff --cached --quiet; then
            test "$GITHUB_REF" = refs/heads/work/image-optimization-20261015
            test "$(git ls-remote origin "$GITHUB_REF" | cut -f1)" = "$GITHUB_SHA"
            git -c user.name='HIDI image validation' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m '[image-candidate] Wire streamed uploads without fixed photo byte caps'
            git push origin HEAD:refs/heads/work/image-optimization-20261015
          fi
      - name: Install isolated image and browser test tools
        run: |
          npm install --prefix "$RUNNER_TEMP/image-tools" --no-audit --no-fund sharp@0.34.1 playwright@1.56.1
          echo "HIDI_TEST_SHARP=$RUNNER_TEMP/image-tools/node_modules/sharp" >> "$GITHUB_ENV"
          echo "HIDI_SHARP_MODULE=$RUNNER_TEMP/image-tools/node_modules/sharp" >> "$GITHUB_ENV"
          echo "HIDI_PLAYWRIGHT_MODULE=$RUNNER_TEMP/image-tools/node_modules/playwright/index.mjs" >> "$GITHUB_ENV"
          node "$RUNNER_TEMP/image-tools/node_modules/playwright/cli.js" install --with-deps chromium firefox webkit
      - name: Execute complete matrix and preserve failures
        run: python deploy/image-optimization/full-regression.py
      - name: Save complete test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: image-complete-regression-evidence
          path: |
            reports/image-complete/
            test-results/
            streaming-source-report.json
          retention-days: 14
      - name: Save read-only evidence branch, never production
        if: always()
        run: |
          if test -f reports/image-complete/results.json; then
            git add -f reports/image-complete
            git -c user.name='HIDI validation' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m '[test-evidence] Complete application results'
            git push origin "HEAD:refs/heads/evidence/image-complete-$GITHUB_RUN_ID"
          fi
      - name: Report a failed gate honestly
        if: always()
        run: |
          python - <<'PY'
          import json
          r=json.load(open('reports/image-complete/results.json'))
          assert all(s['status']=='PASS' for s in r['suites']), 'Some complete-application gates failed; see results and individual cases.'
          PY
