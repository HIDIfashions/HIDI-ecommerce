name: Integrate verified storefront surface repair
on:
  push:
    branches: [fix/storefront-surfaces-20260928]
    paths:
      - .github/workflows/apply-storefront-surfaces-once.yml
      - scripts/apply-storefront-surfaces-once.py
permissions:
  contents: read
concurrency:
  group: hidi-storefront-surface-integration
  cancel-in-progress: false
jobs:
  integrate-source:
    if: github.ref == 'refs/heads/fix/storefront-surfaces-20260928'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply only the locally verified source changes
        run: python3 scripts/apply-storefront-surfaces-once.py
      - name: Check the source and existing mobile-navigation contracts
        run: |
          git diff --check
          node --test tests/mobile-menu-layout.test.cjs tests/storefront-surfaces.test.cjs
      - name: Commit source and remove this one-time helper
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add apps/web
          git rm .github/workflows/apply-storefront-surfaces-once.yml scripts/apply-storefront-surfaces-once.py
          git commit -m 'Fix ivory surfaces, compact collection titles and preserve HIDI header'
          git push origin HEAD:fix/storefront-surfaces-20260928
          git rev-parse HEAD
