name: Remove HIDI Lookbook links and redirect retired page
on:
  push:
    branches: [migration/azure-sql-blob]
    paths: [deploy/lookbook-removal/**, .github/workflows/lookbook-removal-release.yml]
  workflow_dispatch:
permissions:
  contents: read
  id-token: write
concurrency:
  group: hidi-hero-guarded-release
  cancel-in-progress: false
jobs:
  release:
    if: github.ref == 'refs/heads/migration/azure-sql-blob'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      HIDI_PLAYWRIGHT_MODULE: /tmp/hidi-lookbook-browser/node_modules/playwright/index.mjs
      PLAYWRIGHT_BROWSERS_PATH: /tmp/hidi-lookbook-browsers
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-node@v4
        with: {node-version: 24}
      - name: Check catalogue alias and release syntax
        run: |
          node --test deploy/lookbook-removal/handler.test.mjs
          python3 deploy/lookbook-removal/patch.test.py
          node --check deploy/lookbook-removal/probes.mjs
          node --check deploy/lookbook-removal/candidate.mjs
          python3 -m py_compile deploy/lookbook-removal/patch-runtime.py deploy/lookbook-removal/release.py
      - name: Install exact-manifest backup tooling
        run: sudo apt-get update -qq && sudo apt-get install -y skopeo
      - name: Install desktop and mobile browser test engines
        run: |
          npm install --prefix /tmp/hidi-lookbook-browser --no-save playwright@1.56.1
          node /tmp/hidi-lookbook-browser/node_modules/playwright/cli.js install --with-deps chromium firefox webkit
      - uses: azure/login@v2
        with:
          client-id: 3d62eb64-29dc-48ee-ab35-093312bd50af
          tenant-id: e756fdc0-2646-4e94-ac4d-ed7c11f87f34
          subscription-id: 91d9572d-0f0b-47fe-802d-0eef36d7c719
      - name: Capture live image and verify exact rollback backup
        run: |
          az acr login --name acrhidiprod0927 --only-show-errors
          python3 deploy/lookbook-removal/release.py capture
          echo "HIDI_CANDIDATE_RUNTIME=$RUNNER_TEMP/hidi-lookbook-removal-private/web/candidate-app" >> "$GITHUB_ENV"
      - name: Add only the catalogue alias to the current live runtime
        run: python3 deploy/lookbook-removal/release.py compose
      - name: Verify bag navigation against the actual candidate in six browser and viewport combinations
        run: |
          node deploy/lookbook-removal/candidate.mjs
          python3 deploy/lookbook-removal/release.py seal
      - name: Publish the exact tested web image
        run: python3 deploy/lookbook-removal/release.py publish
      - uses: azure/login@v2
        with:
          client-id: 3d62eb64-29dc-48ee-ab35-093312bd50af
          tenant-id: e756fdc0-2646-4e94-ac4d-ed7c11f87f34
          subscription-id: 91d9572d-0f0b-47fe-802d-0eef36d7c719
      - name: Release web and verify Lookbook removal
        id: apply
        timeout-minutes: 20
        run: timeout --signal=TERM --kill-after=10m 15m python3 deploy/lookbook-removal/release.py apply --image "$WEB_IMAGE"
      - name: Recover an interrupted owned rollout
        if: always() && env.WEB_IMAGE != '' && steps.apply.outcome != 'success'
        timeout-minutes: 15
        run: python3 deploy/lookbook-removal/release.py recover --image "$WEB_IMAGE"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lookbook-removal-regression-${{ github.run_id }}-${{ github.run_attempt }}
          path: evidence/lookbook-removal
          retention-days: 30
