name: Diagnose Firefox tablet height without deployment
on:
  push:
    branches: [fix/pdp-tablet-diagnosis-20261023]
permissions:
  contents: read
jobs:
  diagnose:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '24'}
      - run: npm install --prefix "$RUNNER_TEMP/tablet-browser" --registry=https://registry.npmjs.org --fetch-timeout=30000 --fetch-retries=1 playwright@1.56.1
      - run: node "$RUNNER_TEMP/tablet-browser/node_modules/playwright/cli.js" install firefox
      - name: Check restored production tablet height and CSS parity
        run: HIDI_PLAYWRIGHT_MODULE="$RUNNER_TEMP/tablet-browser/node_modules/playwright/index.mjs" node deploy/pdp-layout/tablet-diagnostic.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pdp-tablet-diagnostic
          path: outputs/tablet-diagnostic
