name: Inspect delivery sync production readiness
on:
  push:
    branches: [migration/azure-sql-blob]
    paths: [.github/workflows/delivery-sync-inspect.yml]
  workflow_dispatch:
permissions:
  contents: read
  id-token: write
jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: azure/login@v2
        with:
          client-id: 3d62eb64-29dc-48ee-ab35-093312bd50af
          tenant-id: e756fdc0-2646-4e94-ac4d-ed7c11f87f34
          subscription-id: 91d9572d-0f0b-47fe-802d-0eef36d7c719
      - run: az acr login --name acrhidiprod0927 --only-show-errors
      - run: python3 deploy/delivery-sync/inspect.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: delivery-sync-inspection
          path: evidence/delivery-sync-inspect
          retention-days: 7
          include-hidden-files: true
