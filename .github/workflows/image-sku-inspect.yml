name: Inspect retained Image SKU import and photo runtime
on:
  push:
    branches: [migration/azure-sql-blob]
    paths: [.github/workflows/image-sku-inspect.yml]
permissions:
  contents: read
  id-token: write
concurrency:
  group: hidi-hero-guarded-release
  cancel-in-progress: false
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: azure/login@v2
        with:
          client-id: 3d62eb64-29dc-48ee-ab35-093312bd50af
          tenant-id: e756fdc0-2646-4e94-ac4d-ed7c11f87f34
          subscription-id: 91d9572d-0f0b-47fe-802d-0eef36d7c719
      - run: |
          az acr login --name acrhidiprod0927 --only-show-errors
          python3 - <<'PY'
          import importlib.util, tarfile
          spec=importlib.util.spec_from_file_location('inspect_bulk','deploy/bulk-publish/release.py');m=importlib.util.module_from_spec(spec);spec.loader.exec_module(m)
          m.inspect()
          with tarfile.open(m.EVIDENCE/'photo-runtime.tar.gz','w:gz') as archive:
              for app,name in [('api','apps/api/dist/admin/admin-inventory.service.js'),('api','apps/api/dist/admin/admin.controller.js'),('web','apps/web/.next/server/app/api/admin/inventory/[variantId]/images/route.js')]:
                  archive.add(m.PRIVATE/app/'base-app'/name,arcname=name)
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: image-sku-runtime-inspection-${{ github.run_id }}
          path: evidence/bulk-publish
          retention-days: 30
