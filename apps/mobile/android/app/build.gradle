apply plugin: "com.android.application"
apply plugin: "org.jetbrains.kotlin.android"
apply plugin: "com.facebook.react"

react {
    autolinkLibrariesWithApp()
    extraPackagerArgs = ["--max-workers", "2"]
}
android {
    ndkVersion rootProject.ext.ndkVersion
    buildToolsVersion rootProject.ext.buildToolsVersion
    compileSdk rootProject.ext.compileSdkVersion
    namespace "com.thehidi.app"
    defaultConfig {
        // Test installs cannot replace the customer's production application.
        applicationId project.findProperty("hidiInternalBuild") == "true" ? "com.thehidi.app.internal" : "com.thehidi.app"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 1
        versionName "0.1.0"
    }
    buildTypes {
        debug { }
        release {
            // No production signing credentials in the repository. CI signs only an internal test artifact.
            minifyEnabled true
            proguardFiles getDefaultProguardFile("proguard-android-optimize.txt"), "proguard-rules.pro"
            ndk { debugSymbolLevel "SYMBOL_TABLE" }
        }
    }
}
dependencies {
    implementation("com.facebook.react:react-android")
    implementation("androidx.core:core-splashscreen:1.0.1")
    // This verified configuration uses Hermes, avoiding an unpinned alternate runtime.
    if (!hermesEnabled.toBoolean()) throw new GradleException("HIDI release validation requires the pinned Hermes runtime")
    implementation("com.facebook.react:hermes-android")
}
