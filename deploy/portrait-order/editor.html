<section class="card portrait-order" id="portraitOrder" aria-labelledby="portraitOrderTitle">
  <h2 id="portraitOrderTitle">Ananya’s Pick · Dress sequence</h2>
  <p class="hint">Move a dress up or down. Its photo, heading and caption stay together. The first dress appears first on the homepage.</p>
  <ol id="portraitOrderList" aria-label="Dress sequence"></ol>
  <div class="portrait-order-preview" aria-label="Sequence preview"><p class="hint">Preview · left to right</p><div id="portraitOrderPreview"></div></div>
  <div class="actions"><button type="button" class="btn" id="portraitOrderSave" disabled>Save order</button><button type="button" class="btn secondary" id="portraitOrderReload">Reload saved order</button><button type="button" class="btn secondary" id="portraitOrderDefault" disabled>Use original order</button></div>
  <p class="message" id="portraitOrderStatus" role="status" aria-live="polite">Loading dress sequence…</p>
</section>
