<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Staff sign in | HIDI Admin</title><link rel="stylesheet" href="/admin-security-assets/styles.css"><script type="module" src="/admin-security-assets/login.mjs"></script></head><body><main class="login"><a class="brand" href="/">HIDI <small>ADMIN</small></a><h1>Staff sign in</h1><p>Enter the code sent to your authorised email. A fresh code is required each time you sign in, including on this device.</p><form id="email-form"><label for="email">Admin email</label><input id="email" type="email" autocomplete="username" required maxlength="254"><button id="send">Send sign-in code</button></form><form id="otp-form" hidden><label for="otp">8-digit email code</label><input id="otp" inputmode="numeric" autocomplete="one-time-code" pattern="[0-9]{8}" minlength="8" maxlength="8" required><button id="verify">Verify and sign in</button></form><p id="status" role="status" aria-live="polite"></p><p id="error" role="alert"></p><small>Your admin session ends after one hour without activity.</small></main></body></html>
